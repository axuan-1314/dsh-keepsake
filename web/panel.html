// ============ 管道健康卡 + 提取模型卡（布局 + 模型可视化） ============
// /state 新字段 tolerant 消费（host 契约）：新服务端恒在、缺失=旧版。
// 三态判定/文案/短名/相对时间全走 panel-logic 纯函数（双端一致）；
// recent[].message 是上游错误串不可信，渲染必过 esc()。
let pipePollTimer = null; // streak>0 期间 5s 本地轮询；render() 切路由统一清
let pipeRetryBusy = false; // 手动重试轮询在途——5s 轮询让位（避免卡片重渲染打断按钮 busy 态）

function stopPipePoll() {
  if (pipePollTimer) { clearInterval(pipePollTimer); pipePollTimer = null; }
}

/** 分桶 badge 行（零值不渲染——零桶平铺只会稀释病灶）。 */
function pipeBucketsHtml(ef) {
  const badges = L.EXTRACTION_BUCKET_KEYS
    .filter((k) => Number(ef && ef[k] != null ? ef[k] : 0) > 0)
    .map((k) => `<span class="badge">${esc(k)} ${Number(ef[k])}</span>`);
  return badges.length > 0 ? badges.join(" ") : '<span class="meta">无失败计数</span>';
}

/** aside 设置项红徽标（连击>0 才显示；刷新计数/健康卡轮询顺路更新）。 */
function updateStreakBadge(streak) {
  const el = document.querySelector('[data-cnt="extraction-streak"]');
  if (el) el.textContent = streak > 0 ? String(streak) : "";
}

/** 最近提取记录折叠区（/state.extractionLog.runs；缺失/空 = 旧版宿主或无记录，不渲染）。
 *  为什么单独一块：三态灯只答"最近健康不健康"，答不了"上次到底写了没有"；runs 是把提取
 *  管线一日的行为摊开给人看的唯一面。上限 12 行——再多信息密度反而压过病灶，余量如实报数。
 *  行模型/文案全走 L.extractionRunLines + L.extractionRunLabel，双端不漂移。 */
function pipeExtractionLogHtml(data, limit = 12) {
  const lines = L.extractionRunLines(data.extractionLog);
  if (lines.length === 0) return "";
  const rows = lines.slice(0, limit).map((r) => `
      <tr><td class="meta">${esc(L.relativeTimeOf(r.at))}</td><td class="meta">${esc(r.range || "—")}</td><td>${esc(r.label)}${r.sessionId ? `<span class="meta"> · ${esc(r.sessionId)}</span>` : ""}</td></tr>`).join("");
  const rest = lines.length - Math.min(lines.length, limit);
  return `
      <details style="margin:8px 0 0"><summary class="meta" style="cursor:pointer">最近提取记录（${lines.length} 条）</summary>
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:92px">时间</th><th style="width:110px">范围</th><th>结果</th></tr>
          ${rows}
          ${rest > 0 ? `<tr><td colspan="3" class="meta">还有 ${rest} 条未显示（仅保留最近 ${limit} 条）。</td></tr>` : ""}
        </table></div>
      </details>`;
}

/** 补提重试轮询窗口：单次提取超时 × 重试次数，夹在 [60s, 10min]。
 *  新契约 /state.extractionTimeoutMs / extractionRetryAttempts 缺失=旧版 → 走缺省 120s × 3。
 *  真实提取链耗时 ≈ retryAttempts × timeoutMs + 退避，窗口太短会误报"未恢复"。 */
function retryPollWindowMs(st) {
  const s = st && typeof st === "object" ? st : {};
  const to = Number(s.extractionTimeoutMs);
  const attempts = Number(s.extractionRetryAttempts);
  const timeoutMs = Number.isFinite(to) && to > 0 ? to : 120000;
  const n = Number.isFinite(attempts) && attempts > 0 ? attempts : 3;
  return Math.min(10 * 60_000, Math.max(60_000, timeoutMs * n));
}

/** 管道健康卡：三态灯 + 分桶 + 最近 5 条详情 + 错过区间 + 失败日志 + 重试/诊断按钮。
 *  绿态折叠一行摘要；红/黄/在途展开病灶。
 *  状态优先级（绿红并置修正）：数据损坏/只读 > 未恢复区间 > 已放弃 > 「最近无失败」绿行。
 *  老逻辑里绿灯只看 streak/inFlight，出现「最近无失败」与「有区间没提取上」红条并置——
 *  两条都真但并置读不通。现在优先级走 L.healthPriorityLevel 显式判定，有未恢复/已放弃
 *  区间时绿行让位（canShowNoFailureLine 为假），状态词同步改口。 */
function buildPipeHealthCard(data) {
  const efRaw = data.extractionFailures;
  const ef = efRaw && typeof efRaw === "object" ? efRaw : null;
  const streak = L.extractionStreakOf(efRaw);
  const inFlight = data.extractionInFlight === true;
  const level = L.pipeHealthLevel(efRaw, { inFlight });
  const dotCls = level === "green" ? "green" : level === "yellow" ? "yellow" : level === "red" ? "red" : "grey";
  // 状态优先级（显式）：有未恢复/已放弃区间时不许显示「最近无失败」绿行（并置自相矛盾）
  const priority = L.healthPriorityLevel(data);
  const allowGreenLine = L.canShowNoFailureLine(priority);
  // 状态词：颜色之外的第二编码（色弱/灰度屏也能读），与灯同 aria 标注。
  // 绿灯但优先级非绿（有未恢复/已放弃区间）→ 改用优先级词，灯仍按 streak 三态。
  const statusWord = level === "green"
    ? (allowGreenLine ? "正常" : L.healthPriorityWord(priority))
    : level === "yellow" ? "告警" : level === "red" ? "失败" : "进行中";
  const statusCls = level === "green" && !allowGreenLine ? "yellow" : dotCls; // 灯色随优先级降级
  const hasDetail = ef !== null && Array.isArray(ef.recent); // recent 缺失=旧服务端
  // 未恢复区间双源（提前算，绿态摘要文案要用）：内存态 lastFailedRange 在场照旧
  // （extractionRangeText 自带 streak≥1 门），否则回落盘侧 extractionLog.unrecovered——
  // lastFailedRange 是进程内存态，DSH 一重启就归零，没有第二源的话失败区间会跨重启彻底隐身。
  const memRangeText = L.extractionRangeText(efRaw, data.lastFailedRange);
  const diskRangeText = memRangeText ? "" : L.unrecoveredTextFromLog(data.extractionLog && data.extractionLog.unrecovered);
  const parts = [];
  if (level === "green" && allowGreenLine) {
    // 绿态折叠：健康时只占一行；notice ok 复用三态色板。
    // 有未恢复/已放弃区间时（allowGreenLine=false）整段不渲染——让位给下方红条，
    // 不再出现「最近无失败」与「有区间没提取上」并置（两条都真，但并置读不通）。
    const at = data.lastAttemptAt ? ` · 上次尝试 ${L.relativeTimeOf(data.lastAttemptAt)}` : "";
    parts.push(`<div class="notice show ok" style="margin:6px 0 0">最近无失败${at}</div>`);
  } else if (level !== "green") {
    if (level === "red") {
      const notice = L.extractionNoticeText(efRaw); // 与门牌红条同文案（双端一致）
      if (notice) parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(notice)}</div>`);
    } else if (level === "yellow") {
      parts.push('<div class="notice show" style="margin:6px 0 0">近期有过提取失败或重试，现已自动恢复——下方计数供回看。</div>');
    } else {
      parts.push('<div class="meta" style="margin:6px 0 0">正在提取，结束后状态自动刷新。</div>');
    }
    parts.push(`<div style="margin:8px 0 2px">${pipeBucketsHtml(ef)}</div>`);
    if (!hasDetail) {
      // 旧服务端：桶照展示（存量字段），详情面没有就不装样子（与"recent:[]"不同文案）
      parts.push('<div class="meta">宿主版本较旧，未提供失败详情（升级宿主后可见最近 5 条病因与失败日志）。</div>');
    } else {
      const rows = ef.recent.slice(0, 5).map((r) => {
        const msg = String(r && r.message != null ? r.message : "");
        const short = msg.length > 60 ? msg.slice(0, 60) + "…" : msg;
        // reason 列与"最近提取记录"结果列同口径：一律经 L.reasonLabelOf 中文化，
        // 面板上绝不出现 no-route / llm-error 这类英文枚举（复查点名的遗留缺口）。
        return `<tr><td class="meta">${esc(L.relativeTimeOf(r && r.at))}</td><td>${esc(L.reasonLabelOf(r && r.reason))}</td><td class="meta">${esc(L.modelShortName(r && r.model) || "—")}</td><td class="meta" title="${esc(msg)}">${esc(short)}</td></tr>`;
      }).join("");
      parts.push(`
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:92px">时间</th><th style="width:96px">原因</th><th style="width:150px">模型</th><th>摘要</th></tr>
          ${rows.length > 0 ? rows : '<tr><td colspan="4" class="meta">暂无最近失败详情。</td></tr>'}
        </table></div>`);
      // 失败日志入口（storageRoot 顶层字段缺失时只显示文件名）
      const logPath = data.storageRoot ? String(data.storageRoot).replace(/[\\/]+$/, "") + "/extraction-errors.log" : "extraction-errors.log";
      parts.push(`<div class="meta" style="margin-top:4px">失败日志：<code class="k">${esc(logPath)}</code></div>`);
    }
  }
  // 未恢复区间红条放在三态分支**之外**：重启后内存态失败计数也是空的（卡片会是绿态），
  // 恰恰这时最需要盘侧来源顶上。补提口径分源，不许空承诺：
  //   内存态 = 会话还活着（cursor 没推进），下一轮自动重提/立即重试都够得着；
  //   盘侧 = 重启前遗留，会话可能已释放——retryPending 只遍历在场会话（state.js），
  //          必须说清"要先重开该会话"，否则红条说可补提、按钮说没得补。
  const rangeText = memRangeText || diskRangeText;
  if (rangeText) {
    const tail = memRangeText
      ? "，下一轮自动重提。"
      : "（重启前遗留；在该会话里继续对话，或重开该会话后点「立即重试提取」，即可补提）";
    parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(rangeText)}${tail}</div>`);
  }
  // 已放弃区间（连续失败过多被放弃、游标已推进）：盘侧 journal 持久可见，
  // 不随后来任意一轮成功而消失——这部分记忆不会自动补上，必须留痕让用户知道。
  const abandonedLine = L.abandonedNoticeText(data.extractionLog && data.extractionLog.abandoned);
  if (abandonedLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(abandonedLine)}</div>`);
  // 注入面一行（消息通道注入健康）——无数据（旧版宿主/0 次）不显示，改动静默
  // 写入安全面一行（八段摘要：回收站待清/校验失败/硬事实拦截/硬事实丢失/盲写降级/sha1 不符拒写/批锁冲突/快照失败）
  //   /state.safety 缺失（旧版宿主）→ safetySummaryText 返回 null，不渲染（tolerant 消费）。
  const safetyLine = L.safetySummaryText(data.safety);
  if (safetyLine) parts.push(`<div class="meta" style="margin:4px 0 0">${esc(safetyLine)}</div>`);
  // 纠错面一行（已纠正次数 + 未生效次数）——/state.corrections 缺失（旧版宿主）→ null 不渲染。
  const correctionsLine = L.correctionsSummary(data.corrections);
  if (correctionsLine) parts.push(`<div class="meta" style="margin:4px 0 0">纠正：${esc(correctionsLine)}</div>`);
  // 空闲整理一行（运行/合并/挡回）——/state.idleReview 缺失（旧版宿主）→ null 不渲染。
  // 挡回必须可见：否则用户只看到「开关开着、一次都没跑」，原因在界面上不存在。
  const idleLine = L.idleReviewSummary(data.idleReview);
  if (idleLine) parts.push(`<div class="meta" style="margin:4px 0 0">整理：${esc(idleLine)}</div>`);
  // 知识页生成面一行（生成次数 + 失败次数）——此前这些计数只记账、面板零消费。
  const pagesLine = L.pagesGenerationSummary(data.pages);
  if (pagesLine) parts.push(`<div class="meta" style="margin:4px 0 0">知识页：${esc(pagesLine)}</div>`);
  // 思考档降级摘要（该路由不支持所配档位 → 已按模型默认档重发 N 次）——
  // 只进 journal/log.warn 的话用户既不知道发生了、也无从判断要不要换档位。
  // 零值/旧宿主（无 reasoningDegraded 字段）→ null 不渲染（不印 0 装饰）。
  const degradedLine = L.reasoningDegradedText(efRaw);
  if (degradedLine) parts.push(`<div class="meta" style="margin:4px 0 0">${esc(degradedLine)}</div>`);
  // 零正文逃逸摘要（显式输出上限被思考吃光 → 改跟随模型重发成功 N 次）——
  // 这是"上限配小了"的明确信号；零值/旧宿主（无 escapeRetried 字段）→ null 不渲染。
  const escapeLine = L.escapeRetriedText(efRaw);
  if (escapeLine) parts.push(`<div class="meta" style="margin:4px 0 0">${esc(escapeLine)}</div>`);
  const injectionLine = L.injectionSummary(data.injection);
  if (injectionLine) {
    // 预算占用段：token 预算 >0 且服务端带 lastTokens 时附「最近 ≈X tokens / 上限 Y」；
    // 否则空串（0=禁用 token 预算档/旧服务端）——维持纯字符展示，不印"上限 0"。
    const budgetText = L.injectionBudgetText(data.injection, data.injectMaxTokens);
    parts.push(`<div class="meta" style="margin:4px 0 0">注入：${esc(injectionLine)}${budgetText ? ` · ${esc(budgetText)}` : ""}</div>`);
  }
  // 最近提取记录（runs 空/缺 extractionLog = 旧版宿主或尚无提取，整块不渲染）
  const logBlock = pipeExtractionLogHtml(data);
  if (logBlock) parts.push(logBlock);
  // 存储格式只读告警——数据由更新版插件写入时显示（正常/旧版宿主不渲染；显式可见不静默）
  const formatLine = L.formatNoticeText(data.format);
  if (formatLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">⚠️ ${esc(formatLine)}</div>`);
  // 语义召回红条（两类故障分开，见 panel-logic 顶部注释）：
  //   ① 静态配置类——开了召回但端点/模型缺失、或 injectChannel 不是 message：
  //      插件照常加载（此前是启动即抛），召回被显式关闭，这里说清缺什么、去哪补。
  //   ② 运行时故障类——端点配了但连不上/超时/HTTP 错：既有熔断语义不改，这里只让它可见。
  // 两者互斥显示：配置都没配齐就谈不上运行时故障（errors 恒 0）；配置齐了才可能连不上。
  // 设置文件真实路径：storageRoot 可配（lib/paths.js），写死 ~/.dsh 会给自定义路径的用户指错路。
  const settingsFilePath = data.storageRoot ? String(data.storageRoot).replace(/[\\/]+$/, "") + "/settings.json" : null;
  const recallDisabledLine = L.recallDisabledNoticeText(data.recallDiagnostics, settingsFilePath);
  if (recallDisabledLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">⚠️ ${esc(recallDisabledLine)}</div>`);
  const recallFailureLine = recallDisabledLine === null ? L.recallRuntimeFailureText(data.recall) : null;
  if (recallFailureLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">⚠️ ${esc(recallFailureLine)}</div>`);
  const card = document.createElement("div");
  card.className = "card";
  card.id = "data-pipe-health"; // 门牌「详情」深链滚动锚点
  // 留一份最近 /state 供补提卡刷新时取（pending 端点只要会话探测，轮询窗口要 state 的提取超时口径）
  window.__dshLastState = data;
  card.innerHTML = `
    <h3><span class="dot ${statusCls}" role="img" aria-label="状态：${statusWord}"></span><span class="statusWord ${statusCls}" title="自动提取管道状态">${statusWord}</span>自动提取管道${inFlight ? '<span class="badge">提取中…</span>' : ""}
      <span class="ops">
        <button class="btn sm" data-retryExtract>立即重试提取</button>
        <button class="btn sm" data-copyDiag>复制诊断信息</button>
      </span>
    </h3>
    <div data-pendingRecover></div>
    ${parts.join("")}`;
  // 补提清单块（异步拉取；失败就地显示可读说明，不影响健康卡其余部分）
  card.querySelector("[data-pendingRecover]").replaceWith(buildPendingCard(data));
  card.querySelector("[data-copyDiag]").addEventListener("click", async () => {
    let text;
    try {
      text = L.diagnosticTextOf(data);
    } catch {
      text = JSON.stringify(data, null, 2); // 纯函数组装失败兜底：原始 state 也比空强
    }
    try {
      await navigator.clipboard.writeText(text);
      toast("诊断信息已复制（可直接粘贴到 issue）");
    } catch (err) { toast("复制失败：" + err.message, "err"); }
  });
  const retryBtn = card.querySelector("[data-retryExtract]");
  retryBtn.addEventListener("click", () => {
    confirmDialog({
      title: "立即重试提取",
      body: "将对仍有未提取区间的会话真的发起一次 LLM 提取（消耗少量 token）。\n期间对话不受影响；结果以这里的管道状态为准。",
      dangerText: "发起重试",
      onConfirm: async () => {
        retryBtn.disabled = true; // 三段式：202 后 busy，绝不同步 toast 成功
        retryBtn.textContent = "提取中…";
        let out;
        try {
          out = await apiPost("extract/retry"); // 202 {ok,triggered}；409 抛错文案直接透传
        } catch (err) {
          retryBtn.disabled = false;
          retryBtn.textContent = "立即重试提取";
          toast(err.message, "err");
          return;
        }
        if (Number(out && out.triggered) === 0) {
          retryBtn.disabled = false;
          retryBtn.textContent = "立即重试提取";
          toast("当前没有待重试的提取区间");
          return;
        }
        // 轮询窗口按「单次提取超时 × 重试次数」推导（下限 60s 托底、上限 10 分钟封顶），
        // 每 2s 轮询 /state，看 streak 清零才算恢复——此路径绝不再次调 retry
        pipeRetryBusy = true;
        const pollWindowMs = retryPollWindowMs(data);
        const deadline = Date.now() + pollWindowMs;
        const poll = async () => {
          let st = null;
          try { st = await api("state"); } catch { /* 单次拉取失败：继续轮 */ }
          if (st && L.extractionStreakOf(st.extractionFailures) === 0) {
            pipeRetryBusy = false;
            toast("提取已恢复");
            refreshPipeCards(); // 流程结束重取 /state 重渲染健康卡
            return;
          }
          if (Date.now() >= deadline) {
            pipeRetryBusy = false;
            // 超时如实说：窗口内没等到状态翻转，但提取可能仍在进行（不是"失败"）
            toast("等待超时：重试后仍未恢复，提取可能仍在进行——可稍后回来查看失败详情", "err");
            refreshPipeCards();
            return;
          }
          setTimeout(poll, 2000);
        };
        setTimeout(poll, 2000);
      },
    });
  });
  return card;
}

// ============ 未恢复/已放弃区间（补提 UI：GET /sessions/pending + POST /sessions/recover） ============
// 契约（后端定死）：items 按 at 降序；kind: failed=未恢复 / abandoned=已放弃；
//   sessionAvailable=false → 不空承诺（如实说明要重开会话）；hostSupported=false → 整块说明。
// 节奏：点击「补提」→ busy 三段式 → 202 后按提取超时口径轮询 pending（retryPollWindowMs 推导）
//   → 该行消失（从清单移除）即成功；窗口内没消失 → 如实说可能仍在跑，提示可回看。
let pendingPollTimer = null;

function stopPendingPoll() {
  if (pendingPollTimer) { clearTimeout(pendingPollTimer); pendingPollTimer = null; }
}

/** 补提清单卡（管道健康卡内嵌块）：hostSupported=false / 空 / 行列表三态。 */
function buildPendingCard(state) {
  const host = document.createElement("div");
  host.id = "data-pending-recover";
  host.innerHTML = '<div class="meta" style="margin:6px 0 0">正在读取待补提区间…</div>';
  // 异步拉取：pending 端点失败（旧宿主/路由未注册）→ 就地显示可重试，不炸健康卡
  api("sessions/pending")
    .then((out) => {
      const items = Array.isArray(out && out.items) ? out.items : [];
      if (items.length === 0) {
        host.innerHTML = `<div class="meta" style="margin:6px 0 0">${esc(L.PENDING_EMPTY_TEXT)}</div>`;
        return;
      }
      const hostNote = L.pendingHostNote(out && out.hostSupported);
      host.innerHTML = `
        <div class="meta" style="margin:8px 0 2px">待补提区间（${items.length} 段）：重开对应会话后点「补提」即可续上；只提示，不自动合并。</div>
        ${hostNote ? `<div class="notice show" style="margin:4px 0">${esc(hostNote)}</div>` : ""}
        <div class="tableScroll"><table class="preview" data-pendingTable>
          <tr><th style="width:130px">状态</th><th>区间与原因</th><th style="width:88px"></th></tr>
          ${items.map((it, i) => {
            const label = L.pendingItemLabel(it);
            const avail = it && it.sessionAvailable === true;
            const note = avail ? "" : `<div class="meta">${esc(L.PENDING_UNAVAILABLE_NOTE)}</div>`;
            return `<tr data-prow="${i}"><td>${esc(String(it && it.kind) === "abandoned" ? "已放弃" : "未恢复")}</td><td>${esc(label || "—")}${note}</td><td>${avail ? `<button class="btn sm" data-recover="${i}">补提</button>` : '<span class="meta">不可补提</span>'}</td></tr>`;
          }).join("")}
        </table></div>`;
      // 逐行「补提」：202 → busy → 轮询 pending 至该行消失；409 忙 / 404 会话不在 / 503 不支持 → 如实提示
      for (const btn of Array.from(host.querySelectorAll("[data-recover]"))) {
        btn.addEventListener("click", async () => {
          const i = Number(btn.getAttribute("data-recover"));
          const it = items[i];
          btn.disabled = true; btn.textContent = L.PENDING_RECOVERING_TEXT; // 三段式 busy
          let started = false;
          try {
            const out2 = await apiPost("sessions/recover", { sessionId: it.sessionId, from: it.from, to: it.to });
            started = out2 && out2.started === true;
          } catch (err) {
            btn.disabled = false; btn.textContent = "补提";
            toast("补提发起失败：" + err.message, "err");
            return;
          }
          if (!started) {
            btn.disabled = false; btn.textContent = "补提";
            toast("补提未能启动（服务端未确认开始）", "err");
            return;
          }
          // 轮询窗口按提取超时口径推导（与「立即重试提取」同一把尺：timeoutMs × attempts 夹 [60s,10min]）
          const deadline = Date.now() + retryPollWindowMs(state);
          const poll = async () => {
            let snap = null;
            try { snap = await api("sessions/pending"); } catch { /* 单次拉取失败：继续轮 */ }
            const gone = snap && Array.isArray(snap.items)
              && !snap.items.some((x) => x && String(x.sessionId) === String(it.sessionId) && Number(x.from) === Number(it.from));
            if (gone) {
              stopPendingPoll();
              toast("补提已结束，该区间已从待补列表移除");
              refreshPendingCard();
              return;
            }
            if (Date.now() >= deadline) {
              stopPendingPoll();
              // 超时如实说：没等到行消失，但提取可能仍在进行（不是失败）
              toast("等待超时：该区间仍在待补列表，补提可能仍在进行——可稍后回来查看", "err");
              btn.disabled = false; btn.textContent = "补提";
              return;
            }
            pendingPollTimer = setTimeout(poll, 2000);
          };
          stopPendingPoll();
          setTimeout(poll, 2000);
        });
      }
    })
    .catch((err) => {
      // 端点不可达（旧宿主未注册该路由）：整块隐藏而非报错——pending 是增益面，不是主干
      host.innerHTML = `<div class="meta" style="margin:6px 0 0">待补提区间暂不可读（${esc(err.message)}）</div>`;
    });
  return host;
}

/** 就地刷新补提卡（补提流程结束 / 健康卡刷新时顺路）。 */
function refreshPendingCard() {
  const host = document.getElementById("data-pending-recover");
  if (!host) return;
  const health = document.getElementById("data-pipe-health");
  if (!health) return;
  // 重建：直接替换 DOM（buildPendingCard 自带拉取），按钮 busy 态随重建复位
  const fresh = buildPendingCard(window.__dshLastState ?? {});
  host.replaceWith(fresh);
}

/** 提取模型卡（两个诚实字段 + 嵌入召回配置）：config 如实展示，
 *  实时跟随值（sessionStates）API 层摸不到，不装样子。 */
function buildPipeModelCard(data) {
  const cfg = data.extractionConfig && typeof data.extractionConfig === "object" ? data.extractionConfig : {};
  const used = data.lastUsedRoute && typeof data.lastUsedRoute === "object" ? data.lastUsedRoute : null;
  const emb = data.embeddingConfig && typeof data.embeddingConfig === "object" ? data.embeddingConfig : {};
  const fb = Array.isArray(cfg.fallback) ? cfg.fallback : [];
  const route = cfg.provider || cfg.model
    ? `${esc(cfg.provider ?? "—")} / ${esc(cfg.model ?? "—")}`
    : "未指定（跟随会话路由）";
  const fbText = fb.length > 0 ? fb.map((f) => `${esc(f && f.provider ? f.provider : "—")} / ${esc(f && f.model ? f.model : "—")}`).join("、") : "无";
  const usedText = used
    ? `${esc(used.provider ?? "—")} / ${esc(used.model ?? "—")} · ${L.relativeTimeOf(used.at)}`
    : "尚未有提取";
  const embText = emb.provider || emb.model
    ? `${esc(emb.provider ?? "—")} / ${esc(L.modelShortName(emb.model) || "—")}`
    : "未配置——语义召回未启用；配置 embeddingBaseUrl + embeddingModel 后，每轮按当前问题做嵌入检索";
  const inFlight = data.extractionInFlight === true;
  const card = document.createElement("div");
  card.className = "card";
  card.id = "data-pipe-model";
  card.innerHTML = `
    <h3>提取模型${inFlight ? '<span class="badge">提取中…</span>' : ""}</h3>
    <div class="kv"><b>提取路由</b><span>${route}<span class="meta"> · fallback：${fbText}</span></span></div>
    <div class="kv"><b>最近一次提取用车</b><span>${usedText}</span></div>
    <div class="kv"><b>嵌入模型（语义召回）</b><span>${embText}</span></div>
    <div class="meta">提取默认跟随会话路由；要指定更稳的模型，在 cordis.patch.yml 给 dsh-keepsake 配 provider/model 或 fallback（配法见 README，不硬编码任何模型）。</div>`;
  return card;
}

/** 重取 /state 就地重渲染两张管道卡（重试流程结束 / 5s 轮询共用入口）。 */
async function refreshPipeCards() {
  const health = document.getElementById("data-pipe-health"); // await 前取引用：中途切路由后 replaceWith 落在脱挂节点，无害
  if (!health) { stopPipePoll(); return; } // 路由已切走：清 timer 即可
  let data;
  try {
    data = await api("state");
  } catch {
    return; // 单次拉取失败保留旧卡，下轮轮询再试
  }
  health.replaceWith(buildPipeHealthCard(data));
  const model = document.getElementById("data-pipe-model");
  if (model) model.replaceWith(buildPipeModelCard(data));
  updateStreakBadge(L.extractionStreakOf(data.extractionFailures)); // 顺路更新红徽标
  schedulePipePoll(data);
}

/** streak>0 期间 5s 本地轮询；手动重试轮询在途时让位（重试流自管节奏）。 */
function schedulePipePoll(data) {
  stopPipePoll();
  if (L.extractionStreakOf(data.extractionFailures) < 1) return;
  pipePollTimer = setInterval(() => {
    if (!document.getElementById("data-pipe-health")) { stopPipePoll(); return; } // 双保险：路由切走
    if (!pipeRetryBusy) refreshPipeCards();
  }, 5000);
}

// ============ 页面：回收站（可逆性：列表 + 单条恢复 + 清空/按天清理） ============
// 端点：GET trash/list / POST trash/restore {id,name?} / POST trash/purge {id?,olderThanDays?}
// 风格沿用既有页：加载中占位 → 拉取 → 错误页内可见 → 卡片流；破坏操作一律确认弹窗。
async function renderTrashPage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "回收站";
  pageSub.textContent = "删除的记忆先进这里（默认保留 30 天），可单条恢复或清空";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let listData;
  try {
    listData = await api("trash/list");
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (seq !== pageRenderSeq) return;
  const reload = () => { renderTrashPage(); refreshCounts(); };
  const entries = listData.entries ?? [];
  if (entries.length === 0) {
    page.innerHTML = '<div class="empty">回收站是空的——删除的记忆会先移到这里，过期或手动清空才真正消失。</div>';
    return;
  }
  page.innerHTML = entries.map((e, i) => `
    <div class="card"><h3><span class="badge">${e.files.length} 个文件</span> <code class="k">${esc(e.id)}</code>
      <span class="ops">
        <button class="btn sm" data-restore="${i}">恢复全部</button>
        <button class="btn sm danger" data-purge="${i}">清除此条</button>
      </span></h3>
      <div class="meta">删除于 ${esc(L.safetyEntryTimeOf(e))} · 来源会话 ${esc(L.safetyOriginText(e))}</div>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:32%">文件</th><th style="width:22%">位置</th><th style="width:88px">动作</th><th style="width:96px">sha1</th><th style="width:96px"></th></tr>
        ${e.files.map((f, j) => `<tr><td>${esc(f.name)}</td><td class="meta">${esc(L.safetyLocationText(f))}</td><td class="meta">${esc(L.safetyActionText(f.action))}</td><td class="meta">${esc(f.sha1 || "—")}</td><td><button class="btn sm" data-one="${i}:${j}">恢复此文件</button></td></tr>`).join("")}
      </table></div></div>`).join("")
    + `<div class="card"><h3>批量清理<span class="ops">
        <button class="btn sm danger" data-purgeOld>清理过期（按保留天数）</button>
        <button class="btn sm danger" data-purgeAll>清空回收站</button>
      </span></h3>
      <div class="meta">按天清理用「设置」页「保留策略」里的回收站保留天数（默认 30 天）；清空 = 全清，不可恢复。</div></div>`;
  for (const btn of Array.from(page.querySelectorAll("[data-restore]"))) {
    btn.addEventListener("click", () => {
      const e = entries[Number(btn.getAttribute("data-restore"))];
      confirmDialog({
        title: "恢复回收站条目",
        body: `将把 ${e.files.length} 个文件恢复到原位（同名文件会被覆盖），并同步对账 MEMORY.md 索引。\n确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/restore", { id: e.id });
            toast(`已恢复 ${out.restored.length} 个文件${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复全部"; }
        },
      });
    });
  }
  for (const btn of Array.from(page.querySelectorAll("[data-one]"))) {
    btn.addEventListener("click", () => {
      const [i, j] = btn.getAttribute("data-one").split(":").map(Number);
      const e = entries[i];
      const f = e.files[j];
      confirmDialog({
        title: "恢复单个文件",
        body: `将把「${esc(f.name)}」恢复到 ${esc(L.safetyLocationText(f))}（同名文件会被覆盖；被覆盖的当前版本会自动留一份快照可找回）。\n确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/restore", { id: e.id, name: f.name });
            if (out.restored.length === 0) { toast("没有文件被恢复（副本可能已缺失）", "err"); return; }
            toast(`已恢复 ${out.restored[0]}${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复此文件"; }
        },
      });
    });
  }
  for (const btn of Array.from(page.querySelectorAll("[data-purge]"))) {
    btn.addEventListener("click", () => {
      const e = entries[Number(btn.getAttribute("data-purge"))];
      confirmDialog({
        title: "清除回收站条目",
        body: `将永久删除这条里的 ${e.files.length} 个文件副本，无法再恢复。\n确定继续吗？`,
        dangerText: "永久清除",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/purge", { id: e.id });
            toast(`已清除 ${out.purged} 条`);
            reload();
          } catch (err) { toast("清除失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "清除此条"; }
        },
      });
    });
  }
  const purgeOldBtn = page.querySelector("[data-purgeOld]");
  purgeOldBtn.addEventListener("click", () => {
    confirmDialog({
      title: "清理过期条目",
      body: "将永久删除超过「设置」页「保留策略」里回收站保留天数的条目（默认 30 天）。\n确定继续吗？",
      dangerText: "清理过期",
      onConfirm: async () => {
        let days = 30;
        try {
          const st = await api("state");
          const d = Number(st.settings && st.settings.trashKeepDays);
          if (Number.isFinite(d) && d >= 0) days = d;
        } catch { /* 取不到就用默认 30 天，不阻断 */ }
        purgeOldBtn.disabled = true; purgeOldBtn.textContent = "处理中…";
        try {
          const out = await apiPost("trash/purge", { olderThanDays: days });
          toast(out.purged > 0 ? `已清理 ${out.purged} 条过期条目（>${days} 天）` : `没有超过 ${days} 天的条目`);
          reload();
        } catch (err) { toast("清理失败：" + err.message, "err"); }
        finally { purgeOldBtn.disabled = false; purgeOldBtn.textContent = "清理过期（按保留天数）"; }
      },
    });
  });
  const purgeAllBtn = page.querySelector("[data-purgeAll]");
  purgeAllBtn.addEventListener("click", () => {
    confirmDialog({
      title: "清空回收站",
      body: `将永久删除全部 ${entries.length} 个条目里的所有文件副本，无法再恢复。\n确定继续吗？`,
      dangerText: "全部清空",
      onConfirm: async () => {
        purgeAllBtn.disabled = true; purgeAllBtn.textContent = "处理中…";
        try {
          const out = await apiPost("trash/purge", {});
          toast(`已清空 ${out.purged} 条`);
          reload();
        } catch (err) { toast("清空失败：" + err.message, "err"); }
        finally { purgeAllBtn.disabled = false; purgeAllBtn.textContent = "清空回收站"; }
      },
    });
  });
}

// ============ 页面：最近活动（轮次活动条 + 检索 + 纠错记录） ============
// 端点：GET turn-activity / GET search / GET corrections/recent / POST corrections/correct
// 设计意图：这是「刚才那轮到底做了什么」的唯一入口——把提取/注入/整理/纠错四面
// 按时间窗归并成一条流；检索与纠错记录放同页，因为它们是同一条「记忆有错→改掉」链路的
// 前两步（先找到，再改），分成两个页签只会让人来回跳。
let activityWindowMinutes = 30;

async function renderActivityPage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "最近活动";
  pageSub.textContent = "提取 / 注入 / 整理 / 纠错的合并时间线；同页可检索记忆、提交纠错";
  page.innerHTML = '<div class="empty">加载中…</div>';
  stopPipePoll();
  stopPendingPoll();

  let activity;
  let ledger;
  try {
    const [a, l] = await Promise.all([
      api(`turn-activity?sinceMs=${Date.now() - activityWindowMinutes * 60000}`),
      api("corrections/recent?limit=20").catch(() => ({ entries: [] })),
    ]);
    activity = a;
    ledger = l;
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (seq !== pageRenderSeq) return;

  const rows = L.turnActivityRows(activity.events);
  const note = L.turnActivityNote(activity);
  const ledgerRows = L.correctionRows(ledger.entries);

  page.innerHTML = `
    <div class="card">
      <h3>时间线</h3>
      <div class="meta" style="margin-bottom:8px">${esc(note)}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <label class="meta" for="actWindow">时间范围</label>
        <select class="inp" id="actWindow" style="width:auto">
          ${[10, 30, 60, 180, 1440].map((m) => `<option value="${m}"${m === activityWindowMinutes ? " selected" : ""}>最近 ${m < 60 ? m + " 分钟" : m < 1440 ? Math.round(m / 60) + " 小时" : "1 天"}</option>`).join("")}
        </select>
        <button class="btn sm" id="actRefresh">刷新</button>
      </div>
      ${rows.length === 0
        ? '<div class="empty">这段时间内没有活动。对话几轮后，提取/注入会在这里出现。</div>'
        : `<div class="tableScroll"><table class="preview">
            <tr><th style="width:78px">时间</th><th style="width:64px">类型</th><th>内容</th></tr>
            ${rows.map((r) => `<tr><td class="meta">${esc(r.time)}</td><td><span class="badge${r.isBad ? " alert" : ""}">${esc(r.kindText)}</span></td><td${r.isBad ? ' style="color:var(--fb-danger)"' : ""}>${esc(r.text)}</td></tr>`).join("")}
          </table></div>`}
    </div>

    <div class="card">
      <h3>检索记忆</h3>
      <div class="row" style="display:flex;gap:8px">
        <input class="inp" id="actQuery" placeholder="关键词，多个词用空格分隔（要求全部命中）">
        <button class="btn primary" id="actSearch">检索</button>
      </div>
      <div id="actResults"></div>
    </div>

    <div class="card">
      <h3>纠错记录 <span class="badge" id="actLedgerMode">最近 20 条</span></h3>
      <div class="meta" style="margin-bottom:6px">每条纠错都会留快照；改名或删除都可在「快照」「回收站」页找回。</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <button class="btn sm" id="actLedgerFlat" aria-pressed="true">按时间</button>
        <button class="btn sm" id="actLedgerGrouped" aria-pressed="false">按条目</button>
      </div>
      <div id="actLedgerHost">
        ${ledgerRows.length === 0
          ? '<div class="empty">还没有纠错过。在下面的检索结果里点「纠正这条」，或在对话里用 /memory fix。</div>'
          : `<div class="tableScroll"><table class="preview">
              <tr><th style="width:96px">时间</th><th style="width:24%">条目</th><th style="width:88px">原因</th><th>结果</th></tr>
              ${ledgerRows.map((r) => `<tr><td class="meta">${esc(r.atText)}</td><td><code class="k">${esc(r.target)}</code></td><td class="meta">${esc(r.kindText)}</td><td class="meta">${esc(r.resultText)}</td></tr>`).join("")}
            </table></div>`}
      </div>
    </div>`;

  const windowSel = page.querySelector("#actWindow");
  if (windowSel) {
    windowSel.addEventListener("change", () => {
      activityWindowMinutes = Number(windowSel.value) || 30;
      renderActivityPage();
    });
  }
  const refreshBtn = page.querySelector("#actRefresh");
  if (refreshBtn) refreshBtn.addEventListener("click", () => renderActivityPage());

  // 记录双视图：按时间（默认，答"最近改了什么"）/ 按条目（答"这条改过几次"）
  const ledgerHost = page.querySelector("#actLedgerHost");
  const flatBtn = page.querySelector("#actLedgerFlat");
  const groupBtn = page.querySelector("#actLedgerGrouped");
  const modeBadge = page.querySelector("#actLedgerMode");
  const renderFlat = () => {
    flatBtn.setAttribute("aria-pressed", "true");
    groupBtn.setAttribute("aria-pressed", "false");
    modeBadge.textContent = "最近 20 条";
    ledgerHost.innerHTML = ledgerRows.length === 0
      ? '<div class="empty">还没有纠错过。在下面的检索结果里点「纠正这条」，或在对话里用 /memory fix。</div>'
      : `<div class="tableScroll"><table class="preview">
          <tr><th style="width:96px">时间</th><th style="width:24%">条目</th><th style="width:88px">原因</th><th>结果</th></tr>
          ${ledgerRows.map((r) => `<tr><td class="meta">${esc(r.atText)}</td><td><code class="k">${esc(r.target)}</code></td><td class="meta">${esc(r.kindText)}</td><td class="meta">${esc(r.resultText)}</td></tr>`).join("")}
        </table></div>`;
  };
  const renderGrouped = async () => {
    flatBtn.setAttribute("aria-pressed", "false");
    groupBtn.setAttribute("aria-pressed", "true");
    modeBadge.textContent = "按条目归组";
    ledgerHost.innerHTML = '<div class="meta">读取中…</div>';
    let out;
    try {
      out = await api("corrections/by-target?maxGroups=50");
    } catch (err) {
      ledgerHost.innerHTML = `<div class="meta">读取失败：${esc(err.message)}</div>`;
      return;
    }
    const groups = Array.isArray(out.groups) ? out.groups : [];
    if (groups.length === 0) {
      ledgerHost.innerHTML = '<div class="empty">还没有纠错记录。</div>';
      return;
    }
    ledgerHost.innerHTML = `
      <div class="meta" style="margin-bottom:6px">${groups.length} 个条目被改过，共 ${Number(out.entries ?? 0)} 次${out.truncated ? "（只显示前 50 个条目）" : ""}。点「看历史」展开这一条每次改了什么。</div>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:26%">条目</th><th style="width:64px">次数</th><th style="width:120px">最近改动</th><th>原因</th><th style="width:72px"></th></tr>
        ${groups.map((g, i) => `<tr>
          <td><code class="k">${esc(g.target)}</code><div class="meta">${esc(scopeLabelOf(g.scope))}</div></td>
          <td>${esc(String(g.count ?? 0))}</td>
          <td class="meta">${esc(L.relativeTimeOf(g.lastAt))} · 改 ${esc(String(g.writes ?? 0))} / 删 ${esc(String(g.deletes ?? 0))}</td>
          <td class="meta">${esc((g.kinds || []).map((k) => L.correctionKindText(k)).join("、"))}</td>
          <td><button class="btn sm" data-hist="${i}">看历史</button></td>
        </tr>`).join("")}
      </table></div>`;
    for (const btn of Array.from(ledgerHost.querySelectorAll("[data-hist]"))) {
      btn.addEventListener("click", () => {
        const g = groups[Number(btn.getAttribute("data-hist"))];
        openCorrectionHistoryDialog(g);
      });
    }
  };
  if (flatBtn) flatBtn.addEventListener("click", renderFlat);
  if (groupBtn) groupBtn.addEventListener("click", renderGrouped);

  const queryInput = page.querySelector("#actQuery");
  const resultsHost = page.querySelector("#actResults");
  const doSearch = async () => {
    const q = (queryInput?.value ?? "").trim();
    if (q.length === 0) {
      resultsHost.innerHTML = '<div class="meta">先输入关键词。</div>';
      return;
    }
    resultsHost.innerHTML = '<div class="meta">检索中…</div>';
    let out;
    try {
      out = await api(`search?q=${encodeURIComponent(q)}`);
    } catch (err) {
      resultsHost.innerHTML = `<div class="meta">检索失败：${esc(err.message)}</div>`;
      return;
    }
    const hits = Array.isArray(out.results) ? out.results : [];
    if (hits.length === 0) {
      resultsHost.innerHTML = `<div class="meta">没找到包含「${esc(q)}」的记忆。</div>`;
      return;
    }
    resultsHost.innerHTML = `
      <div class="meta" style="margin:8px 0 4px">找到 ${Number(out.total ?? hits.length)} 条${out.truncated ? `，显示前 ${hits.length} 条` : ""}。</div>
      <div class="row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
        <button class="btn sm" id="actBatchClear">清空选择</button>
        <span class="meta" id="actBatchCount">已选 0 条</span>
        <button class="btn sm primary" id="actBatchFix" disabled>批量纠正</button>
      </div>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:36px"></th><th style="width:24%">标题</th><th style="width:14%">位置</th><th>摘要</th><th style="width:96px"></th></tr>
        ${hits.map((h, i) => `<tr>
          <td><input type="checkbox" data-pick="${i}" aria-label="选择 ${esc(h.title)}"></td>
          <td>${esc(h.title)}<div class="meta"><code class="k">${esc(h.name)}</code></div></td>
          <td class="meta">${esc(scopeLabelOf(h.scope))}</td>
          <td class="meta">${esc(h.description || h.snippet || "")}</td>
          <td><button class="btn sm" data-fix="${i}">纠正这条</button></td>
        </tr>`).join("")}
      </table></div>`;
    for (const btn of Array.from(resultsHost.querySelectorAll("[data-fix]"))) {
      btn.addEventListener("click", () => {
        const hit = hits[Number(btn.getAttribute("data-fix"))];
        openCorrectionDialog(hit, () => renderActivityPage());
      });
    }
    // 批量纠错：勾选多条后一次提交。上限 10 条与服务端同口径——
    // 客户端先挡，免得用户填完 20 条诉求才被服务端 400 弹回。
    const batchBtn = resultsHost.querySelector("#actBatchFix");
    const countLabel = resultsHost.querySelector("#actBatchCount");
    const pickBoxes = Array.from(resultsHost.querySelectorAll("[data-pick]"));
    const selected = () => pickBoxes.filter((b) => b.checked).map((b) => hits[Number(b.getAttribute("data-pick"))]).filter(Boolean);
    const syncBatch = () => {
      const n = selected().length;
      countLabel.textContent = `已选 ${n} 条${n > CORRECTION_BATCH_MAX ? `（上限 ${CORRECTION_BATCH_MAX} 条）` : ""}`;
      batchBtn.disabled = n === 0 || n > CORRECTION_BATCH_MAX;
    };
    for (const box of pickBoxes) box.addEventListener("change", syncBatch);
    const clearBtn = resultsHost.querySelector("#actBatchClear");
    if (clearBtn) clearBtn.addEventListener("click", () => { for (const box of pickBoxes) box.checked = false; syncBatch(); });
    batchBtn.addEventListener("click", () => {
      openBatchCorrectionDialog(selected(), () => renderActivityPage());
    });
    syncBatch();
  };
  const searchBtn = page.querySelector("#actSearch");
  if (searchBtn) searchBtn.addEventListener("click", doSearch);
  if (queryInput) {
    queryInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); doSearch(); }
    });
  }
}

/** scope → 人话（与 /memory 命令同口径；这里不 import 命令模块，避免面板侧依赖后端）。 */
function scopeLabelOf(scope) {
  const s = String(scope ?? "");
  if (s === "project") return "项目";
  const labels = {
    "global:work-profile": "工作背景",
    "global:user-profile": "用户背景",
    "global:current-focus": "当前关注",
    "global:recent-activity": "近期动态",
    "global:long-term": "长期",
  };
  return labels[s] ?? (s.startsWith("global:") ? s.slice(7) : s || "—");
}

/** 单条纠错对话框：诉求必填（空诉求后端会直接拒，这里先挡住不白烧一次调用）。
 *  结构沿用面板既有 mask/dialog + trapFocus（键盘可达、Esc 可退），不另造一层。 */
function openCorrectionDialog(hit, onDone) {
  const kinds = L.correctionKindOptions();
  const layer = document.createElement("div");
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(560px,94vw)">
        <h2>纠正记忆：${esc(hit.title || hit.name)}</h2>
        <div class="meta">文件 <code class="k">${esc(hit.name)}</code> · 位置 ${esc(scopeLabelOf(hit.scope))}</div>
        <label class="meta" for="fixKind">哪里不对</label>
        <select class="inp" id="fixKind">
          ${kinds.map((k) => `<option value="${esc(k.value)}">${esc(k.label)}</option>`).join("")}
        </select>
        <label class="meta" for="fixReason">具体说明（写清正确的值，模型只按你说的改）</label>
        <textarea class="inp" id="fixReason" rows="4" style="width:100%" placeholder="例如：部署端口现在是 8080，不是 3000"></textarea>
        <div class="meta" id="fixStatus">改动会留快照，可在「快照」页回退。</div>
        <div class="foot">
          <button class="btn" data-cancel>取消</button>
          <button class="btn primary" data-go>提交纠正</button>
        </div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const close = () => {
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => {
    if (e.target.classList.contains("mask")) close();
  });
  layer.querySelector("[data-cancel]").addEventListener("click", close);
  const go = layer.querySelector("[data-go]");
  const status = layer.querySelector("#fixStatus");
  const reasonInput = layer.querySelector("#fixReason");
  reasonInput.focus();
  go.addEventListener("click", async () => {
    const reason = (reasonInput.value ?? "").trim();
    const kind = layer.querySelector("#fixKind").value;
    if (reason.length === 0) {
      status.textContent = "请先写清哪里不对（空说明会被直接拒绝）。";
      return;
    }
    go.disabled = true;
    go.textContent = "纠正中…";
    status.textContent = "模型正在生成修正…（一次调用，通常几秒）";
    try {
      const out = await apiPost("corrections/correct", {
        target: hit.name,
        reason,
        kind,
        scope: hit.scope,
        projectId: hit.projectId || undefined,
      });
      const outcome = String(out.outcome ?? "");
      if (outcome === "applied") {
        const vf = Number(out.verifyFailed ?? 0);
        const lost = Number.isFinite(vf) && vf > 0 ? `；另有 ${Math.floor(vf)} 处校验回滚` : "";
        close();
        toast(`已纠正 ${hit.name}：${out.writes ?? 0} 处改写 / ${out.deletes ?? 0} 处删除${lost}`, Number.isFinite(vf) && vf > 0 ? "err" : "ok");
        if (typeof onDone === "function") onDone();
      } else if (outcome === "needs-input") {
        status.textContent = "说明不够具体，模型没有改动任何记忆。请写清正确的值再试。";
      } else {
        status.textContent = "模型判断这条不需要改动，记忆未变。";
      }
    } catch (err) {
      // 422 no-op-applied 最常见的原因是「写后校验把改动打回了」，服务端会把
      // verifyFailed 一起回给前端；只显示「纠错未生效」用户不知道该怎么办。
      const vf = Number(err?.details?.verifyFailed ?? 0);
      if (Number.isFinite(vf) && vf > 0) {
        status.textContent = `纠正失败：${Math.floor(vf)} 处改动写后校验没通过、已回滚原样，记忆未改动。可以再试一次，或换一种说法指出正确的值。`;
      } else {
        status.textContent = "纠正失败：" + err.message + "（记忆未改动）";
      }
    } finally {
      go.disabled = false;
      go.textContent = "提交纠正";
    }
  });
}

/** 批量纠错使用的上限（与服务端 CORRECTION_MAX_BATCH 同口径；客户端先挡免得填完才被 400）。 */
const CORRECTION_BATCH_MAX = 10;

/**
 * 批量纠错对话框：每条一个诉求框，一次提交多条。
 * 逐条结局必须逐条展示——「3 条成功 1 条失败」报成整批失败或整批成功都是谎报。
 */
function openBatchCorrectionDialog(hits, onDone) {
  const list = Array.isArray(hits) ? hits.filter((h) => h && typeof h.name === "string") : [];
  if (list.length === 0) return;
  if (list.length > CORRECTION_BATCH_MAX) {
    toast(`单批最多 ${CORRECTION_BATCH_MAX} 条（已选 ${list.length} 条）`, "err");
    return;
  }
  const kinds = L.correctionKindOptions();
  const layer = document.createElement("div");
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(720px,96vw)">
        <h2>批量纠正 ${list.length} 条记忆</h2>
        <div class="meta">每条一次模型调用，逐条独立成败。诉求写清正确值；留空的条目会被跳过（不扣调用）。改动都会留快照。</div>
        <div style="max-height:${DIALOG_CAP_LIST};overflow:auto;margin-top:8px">
          ${list.map((h, i) => `
            <div style="border-top:1px solid var(--dsw-alias-border-l2, #3333);padding:8px 0">
              <div style="display:flex;gap:8px;align-items:center">
                <code class="k">${esc(h.name)}</code>
                <span class="meta">${esc(scopeLabelOf(h.scope))}</span>
                <span class="meta">${esc(h.title || "")}</span>
              </div>
              <div style="display:flex;gap:8px;margin-top:4px">
                <select class="inp" data-bkind="${i}" style="width:auto">
                  ${kinds.map((k) => `<option value="${esc(k.value)}">${esc(k.label)}</option>`).join("")}
                </select>
                <input class="inp" data-breason="${i}" style="flex:1" placeholder="这条哪里不对（留空 = 跳过这条）">
              </div>
            </div>`).join("")}
        </div>
        <div class="meta" id="batchStatus"></div>
        <div class="foot">
          <button class="btn" data-cancel>取消</button>
          <button class="btn primary" data-go>提交批量纠正</button>
        </div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const close = () => {
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => {
    if (e.target.classList.contains("mask")) close();
  });
  layer.querySelector("[data-cancel]").addEventListener("click", close);
  const go = layer.querySelector("[data-go]");
  const status = layer.querySelector("#batchStatus");
  go.addEventListener("click", async () => {
    const items = [];
    for (let i = 0; i < list.length; i += 1) {
      const reason = (layer.querySelector(`[data-breason="${i}"]`).value ?? "").trim();
      if (reason.length === 0) continue; // 留空 = 跳过该条（不扣调用）
      items.push({
        target: list[i].name,
        reason,
        kind: layer.querySelector(`[data-bkind="${i}"]`).value,
        scope: list[i].scope,
        projectId: list[i].projectId || undefined,
      });
    }
    if (items.length === 0) {
      status.textContent = "没有填写任何诉求——至少填一条再提交。";
      return;
    }
    go.disabled = true;
    go.textContent = "纠正中…";
    status.textContent = `正在逐条纠正 ${items.length} 条（每条一次调用）…`;
    let out;
    try {
      out = await apiPost("corrections/correct-batch", { items });
    } catch (err) {
      status.textContent = "批量纠正失败：" + err.message + "（未提交成功的条目记忆未改动）";
      go.disabled = false;
      go.textContent = "提交批量纠正";
      return;
    }
    // 逐条结局逐条展示：不得把 partial 说成成功或失败
    const results = Array.isArray(out.results) ? out.results : [];
    const lines = results.map((r) => {
      const target = r.target || "（未指名）";
      // 写后校验被打回的处数要跟着走：只写「改 N」会让用户以为这条全改成了。
      const vf = Number(r.verifyFailed ?? 0);
      const lost = Number.isFinite(vf) && vf > 0 ? ` · 校验回滚 ${Math.floor(vf)}` : "";
      if (r.outcome === "applied") return `✓ ${target}：改 ${r.writes ?? 0} / 删 ${r.deletes ?? 0}${lost}`;
      if (r.outcome === "needs-input") return `– ${target}：说明不够具体，未改动`;
      if (r.outcome === "nothing") return `– ${target}：判断无需改动`;
      // error 分支不把内部英文码直接摊给用户（面板不出现英文枚举是既有规矩）
      if (Number.isFinite(vf) && vf > 0) return `✗ ${target}：${Math.floor(vf)} 处改动写后校验没通过、已回滚`;
      if (String(r.error || "") === "no-op-applied") return `✗ ${target}：改动没落在盘上（被闸门拦下）`;
      return `✗ ${target}：${r.error || "失败"}`;
    });
    // no-change = 全部 needs-input/nothing（模型明确拒绝改动或判断无需改动），
    // 不是失败——与单条路径 needs-input「仍报 success」同口径。
    const head = out.outcome === "applied" ? "全部成功"
      : out.outcome === "no-change" ? "没有改动"
        : out.outcome === "partial" ? "部分成功"
          : "全部失败";
    const totalVf = Number(out.verifyFailed ?? 0);
    const vfHead = Number.isFinite(totalVf) && totalVf > 0 ? ` / ${Math.floor(totalVf)} 处校验回滚` : "";
    status.innerHTML = `${esc(head)}（${out.writes ?? 0} 处改写 / ${out.deletes ?? 0} 处删除 / ${out.failed ?? 0} 条失败${esc(vfHead)}）<br>${lines.map(esc).join("<br>")}`;
    go.disabled = false;
    go.textContent = "提交批量纠正";
    if (out.outcome !== "error") {
      const vfToast = Number.isFinite(totalVf) && totalVf > 0 ? `，${Math.floor(totalVf)} 处校验回滚` : "";
      toast(`批量纠正：${head}（${out.writes ?? 0} 改 / ${out.deletes ?? 0} 删${vfToast}）`, out.outcome === "partial" || vfToast ? "err" : "ok");
      if (typeof onDone === "function") onDone();
    }
  });
}

/** 单条目的纠错历史（按条目视图点「看历史」）：按时间列出这一条的每次改动。 */
function openCorrectionHistoryDialog(group) {
  const g = group && typeof group === "object" ? group : {};
  const rows = Array.isArray(g.rows) ? g.rows : [];
  // 与归组列表共用同一个翻译函数（单一出处：此前两处各写一套，归组那处漏了翻译）
  const kindLabel = (v) => L.correctionKindText(v) || "—";
  const layer = document.createElement("div");
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(640px,94vw)">
        <h2>纠错历史：${esc(g.target || "—")}</h2>
        <div class="meta">位置 ${esc(scopeLabelOf(g.scope))} · 共改过 ${esc(String(g.count ?? 0))} 次（累计改写 ${esc(String(g.writes ?? 0))} / 删除 ${esc(String(g.deletes ?? 0))}）</div>
        ${rows.length === 0
          ? '<div class="empty">没有可展示的历史明细。</div>'
          : `<div class="tableScroll"><table class="preview">
              <tr><th style="width:110px">时间</th><th style="width:100px">原因</th><th style="width:120px">改动</th><th>校验失败</th></tr>
              ${rows.map((r) => `<tr>
                <td class="meta">${esc(L.relativeTimeOf(r.at))}</td>
                <td class="meta">${esc(kindLabel(r.kind))}</td>
                <td class="meta">改 ${esc(String(r.writes ?? 0))} / 删 ${esc(String(r.deletes ?? 0))}</td>
                <td class="meta">${esc(String(r.verifyFailed ?? 0))}</td>
              </tr>`).join("")}
            </table></div>`}
        <div class="meta">改正本身已落进条目；原始旧文在「快照」页，删除的条目在「回收站」页。</div>
        <div class="foot"><button class="btn" data-close>关闭</button></div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const close = () => {
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => {
    if (e.target.classList.contains("mask")) close();
  });
  layer.querySelector("[data-close]").addEventListener("click", close);
}

// ============ 页面：快照（批前快照：列表 + 整快照恢复 / 单文件恢复） ============
// 端点：GET snapshots/list / POST snapshots/restore {id,name?}
// 与回收站页同风格同约定；恢复 = 回拷快照副本并对账索引（不是删除当前文件）。
async function renderSnapshotsPage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "快照";
  pageSub.textContent = "覆写/删除前自动留档的旧文（默认保留最新 30 份），可整份或单文件恢复";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let listData;
  try {
    listData = await api("snapshots/list");
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (seq !== pageRenderSeq) return;
  const reload = () => { renderSnapshotsPage(); refreshCounts(); };
  const snapshots = listData.snapshots ?? [];
  if (snapshots.length === 0) {
    page.innerHTML = '<div class="empty">还没有快照——写入路径覆写或删除已有条目时会自动留一份旧文。</div>';
    return;
  }
  page.innerHTML = snapshots.map((s, i) => `
    <div class="card"><h3><span class="badge">${s.files.length} 个文件</span> <code class="k">${esc(s.id)}</code>
      <span class="ops">
        <button class="btn sm" data-restore="${i}">恢复整份快照</button>
      </span></h3>
      <div class="meta">留档于 ${esc(L.safetyEntryTimeOf(s))} · 来源会话 ${esc(L.safetyOriginText(s))}</div>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:32%">文件</th><th style="width:22%">位置</th><th style="width:88px">当时动作</th><th style="width:96px">sha1</th><th style="width:96px"></th></tr>
        ${s.files.map((f, j) => `<tr><td>${esc(f.name)}</td><td class="meta">${esc(L.safetyLocationText(f))}</td><td class="meta">${esc(L.safetyActionText(f.action))}</td><td class="meta">${esc(f.sha1 || "—")}</td><td><button class="btn sm" data-one="${i}:${j}">恢复此文件</button></td></tr>`).join("")}
      </table></div></div>`).join("")
    + '<div class="meta">快照只增不减：超过保留份数（可在「设置」页「保留策略」调整，默认 30 份）的最旧快照由写入路径自动清理；本页不提供手动删除入口。</div>';
  for (const btn of Array.from(page.querySelectorAll("[data-restore]"))) {
    btn.addEventListener("click", () => {
      const s = snapshots[Number(btn.getAttribute("data-restore"))];
      confirmDialog({
        title: "恢复整份快照",
        body: `将把快照里的 ${s.files.length} 个文件回拷到原位（同名文件会被覆盖），并同步对账 MEMORY.md 索引。\n当前更新的内容会被旧文覆盖，确定继续吗？`,
        dangerText: "恢复整份",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("snapshots/restore", { id: s.id });
            toast(`已恢复 ${out.restored.length} 个文件${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复整份快照"; }
        },
      });
    });
  }
  for (const btn of Array.from(page.querySelectorAll("[data-one]"))) {
    btn.addEventListener("click", () => {
      const [i, j] = btn.getAttribute("data-one").split(":").map(Number);
      const s = snapshots[i];
      const f = s.files[j];
      confirmDialog({
        title: "恢复单个文件",
        body: `将把「${esc(f.name)}」回拷到 ${esc(L.safetyLocationText(f))}（同名文件会被覆盖；被覆盖的当前版本会自动留一份快照可找回）。\n确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("snapshots/restore", { id: s.id, name: f.name });
            if (out.restored.length === 0) { toast("没有文件被恢复（副本可能已缺失）", "err"); return; }
            toast(`已恢复 ${out.restored[0]}${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复此文件"; }
        },
      });
    });
  }
}
// ============ 设置健康提示（/state.settingsDiagnostics.coercedFields；缺失=旧宿主不渲染） ============
/** 黄条：N 项设置值不合法已回默认（字段名），重存设置可修正。
 *  空/缺失/非数组 → 返回 null（调用方不渲染，不留空位）。 */
function buildSettingsHealthCard(data) {
  const note = L.settingsCoercionNote(data && data.settingsDiagnostics);
  if (!note) return null;
  const host = document.createElement("div");
  host.id = "data-settings-health";
  host.innerHTML = `<div class="notice show" style="margin:0 0 10px">${esc(note)}</div>`;

}

// ============ 记忆整理（GET /maintenance/suggestions + POST /maintenance/repair-index） ============
// 三组卡片：①重复建议（只提示不自动合并）②久未更新 ③索引健康（悬挂行/漏登记/空分类三列）
// +「修复索引」按钮（busy 三段式 → 回显 fixed 清单或「无需修复」）。
// 空态「暂无建议」；加载失败可重试（重试 = 重新拉取，不缓存坏状态）。
function buildMaintenanceCard() {
  const host = document.createElement("div");
  host.id = "data-maintenance";
  host.innerHTML = '<div class="card"><h3>记忆整理</h3><div class="meta">正在生成整理建议…</div></div>';
  const render = (suggestions) => {
    if (L.maintenanceSuggestionsEmpty(suggestions)) {
      host.innerHTML = `<div class="card"><h3>记忆整理</h3><div class="meta">${esc(L.MAINTENANCE_EMPTY_TEXT)}——没有发现重复、久未更新或索引不一致。</div>
        <div class="kv"><b>操作</b><button class="btn" data-repair>修复索引</button></div></div>`;
      wireRepair(host, suggestions);
      return;
    }
    const s = suggestions && typeof suggestions === "object" ? suggestions : {};
    const dup = Array.isArray(s.duplicates) ? s.duplicates : [];
    const stale = Array.isArray(s.stale) ? s.stale : [];
    const health = s.indexHealth && typeof s.indexHealth === "object" ? s.indexHealth : {};
    const counts = s.counts && typeof s.counts === "object" ? s.counts : {};
    const genAt = s.generatedAt ? ` · 生成于 ${esc(L.relativeTimeOf(s.generatedAt))}` : "";
    host.innerHTML = `
      <div class="card"><h3>记忆整理<span class="meta" style="font-weight:400">（只提示，不自动改动${genAt}）</span></h3>
        <div class="split">
          <div class="card" style="margin:0"><h3>重复建议（${dup.length}）</h3>
            ${dup.length === 0 ? '<div class="meta">没有发现重复条目。</div>' : `
            <div class="tableScroll"><table class="preview">
              <tr><th style="width:70px">相似度</th><th>条目对</th><th style="width:44%">判断依据</th></tr>
              ${dup.map((d) => `<tr><td>${L.duplicateScorePct(d && d.score)}%</td><td><code class="k">${esc(d && d.a)}</code> ↔ <code class="k">${esc(d && d.b)}</code></td><td class="meta">${esc(d && d.why)}</td></tr>`).join("")}
            </table></div>
            <div class="meta">重复项需要你自己决定留哪条——这里不自动合并。</div>`}
          </div>
          <div class="card" style="margin:0"><h3>久未更新（${stale.length}）</h3>
            ${stale.length === 0 ? '<div class="meta">没有久未更新的条目。</div>' : `
            <div class="tableScroll"><table class="preview">
              <tr><th>条目</th><th>分类</th><th style="width:110px">年龄</th></tr>
              ${stale.map((it) => `<tr><td><code class="k">${esc(it && it.name)}</code></td><td class="meta">${esc(it && it.category)}</td><td class="meta">${esc(L.staleDaysText(it))}</td></tr>`).join("")}
            </table></div>
            <div class="meta">年龄不可知的条目（修改时间缺失）也如实列出，不拿 0 天冒充。</div>`}
          </div>
        </div>
        <div class="card" style="margin:10px 0 0"><h3>索引健康<span class="ops"><button class="btn sm" data-repair>修复索引</button></span></h3>
          <div class="split">
            ${L.INDEX_HEALTH_COLUMNS.map((c) => {
              const list = Array.isArray(health[c.key]) ? health[c.key] : [];
              const rows = list.map((it) => {
                // 空分类列是分类 id 字符串数组（不是对象）：按字符串渲染；其余列仍是对象取字段
                if (typeof it === "string") return `<tr><td><code class="k">${esc(it)}</code></td><td></td></tr>`;
                const main = it && it.name != null ? `<code class="k">${esc(it.name)}</code>` : (it && it.line != null ? esc(it.line) : "—");
                const cat = it && it.category != null ? `<span class="meta">${esc(it.category)}</span>` : "";
                return `<tr><td>${main}</td><td>${cat}</td></tr>`;
              }).join("");
              return `<div><div class="meta" title="${esc(c.hint)}">${esc(c.label)}（${list.length}）</div>
                ${list.length === 0 ? '<div class="meta">无</div>' : `<div class="tableScroll"><table class="preview">${rows}</table></div>`}</div>`;
            }).join("")}
          </div>
          <div class="meta" data-repairResult></div>
        </div>
        <div class="meta">${esc(L.maintenanceCountsText(counts))}</div>
      </div>`;
    wireRepair(host, suggestions);
  };
  const load = () => {
    host.innerHTML = '<div class="card"><h3>记忆整理</h3><div class="meta">正在生成整理建议…</div></div>';
    api("maintenance/suggestions")
      .then((out) => render(out))
      .catch((err) => {
        host.innerHTML = `<div class="card"><h3>记忆整理</h3>
          <div class="empty">整理建议加载失败：${esc(err.message)}</div>
          <div class="kv"><b>操作</b><button class="btn" data-retry>重试</button></div></div>`;
        const retry = host.querySelector("[data-retry]");
        if (retry) retry.addEventListener("click", load);
      });
  };
  load();
  return host;
}

/** 「修复索引」按钮：busy 三段式 → POST repair-index → 回显 fixed 清单或「无需修复」。 */
function wireRepair(host, suggestions) {
  const btn = host.querySelector("[data-repair]");
  if (!btn) return;
  const result = host.querySelector("[data-repairResult]");
  btn.addEventListener("click", async () => {
    btn.disabled = true; btn.textContent = "修复中…"; // 三段式 busy
    try {
      const out = await apiPost("maintenance/repair-index");
      const text = L.repairIndexResultText(out);
      // 回显含分类名等不可信内容——走 esc 再进 innerHTML（与记忆整理其余渲染点同一道 XSS 防线）
      if (result) result.innerHTML = esc(text);
      // 按回显内容定语气：无需修复/已修复 = 正常；「修复结果未知」按错误语气提示（如实，不粉饰）
      toast(text, text.startsWith("修复结果未知") ? "err" : "ok");
      // 修复后建议可能变化：静默重拉一次（不打断用户阅读，失败就留旧面板）
      api("maintenance/suggestions").then((fresh) => {
        // 只在用户还停在设置页时更新（路由切走后 host 已脱挂，replaceWith 无害但会误闪）
        if (document.getElementById("data-maintenance")) host.replaceWith(buildMaintenanceCard());
      }).catch(() => { /* 重拉失败：保留当前面板与修复回显 */ });
    } catch (err) {
      if (result) result.textContent = "修复失败：" + err.message;
      toast("索引修复失败：" + err.message, "err");
    } finally {
      btn.disabled = false; btn.textContent = "修复索引";
    }
  });
}

// ============ 页面：设置（三开关 + 导出全部 + 清空全部 + 备份恢复） ============
async function renderSettingsPage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "设置";
  pageSub.textContent = "";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let data, backupsData;
  try {
    data = await api("state");
    backupsData = await api("backup/list");
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (seq !== pageRenderSeq) return;
  const s = data.settings ?? {};
  // 总开关现值（三态 tolerant：后端字段优先 → 本会话回填 → 缺省关；见 L.runtimeEnabledOf）
  const curRuntimeOn = L.runtimeEnabledOf(data.settings, runtimeEnabledLocal);
  // 开关行：三开关是「缺省开」（!== false），runtime / idle review 是「缺省关」（=== true，规矩：开关默认关、可回滚）
  const switchRow = (key, label, hint) => {
    const defaultOff = key === "runtimeEnabled" || key === "idleReviewEnabled";
    const checked = key === "runtimeEnabled"
      ? curRuntimeOn
      : defaultOff
        ? s[key] === true
        : s[key] !== false;
    return `
    <div class="kv"><b>${label}</b>
      <span class="switchWrap"><label class="switch"><input type="checkbox" data-sw="${key}" ${checked ? "checked" : ""}><span class="slider"></span></label></span>
      <span class="meta">${hint}</span>
    </div>`;
  };
  const backups = backupsData.backups ?? [];
  // /state 新字段 tolerant 消费（可观测）：缺失时 falsy 零影响
  const corruptBits = [];
  if (data.corrupt) corruptBits.push("settings.json（开关）");
  if (data.addressingCorrupt) corruptBits.push("addressing.json（称呼）");
  if (data.personaCorrupt) corruptBits.push("persona.md（人设）");
  // 备份时间列：createdAt 契约新增（ISO 串或毫秒），null → "—"；相对时间 + 悬停绝对时间
  const backupTime = (b) => {
    const raw = b && b.createdAt;
    if (raw == null) return "—";
    const ms = typeof raw === "number" ? raw : Date.parse(String(raw));
    return Number.isFinite(ms) ? `<span title="${esc(fmtTime(ms))}">${esc(L.relativeTimeOf(ms))}</span>` : "—";
  };
  const BACKUP_LIST_LIMIT = 20;
  const shownBackups = backups.slice(0, BACKUP_LIST_LIMIT);
  // 布局：开关卡（损坏标记贴总开关）→ 管道健康卡 → 提取模型卡 → 嵌入卡 → 保留策略卡 → corrupt 卡 → 数据卡 → 备份卡
  page.innerHTML = `
    <div class="card"><h3>开关</h3>
      ${switchRow("conversationMemory", "对话记忆（总开关）", "关闭后不带任何记忆、也不再自动记录")}
      ${data.corrupt ? '<div class="notice show err" style="margin:6px 0 0">设置文件已损坏，已按缺省运行——请复查以下开关是否符合预期（改动任一项会重写修复该文件）。</div>' : ""}
      ${switchRow("projectMemory", "项目记忆", "关闭后不再注入/记录项目记忆")}
      ${switchRow("globalExtraction", "全局自动提取", "关闭后不再自动记录全局记忆（已有条目照常注入）")}
      ${switchRow("runtimeEnabled", "运行时记忆（每轮注入的紧凑记忆层）", `${esc(L.RUNTIME_GUIDE_TEXT)}；开启后按配额编译 USER.md / MEMORY.md 注入，超出配额的条目进淘汰候选（只登记不搬动）。`)}
      ${switchRow("idleReviewEnabled", "空闲整理（自动合并/清理）", "默认关。开启后有新增项目记忆时，空闲后跑一次模型整理（合并近重复/清理过期，最多 3 个 op），每会话有上限；会消耗 token。")}
      <div class="meta" data-swHint>保存后下一轮对话生效。</div>
    </div>
    <div data-pipeHealth></div>
    <div data-pipeModel></div>
    <div class="card" id="card-embedding"><h3>嵌入服务（语义召回）</h3>

        <input class="inp" id="embBaseUrl" placeholder="http://127.0.0.1:11434/v1/embeddings"></div>

      <div class="field"><label>提供商标签（可选，仅面板显示用）</label>

      <div class="kv"><b>开启语义召回</b>

        <span class="meta">开启后每轮按当前问题做嵌入检索，命中条目以 &lt;memory-recall&gt; 块注入</span></div>
      <div class="meta" id="embStatus"></div>
      <div class="kv"><b>操作</b><span class="spacer"></span>
        ${L.embeddingClearActionVisible(data) ? '<button class="btn" id="embClearKey">清除已存 Key</button>' : ""}
        <button class="btn" id="embTest">测试连接</button>
        <button class="btn primary" id="embSave">保存</button></div>
    </div>
    <div class="card" id="card-retention"><h3>保留策略</h3>
      <div class="field"><label>回收站保留天数（0 = 可当天清理）</label>
        <input class="inp" id="keepTrashDays" type="number" min="0" step="1"></div>
      <div class="field"><label>快照保留份数（正整数）</label>
        <input class="inp" id="keepSurgical" type="number" min="1" step="1"></div>
      <div class="field"><label>近期动态保留天数（正整数）</label>
        <input class="inp" id="keepRecentDays" type="number" min="1" step="1"></div>
      <div class="meta" id="keepStatus">留空表示不改该项。默认：回收站 30 天、快照 30 份、近期动态 30 天；保存后下一轮对话生效。</div>
      <div class="meta" id="keepHardfactNote">${esc(L.hardfactPolicyNote(s.hardfactPolicy, data.storageRoot ? String(data.storageRoot).replace(/[\\/]+$/, "") + "/settings.json" : null))}</div>
      <div class="kv"><b>操作</b><span class="spacer"></span>
        <button class="btn primary" id="keepSave">保存保留策略</button></div>
    </div>
    ${corruptBits.length > 0 ? `<div class="card" style="border-color:rgba(221,85,85,.5)">解析失败（已按缺省运行）：${corruptBits.map(esc).join("、")}——点任意开关 / 重新保存对应内容即可重写修复。</div>` : ""}
    <div data-settingsHealth></div>
    <div class="card"><h3>数据</h3>
      <div class="kv"><b>导出</b><button class="btn" data-export>导出全部（JSON）</button></div>
      <div class="kv"><b>清空</b><button class="btn danger" data-clearAll>清空全部记忆（逐类自动备份）</button></div>
    </div>
    <div data-maintenance></div>
    <div class="card"><h3>备份（重置/导入/恢复前自动留档）</h3>
      ${backups.length === 0 ? '<div class="meta">暂无备份。</div>' : shownBackups.map((b) => `
        <div class="kv"><b><code class="k">${esc(b.id)}</code></b>
          <span class="meta">${esc(b.reason ?? "")}${b.incomplete ? "（不完整）" : ""} · ${backupTime(b)}</span><span class="spacer"></span>
          <button class="btn sm" data-restore="${esc(b.id)}">恢复此备份</button>
        </div>`).join("")}
      ${backups.length > BACKUP_LIST_LIMIT ? `<div class="meta">还有 ${backups.length - BACKUP_LIST_LIMIT} 条未显示（仅显示最近 ${BACKUP_LIST_LIMIT} 条）。</div>` : ""}
    </div>`;
  // 管道健康卡 + 提取模型卡（元素卡：重试与轮询只重渲染这两张，不打扰开关/备份区）
  page.querySelector("[data-pipeHealth]").replaceWith(buildPipeHealthCard(data));
  page.querySelector("[data-pipeModel]").replaceWith(buildPipeModelCard(data));
  // 设置健康黄条（coercedFields 非空才渲染；空则整块摘除，不留空位）
  const healthHost = page.querySelector("[data-settingsHealth]");
  const healthCard = buildSettingsHealthCard(data);
  if (healthCard) healthHost.replaceWith(healthCard);
  else healthHost.remove();
  // 记忆整理卡（异步拉取建议；失败块内可重试）
  page.querySelector("[data-maintenance]").replaceWith(buildMaintenanceCard());
  schedulePipePoll(data); // streak>0 期间 5s 本地轮询（render 切路由统一清）
  // 门牌「详情」深链落地——面板初载即 #/settings 时滚到健康卡；
  // 内部导航（backDepth>0）不强制滚动，避免每次进设置页都被拽到中段
  if (location.hash === "#/settings" && backDepth === 0) {
    const anchor = document.getElementById("data-pipe-health");
    if (anchor) anchor.scrollIntoView({ block: "start" });
  }
  for (const input of Array.from(page.querySelectorAll("[data-sw]"))) {
    input.addEventListener("change", async () => {
      const key = input.getAttribute("data-sw");
      try {
        await apiPut("settings", { [key]: input.checked });
        // runtimeEnabled 回填：/state 未带该字段（本批 settingsForClient 未接线）时，
        // 页面据此记住用户的真实选择，不让界面在下次渲染回弹成关闭（谎报）
        if (key === "runtimeEnabled") runtimeEnabledLocal = input.checked;
        page.querySelector("[data-swHint]").textContent = key === "runtimeEnabled" && input.checked
          ? "已开启：下一轮对话起注入 runtime 两段（产物在「运行时记忆」页可查看/整理）。"
          : "保存后下一轮对话生效。";
        refreshCounts();
      } catch (err) {
        input.checked = !input.checked;
        toast("开关保存失败：" + err.message, "err");
      }
    });
  }
  // 嵌入服务卡：面板配置写入 settings.json（host 每轮读取 → 免重启生效）；entry config 作缺省来源。
  {
    const emb = (data.settings && data.settings.embedding) || null;
    const eff = data.embeddingEffective || null;
    const entryCfg = data.embeddingConfig && typeof data.embeddingConfig === "object" ? data.embeddingConfig : {};
    const q = (id) => page.querySelector("#" + id);
    // 预填优先取 settings.embedding（面板自己写的那份）；缺省时回落生效配置，再回落 entry config
    // （后端契约新增 embeddingConfig.baseUrl/.model）——避免"表单空白 + 一保存就把好配置清空"。
    // API Key 框永不预填明文（apiKeySet 布尔口径不变）。
    const prefill = emb ?? {
      enabled: eff ? eff.enabled === true : false,
      baseUrl: (eff && eff.baseUrl) || entryCfg.baseUrl || "",
      model: (eff && eff.model) || entryCfg.model || "",
      provider: (eff && eff.provider) || entryCfg.provider || "",
    };
    q("embBaseUrl").value = prefill.baseUrl || "";
    q("embModel").value = prefill.model || "";
    q("embProvider").value = prefill.provider || "";
    q("embEnabled").checked = prefill.enabled === true;
    const status = q("embStatus");
    const srcText = !eff ? "未配置" : eff.source === "config" ? "cordis.patch.yml（entry config）" : "面板设置（settings.json）";
    status.textContent = `当前生效来源：${srcText}${eff && eff.apiKeySet ? "；已设 API Key" : ""}`;
    if (data.injectChannel && data.injectChannel !== "message") status.textContent += "；⚠ 注入通道为 section，语义召回不生效（需 injectChannel: message）";
    const collect = () => {
      const out = { enabled: q("embEnabled").checked, baseUrl: q("embBaseUrl").value.trim(), model: q("embModel").value.trim(), provider: q("embProvider").value.trim() };
      if (q("embApiKey").value.length > 0) out.apiKey = q("embApiKey").value; // 仅在输入新 key 时提交，避免覆盖已存 key
      return out;
    };
    const embSaveBtn = q("embSave");
    embSaveBtn.addEventListener("click", async () => {
      const patch = collect();
      const v = L.validateEmbeddingDraft(patch);
      if (!v.ok) { toast(v.error, "err"); return; }
      embSaveBtn.disabled = true; embSaveBtn.textContent = "处理中…"; // 三段式 busy
      try {
        await apiPut("settings", { embedding: patch });
        q("embApiKey").value = "";
        toast("嵌入配置已保存，保存后下一轮对话生效。");
        renderSettingsPage();
      } catch (err) { toast("保存失败：" + err.message, "err"); }
      finally { embSaveBtn.disabled = false; embSaveBtn.textContent = "保存"; }
    });
    q("embTest").addEventListener("click", async () => {
      const btn = q("embTest");
      btn.disabled = true;
      btn.textContent = "测试中…";
      try {
        const out = await apiPost("embedding/test", collect());
        if (out && out.ok) toast(`连接成功（向量维度 ${out.dim}）`);
        else toast("连接失败：" + ((out && out.error) || "未知错误"), "err");
      } catch (err) { toast("测试失败：" + err.message, "err"); }
      finally { btn.disabled = false; btn.textContent = "测试连接"; }
    });
    // 清除已存 Key：仅当面板自己保存的那份密钥在场（settings.embedding.apiKeySet）时按钮出现。
    // 载荷只提交显式 apiKey:null —— 不复用表单现值：嵌入配置残缺（如开关开而端点空）时
    // 清除动作也必须总能成功，不被其余字段的保存校验连带拒绝。
    const clearBtn = q("embClearKey");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      confirmDialog({
        title: "清除已存 API Key",
        body: "将删除面板保存的嵌入 API Key（其余端点/模型配置保留）。\n若端点需要密钥，清除后嵌入检索会失败。确定继续吗？",
        dangerText: "清除 Key",
        onConfirm: async () => {
          try {
            await apiPut("settings", { embedding: { apiKey: null } });
            q("embApiKey").value = "";
            toast("已清除已存 API Key。");
            renderSettingsPage(); // 刷新状态行：apiKeySet 变 false 后按钮随之消失
          } catch (err) { toast("清除失败：" + err.message, "err"); }
        },
      });
    });
  }
  // 保留策略卡：回收站保留天数 / 快照保留份数 / 近期动态保留天数。预填 /state.settings.*，
  // 保存走 PUT /settings（键名即这三项；后端严格校验，非法值 400——前端先做正整数预检）。
  // 同卡另有一段硬事实守护指路（L.hardfactPolicyNote）：只说明、**不加控件**——拨到 block
  // 会把合法更新一起回滚，用户看到「我改的记忆自己变回去了」，故只指路到 settings.json。
  {
    const q = (id) => page.querySelector("#" + id);
    const $td = q("keepTrashDays"), $sk = q("keepSurgical"), $rd = q("keepRecentDays"), $st = q("keepStatus");
    // tolerant 预填：缺失不写 0（留空，placeholder 说明默认值）
    if (s.trashKeepDays != null) $td.value = String(s.trashKeepDays);
    if (s.surgicalKeep != null) $sk.value = String(s.surgicalKeep);
    if (s.recentKeepDays != null) $rd.value = String(s.recentKeepDays);
    const keepBtn = q("keepSave");
    keepBtn.addEventListener("click", async () => {
      // 正整数预检（回收站天数允许 0）：空/非整数/负数直接拦下，不发 400 空跑
      const tdRaw = $td.value.trim();
      const skRaw = $sk.value.trim();
      const rdRaw = $rd.value.trim();
      const patch = {};
      if (tdRaw !== "") {
        const n = Number(tdRaw);
        if (!Number.isInteger(n) || n < 0) { toast("回收站保留天数必须是不小于 0 的整数", "err"); return; }
        patch.trashKeepDays = n;
      }
      if (skRaw !== "") {
        const n = Number(skRaw);
        if (!Number.isInteger(n) || n < 1) { toast("快照保留份数必须是正整数", "err"); return; }
        patch.surgicalKeep = n;
      }
      if (rdRaw !== "") {
        const n = Number(rdRaw);
        if (!Number.isInteger(n) || n < 1) { toast("近期动态保留天数必须是正整数", "err"); return; }
        patch.recentKeepDays = n;
      }
      if (Object.keys(patch).length === 0) { toast("没有可保存的改动（三项均为空）", "err"); return; }
      keepBtn.disabled = true; keepBtn.textContent = "处理中…";
      try {
        await apiPut("settings", patch);
        toast("保留策略已保存，下一轮对话生效。");
        renderSettingsPage();
      } catch (err) { toast("保存失败：" + err.message, "err"); }
      finally { keepBtn.disabled = false; keepBtn.textContent = "保存保留策略"; }
    });
  }
  const exportBtn = page.querySelector("[data-export]");
  exportBtn.addEventListener("click", async () => {
    exportBtn.disabled = true; exportBtn.textContent = "处理中…";
    try {
      const out = await api("export");
      const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `dsh-keepsake-export-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已导出");
    } catch (err) { toast("导出失败：" + err.message, "err"); }
    finally { exportBtn.disabled = false; exportBtn.textContent = "导出全部（JSON）"; }
  });
  const clearAllBtn = page.querySelector("[data-clearAll]");
  clearAllBtn.addEventListener("click", () => {
    confirmDialog({
      title: "清空全部记忆",
      body: "将依次清空五个全局分类（每个分类清空前都会自动备份）。人设与称呼保留。\n确定继续吗？",
      dangerText: "逐类备份并清空",
      onConfirm: async () => {
        clearAllBtn.disabled = true; clearAllBtn.textContent = "处理中…";
        const cats = [
          ["work-profile", "工作背景"], ["user-profile", "用户个人背景"],
          ["current-focus", "当前关注"], ["recent-activity", "近期动态"], ["long-term", "长期记忆"],
        ];
        let total = 0;
        const done = []; // {label, backupId}
        const failed = []; // {label, message}
        try {
          for (const [cat, label] of cats) {
            try {
              const out = await apiPost(`category/${cat}/reset`);
              total += out.removed ?? 0;
              done.push({ label, backupId: out.backupId });
            } catch (err) {
              failed.push({ label, message: err.message });
            }
          }
          if (failed.length === 0) {
            toast(`已清空全部（共 ${total} 条，逐类备份）`);
          } else {
            // 中途失败不静默：列出已清/未清分类 + 指路对应备份 id（逐类备份可单独恢复）
            const doneText = done.length > 0
              ? done.map((d) => `${d.label}（备份 ${d.backupId}）`).join("、")
              : "无";
            const failText = failed.map((f) => `${f.label}（${f.message}）`).join("、");
            toast(`清空未完成——已清空：${doneText}；未清空：${failText}。可到下方备份列表按 id 恢复。`, "err");
          }
          renderSettingsPage();
          refreshCounts();
        } catch (err) { toast("清空失败：" + err.message, "err"); }
        finally { clearAllBtn.disabled = false; clearAllBtn.textContent = "清空全部记忆（逐类自动备份）"; }
      },
    });
  });
  for (const btn of Array.from(page.querySelectorAll("[data-restore]"))) {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-restore");
      confirmDialog({
        title: "从备份恢复",
        body: `将用备份 ${esc(id)} 全量覆盖当前全局记忆与人设/称呼。\n恢复前系统会先把当前状态再备份一次。确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            await apiPost("backup/restore", { id });
            toast("已恢复（恢复前现态已自动备份）");
            renderSettingsPage();
            refreshCounts();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复此备份"; }
        },
      });
    });
  }
}

// ============ 路由 ============
const ROUTES = {
  "category/work-profile": { title: "工作背景", cat: "work-profile" },
  "category/user-profile": { title: "用户个人背景", cat: "user-profile" },
  "category/current-focus": { title: "当前关注", cat: "current-focus" },
  "category/recent-activity": { title: "近期动态", cat: "recent-activity" },
  "long-term": { title: "长期记忆" },
  "runtime": { title: "运行时记忆" },
  "persona": { title: "人设" },
  "addressing": { title: "称呼" },
  "projects": { title: "项目记忆" },
  "activity": { title: "最近活动" },
  "trash": { title: "回收站" },
  "snapshots": { title: "快照" },
  "settings": { title: "设置" },
};
function currentRoute() {
  const hash = location.hash.replace(/^#\/?/, "");
  return ROUTES[hash] ? hash : "category/work-profile";
}
function render() {
  stopPipePoll(); // 路由切走必须清健康卡轮询 timer（设置页重进时再按 streak 重建）
  stopPendingPoll(); // 补提轮询同理：切走路由后不得再打 pending 端点
  const route = currentRoute();
  const cfg = ROUTES[route];
  document.querySelectorAll("aside a").forEach((a) => a.classList.toggle("on", a.getAttribute("data-route") === route));
  if (cfg.cat) renderCategoryPage(cfg.cat, cfg.title);
  else if (route === "long-term") renderLongTermPage();
  else if (route === "runtime") renderRuntimePage();
  else if (route === "persona") renderPersonaPage();
  else if (route === "addressing") renderAddressingPage();
  else if (route === "projects") renderProjectsPage();
  else if (route === "activity") renderActivityPage();
  else if (route === "trash") renderTrashPage();
  else if (route === "snapshots") renderSnapshotsPage();
  else if (route === "settings") renderSettingsPage();
}
document.querySelectorAll("aside a").forEach((a) => {
  a.addEventListener("click", () => { location.hash = "#/" + a.getAttribute("data-route"); });
});
window.addEventListener("hashchange", render);

function refreshCounts() {
  api("state").then((data) => {
    const byCat = (data.counts && data.counts.byCategory) || {};
    const streak = L.extractionStreakOf(data.extractionFailures); // 设置项红徽标顺路更新
    document.querySelectorAll("[data-cnt]").forEach((el) => {
      const key = el.getAttribute("data-cnt");
      // 写入安全面计数：/state.safety 缺失（旧版宿主）→ 0（面板 tolerant 消费）
      const n = key === "extraction-streak" ? streak
        : key === "runtime" ? (runtimeBadgeCount ?? 0) // 运行时记忆：淘汰候选数（页面拉取时回填，0 不显示）
        : key === "projects" ? (data.counts ? data.counts.projects : 0)
        : key === "trash" ? L.safetyCountOf(data.safety, "trashPending")
        : key === "snapshots" ? L.safetyCountOf(data.safety, "surgicalBackups")
        : (byCat[key] || 0);
      // 提取连击红徽标 / 运行时候选徽标：0 时隐藏（不是计数语义）；其余计数 0 也显示 "0"，
      // 与"加载失败"的空态区分开（后者给可见提示态，不吞错）
      el.textContent = (key === "extraction-streak" || key === "runtime") ? (n > 0 ? String(n) : "") : String(n);
    });
    clearCountsError();
  }).catch(() => { markCountsError(); }); // 计数失败显式提示态（不静默吞错）
}

/** 计数拉取失败提示：只在 #countsStatus 出文字（不静默吞错）。
 *  曾同时给 #nav 加 counts-error class，但样式表里从没有对应规则（空闸），已删。 */
function markCountsError() {
  const el = document.getElementById("countsStatus");
  if (el) { el.hidden = false; el.textContent = "计数暂时无法加载"; }
}
function clearCountsError() {
  const el = document.getElementById("countsStatus");
  if (el) { el.hidden = true; }
}

window.addEventListener("load", () => {
  startThemeBridge();
  refreshCounts();
  // 30s 轻轮询——顺路保 aside 计数与提取红徽标不过期（页面级 interval，随页回收）
  setInterval(refreshCounts, 30000);
  render();
});
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆管理</title>
<style>
  /* ===== 面板自持配色（不消费宿主背景色）=====
     为什么不能沿用 var(--dsw-alias-bg-*)：宿主侧壁纸/玻璃插件会把 bg token 改写成
     半透明（第三方 dsh-plugin-wallpaper-engine 的玻璃配方即如此）。半透明背景搬进
     iframe 后白字直接坐在半透明层上——2026-10-27 实测正文对比度 3.10:1（AA 线 4.5）、
     卡片与正文底 1.00:1 完全同色、弹窗更差到 1.49:1。
     ⚠️ 「把半透明合成到实色上」在数学上救不了（白 51% 叠任何底，白字都只有 2.76–3.68），
     所以这里**直接持有不透明实色**：背景归面板，文字/边框/强调色继续跟随宿主主题。
     深色档取值对齐宿主真实 token：bg=bluish-875 #232324、panel=bluish-850 #2c2c2e。 */
  html { color-scheme: light dark; }
  /* 四档必须变量集合完全一致：漏一档会在该档退回上一级继承值。
     实测过媒体兜底档漏 --fb-hover/--fb-selected 的后果：深色面板上出现近白色选中条（1.03:1）。
     校验断言四档的变量名集合 deepEqual。 */
  body { --fb-bg: #f7f8fa; --fb-panel: #ffffff; --fb-label: #1f2328; --fb-label2: #59636e; --fb-border: rgba(27,31,36,.12);
         --fb-danger: #b5342a; --fb-ok: #276d2b; --fb-warn: #7d5200; --fb-accent: #1259a8;
         --fb-hover: #f2f3f5; --fb-selected: #e4e7eb; }
  body.theme-dark { --fb-bg: #232324; --fb-panel: #2c2c2e; --fb-label: #e6e8eb; --fb-label2: #a8b0b9; --fb-border: rgba(240,244,248,.14);
         --fb-danger: #f2968e; --fb-ok: #66c274; --fb-warn: #e5a95c; --fb-accent: #8db4f5;
         --fb-hover: #33343a; --fb-selected: #3f4046;
         color-scheme: dark; }
  /* 系统深色兜底：只在用户没手动选过档时生效（手动档挂 theme-light / theme-dark）。
     没有这条时，主题桥一旦失败面板就停在浅色白底，深色系统下闪白——也是「刺眼」的一种。 */
  @media (prefers-color-scheme: dark) {
    body:not(.theme-light) { --fb-bg: #232324; --fb-panel: #2c2c2e; --fb-label: #e6e8eb; --fb-label2: #a8b0b9; --fb-border: rgba(240,244,248,.14);
         --fb-danger: #f2968e; --fb-ok: #66c274; --fb-warn: #e5a95c; --fb-accent: #8db4f5;
         --fb-hover: #33343a; --fb-selected: #3f4046;
         color-scheme: dark; }
  }
  body.theme-light { --fb-bg: #f7f8fa; --fb-panel: #ffffff; --fb-label: #1f2328; --fb-label2: #59636e; --fb-border: rgba(27,31,36,.12);
         --fb-danger: #b5342a; --fb-ok: #276d2b; --fb-warn: #7d5200; --fb-accent: #1259a8;
         --fb-hover: #f2f3f5; --fb-selected: #e4e7eb;
         color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--fb-bg); color: var(--dsw-alias-label-primary, var(--fb-label)); display: flex; min-height: 100vh; }
  aside { width: 200px; flex: none; padding: 18px 12px; border-right: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: var(--fb-panel); display: flex; flex-direction: column; gap: 2px; }
  aside .brand { font-weight: 700; font-size: 15px; padding: 2px 10px 12px; }
  aside .group { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); padding: 10px 10px 4px; font-weight: 600; }
  aside a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; user-select: none; color: inherit; text-decoration: none; }
  aside a:hover { background: var(--fb-hover); }
  aside a.on { background: var(--fb-selected); font-weight: 600; }
  aside a .cnt { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-weight: 400; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: var(--fb-panel); }
  .topbar h1 { font-size: 16px; margin: 0; display: inline; }
  .topbar .sub { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); margin-left: 8px; }
  .btn { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: transparent; color: inherit; border-radius: 8px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .btn:hover { background: var(--fb-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--fb-selected); font-weight: 600; }
  .btn.danger { color: var(--fb-danger); border-color: rgba(221,85,85,.5); }
  .btn.sm { padding: 1px 8px; font-size: 11px; }
  .notice { margin: 12px 20px 0; border-radius: 8px; padding: 6px 10px; font-size: 12px; background: rgba(204,153,102,.16); display: none; }
  .notice.show { display: block; }
  .notice.err { background: rgba(221,85,85,.14); }
  .notice.ok { background: rgba(80,160,90,.14); }
  #page { padding: 18px 20px; overflow: auto; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .card { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 12px; background: var(--fb-panel); padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 .ops { margin-left: auto; display: flex; gap: 6px; }
  .meta { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .entry-body { margin-top: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-size: 13px; padding: 24px 0; text-align: center; }
  .kv { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
  .kv b { min-width: 120px; font-weight: 600; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .badge.warn { color: var(--fb-warn); border-color: rgba(204,153,102,.55); }
  .inp, .ta { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: transparent; color: inherit; border-radius: 8px; padding: 5px 8px; font-size: 12.5px; font-family: inherit; width: 100%; }
  .inp:focus, .ta:focus { outline: none; border-color: var(--dsw-alias-state-business-primary, var(--fb-accent)); }
  .ta { min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; line-height: 1.5; }
  .ta.tall { min-height: 300px; }
  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
  .field label { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .switchWrap { display: inline-flex; align-items: center; gap: 8px; }
  .switch { position: relative; width: 34px; height: 19px; flex: none; display: inline-block; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .slider { position: absolute; inset: 0; border-radius: 99px; background: rgba(128,128,128,.4); transition: .15s; pointer-events: none; }
  .slider::after { content: ''; position: absolute; top: 2.5px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #c8cdd4; transition: .15s; }
  .switch input:checked + .slider { background: var(--dsw-alias-state-business-primary, var(--fb-accent)); }
  .switch input:checked + .slider::after { left: 17px; background: #fff; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog { background: var(--fb-panel); color: inherit; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); box-shadow: 0 0 16px rgba(0,0,0,.25); border-radius: 12px; padding: 16px; width: min(720px, 94vw); max-height: 86vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .dialog h2 { font-size: 14px; margin: 0; }
  .dialog .foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px dashed var(--dsw-alias-border-l2, var(--fb-border)); padding-top: 10px; }
  table.preview { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.preview th, table.preview td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); vertical-align: top; }
  table.preview tr.danger td { background: rgba(221,85,85,.1); }
  table.preview tr.danger td:first-child { border-left: 3px solid var(--fb-danger); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .mdprev h1, .mdprev h2, .mdprev h3 { margin: 8px 0 4px; }
  .mdprev h1 { font-size: 17px; } .mdprev h2 { font-size: 15px; } .mdprev h3 { font-size: 13.5px; }
  .mdprev p { margin: 6px 0; }
  .mdprev code { font-family: Consolas, monospace; font-size: 12px; background: rgba(128,128,128,.14); border-radius: 4px; padding: 0 4px; }
  .mdprev ul { margin: 4px 0; padding-left: 20px; }
  .presetRow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { display: inline-flex; align-items: center; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 8px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; user-select: none; background: transparent; color: inherit; }
  .pill:hover { background: var(--fb-hover); }
  .pill.on { background: var(--fb-selected); font-weight: 600; }
  .search { max-width: 320px; }
  code.k { font-family: Consolas, monospace; font-size: 12px; background: rgba(128,128,128,.12); border-radius: 4px; padding: 0 4px; }
  /* 窄屏横向滚动容器（导入预览表 + 失败详情表共用，防小窗撑破） */
  .tableScroll { overflow: auto; margin: 8px 0; }
  /* 三态灯点：绿/黄/红只用既有色值（var(--fb-ok)/var(--fb-warn)/var(--fb-danger)，不引新值）；
     灰=提取在途（闪烁），色取 --dsw-alias-label-secondary 带 fallback */
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.green { background: var(--fb-ok); }
  .dot.yellow { background: var(--fb-warn); }
  .dot.red { background: var(--fb-danger); }
  .dot.grey { background: var(--dsw-alias-label-secondary, var(--fb-label2)); animation: dotBlink 1.1s ease-in-out infinite; }
  @keyframes dotBlink { 50% { opacity: .3; } }
  /* aside 设置项的提取连击红徽标（与 .cnt 同形，红=var(--fb-danger) 既有值） */
  aside a .cnt.alert { color: var(--fb-danger); font-weight: 600; }
  /* 提示条（.notice）：错误类延长至 8 秒自动消失 + 最近错误区兜底，关闭按钮贴在文字右侧 */
  #toast .toastClose { margin-left: 10px; vertical-align: middle; }
  /* 「最近错误」回看区（保留最近 5 条，折叠收纳） */
  #recentErrors { margin: 12px 20px 0; }
  #recentErrors summary { cursor: pointer; }
  #recentErrors .errItem { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
  /* 运行时记忆页签：用量进度条（越界红显，红=var(--fb-danger) 既有值）+ 产物只读预览框（等宽字体滚动区） */
  .bar { flex: 1; min-width: 120px; height: 8px; border-radius: 99px; background: rgba(128,128,128,.25); overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--dsw-alias-state-business-primary, var(--fb-accent)); }
  .bar.over > i { background: var(--fb-danger); }
  .codeBox { margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; background: rgba(128,128,128,.08); border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 8px; padding: 8px 10px; max-height: 320px; overflow: auto; }
  /* 三态灯状态词（颜色之外的第二编码，色弱/灰度屏也能读） */
  .statusWord { font-size: 12px; font-weight: 600; }
  .statusWord.green { color: var(--fb-ok); }
  .statusWord.yellow { color: var(--fb-warn); }
  .statusWord.red { color: var(--fb-danger); }
  .statusWord.grey { color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  /* 窄屏（≤800px）：侧栏转横排、分栏堆叠单列、顶栏可换行，防小窗破版 */
  @media (max-width: 800px) {
    body { flex-direction: column; }
    aside { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; border-right: none; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); padding: 10px 12px; }
    aside .brand { padding: 2px 10px; }
    aside .group { padding: 4px 8px; }
    aside a { padding: 4px 8px; }
    .topbar { flex-wrap: wrap; }
    .split { grid-template-columns: 1fr; }
  }
  /* ============ 内嵌档（iframe，745×392 设置页门牌）特化 ============
     全部挂在 body.dsk-embedded 下：独立窗口档拿不到这个 class，上面每一条规则都照旧生效。
     内嵌下正文撑满 iframe 视口并自己滚，侧栏与顶栏钉死不参与滚动（否则第一屏卡片被腰斩）。
     实测坑：body{height:100%} 在 iframe 里解析不到高度（html 无 height，100% 无参照），
     body 会保持内容高度 2503px、iframe 整体滚动、#page 反而不滚——必须用 100vh
     （iframe 内 vh = iframe 视口高，实测 392px 精准生效）。 */
  body.dsk-embedded { min-height: 0; height: 100vh; }
  /* main 兜底滚动：提示区（黄条/toast/计数/展开的最近错误）叠满时，#page 会被 flex 压到
     几十像素甚至排到 main 盒外——overflow:hidden 会让它彻底不可见且无处可滚。
     这里按可见滚动处理，顶栏 sticky 钉在 main 顶部不随内容跑。 */
  body.dsk-embedded main { min-height: 0; overflow-y: auto; }
  body.dsk-embedded .topbar { position: sticky; top: 0; z-index: 2; }
  body.dsk-embedded #page { flex: 1; min-height: 0; overflow-y: auto; }
  /* 提示区高度纪律：最近错误（details）最多占 25vh，展开的 errItem 在框内滚，不吃光正文高度 */
  body.dsk-embedded #recentErrors { max-height: 25vh; overflow-y: auto; }
  /* 弹窗高度上限按容器算：mask 是 fixed;inset:0，100% 即 iframe 视口高，多钳一道防撑破 */
  body.dsk-embedded .dialog { max-height: min(86vh, calc(100% - 24px)); }
  /* 侧栏横排单行横滚（B1）：745px 内嵌宽下 13 个链接固有宽度约 918px（+ 品牌 95px ≈ 1013px），
     一行放不下——改成 nowrap + overflow-x:auto 让侧栏自己横滑，分组标签在横排态无指示作用故隐藏。
     实测坑：光有 nowrap + overflow-x:auto 不够——aside a 默认 flex-shrink:1，745px 下
     链接会被压缩到 574px（文字折行成两行、行高被挤），既不可读也永远不触发横滚。
     必须给 a 补 flex:none + white-space:nowrap，让它保持固有宽度溢出后才谈得上横滑。
     这些规则只在横排态成立：宽内嵌（>800px）下 aside 是 200px 竖排，nowrap 会让长标签
     溢出成横滚条，故与 media 查询同域包起来。 */
  @media (max-width: 800px) {
    body.dsk-embedded aside { flex-wrap: nowrap; overflow-x: auto; }
    body.dsk-embedded aside .group { display: none; }
    body.dsk-embedded aside .brand { flex: none; }
    body.dsk-embedded aside a { flex: none; white-space: nowrap; }
  }
  /* 顶栏双键合一（B2）：主题桥未成功跟随时，「手动切换深浅色」从大按钮缩成无文字图标钮，
     把顶栏横向空间让给页面标题。JS 侧由 EMBEDDED 门控给它加 dsk-iconBtn 并把文字压成 ◐；
     主题桥成功后该钮被内联 display:none 隐藏（bridgeApply），静态形态只管它活着时长什么样。 */
  body.dsk-embedded #themeToggle.dsk-iconBtn { padding: 3px 8px; font-size: 14px; line-height: 1.2; letter-spacing: 0; white-space: nowrap; }
</style>
</head>
<body>
<script>try { if (window.self !== window.top) document.body.classList.add("dsk-embedded"); } catch (e) { document.body.classList.add("dsk-embedded"); }</script>
  <aside id="nav">
    <div class="brand">记忆管理台</div>
    <div class="group">记忆分类</div>
    <a href="#/category/work-profile" data-route="category/work-profile">工作背景 <span class="cnt" data-cnt="work-profile"></span></a>
    <a href="#/category/user-profile" data-route="category/user-profile">用户个人背景 <span class="cnt" data-cnt="user-profile"></span></a>
    <a href="#/category/current-focus" data-route="category/current-focus">当前关注 <span class="cnt" data-cnt="current-focus"></span></a>
    <a href="#/category/recent-activity" data-route="category/recent-activity">近期动态 <span class="cnt" data-cnt="recent-activity"></span></a>
    <div class="group">通用</div>
    <a href="#/long-term" data-route="long-term">长期记忆 <span class="cnt" data-cnt="long-term"></span></a>
    <a href="#/runtime" data-route="runtime">运行时记忆 <span class="cnt" data-cnt="runtime" title="淘汰候选数（打开该页签后回填；0 不显示）"></span></a>

    <a href="#/activity" data-route="activity">最近活动</a>

    <a href="#/trash" data-route="trash">回收站 <span class="cnt" data-cnt="trash"></span></a>
    <a href="#/snapshots" data-route="snapshots">快照 <span class="cnt" data-cnt="snapshots"></span></a>
    <a href="#/settings" data-route="settings">设置 <span class="cnt alert" data-cnt="extraction-streak" title="自动提取连续失败次数（设置页管道健康卡可看详情）"></span></a>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="pageTitle">记忆管理</h1><span class="sub" id="pageSub"></span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="themeToggle" title="未能自动跟随应用主题时，在这里手动切换深浅色">◐ 手动切换深浅色</button>
        <button class="btn" id="backBtn">← 返回设置</button>
      </div>
    </div>
    <div class="notice" id="bridgeNotice">未能跟随应用主题，请手动选择深浅色——右上角可切换。</div>
    <div class="notice" id="toast" role="status" aria-live="polite"></div>    <div class="meta" id="countsStatus" hidden style="margin:6px 20px 0"></div>
    <details id="recentErrors" hidden>
      <summary class="meta">最近错误（保留最近 5 条）</summary>
      <div data-errList></div>
    </details>
    <div id="page"></div>
  </main>
  <div id="dialogHost"></div>

<script type="module">
import * as L from "/dsh-keepsake/panel/panel-logic.js";

const $ = (id) => document.getElementById(id);
const page = $("page");
const pageTitle = $("pageTitle");
const pageSub = $("pageSub");
const dialogHost = $("dialogHost");

// ============ 内嵌感知（A2 地基，B1/B2/B3 的前提） ============
// DSH 设置页的门牌在 window.open 被拦时，会把面板塞进一个 745×392 的 iframe（内嵌模式）。
// 探测「我在框里」并给 body 打 dsk-embedded：所有内嵌特化样式都挂在该 class 下，
// 独立窗口档（非 iframe）拿不到这个 class，行为逐字节不变。
// 跨域取 window.top 会抛 SecurityError——异常时按内嵌处理（保守：宁可按框里裁，不按大窗排版）。
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
// body 开头的同步内联脚本已先加好 dsk-embedded（module 要等 import 解析完才执行，早加防闪一帧）；
// 这里幂等兜底，防止将来有人删掉那个内联脚本。
if (EMBEDDED) document.body.classList.add("dsk-embedded");

// 弹窗/编辑框高度单位（A3）：内嵌档改用 min(vh, 像素钳位)/容器钳位，独立窗口档沿用原 vh 字面量，
// 渲染结果逐字节不变。用 EMBEDDED 门控而非 CSS 覆盖，是因为这几处是内联 style（模板串里），挂不上 class。
// 说明：在 392px 视口下这些 min() 与原 vh 等值（vh 项本就小于像素钳位/容器钳位，如 46vh=180px < 220px），
// 不产生任何视觉变化。真正生效的场景是 iframe 被撑高时：宿主窗口变高 → 容器 min(70vh,620px) 可到约 589px，
// 此时 46vh=271px > 220px 钳位开始起作用，作用是防止 textarea/列表吃光弹窗高度、把 foot 按钮推出可视区。
// （注意：不是「按钮被 iframe 裁掉」——弹窗并未超出 392px，只是在弹窗内部需要滚一下才能看到 foot。）
const DIALOG_CAP_PAGES = EMBEDDED ? "min(88vh,calc(100% - 24px))" : "88vh";   // 知识页弹窗
const DIALOG_MIN_SRC = EMBEDDED ? "min(46vh,220px)" : "46vh";                 // 源码模式 textarea
const DIALOG_MIN_PERSONA = EMBEDDED ? "min(52vh,240px)" : "52vh";             // 人设编辑框 + 预览框
const DIALOG_CAP_LIST = EMBEDDED ? "min(52vh,320px)" : "52vh";                // 批量纠正列表容器

// ============ 主题桥（定案机制） ============
const hostWindow = (() => {
  try { if (window.opener && window.opener !== window) return window.opener; } catch (e) {}
  try { if (window.parent && window.parent !== window) return window.parent; } catch (e) {}
  return null;
})();
let manualTheme = false;
let bridgeLastOk = false; // [已知] 桥曾成功标记：桥再失效（n===0）时重挂退路

function bridgeApply(vars) {
  if (manualTheme) return 0; // 手动档已选即断桥——晚到的成功不得踩死手动选择
  // 背景 token 全由面板自持（OWNED_BG_TOKENS），这里只搬文字/边框/强调色。
  // 宿主的背景可能是半透明的（壁纸/玻璃插件改写），搬过来会让白字坐在半透明层上，
  // 实测只有 3.10:1；合成也救不了（见 lib/color.js compositeOver 注释）。
  let r;
  try {
    r = L.applyThemeVars(document.body.style, vars, L.OWNED_BG_TOKENS);
  } catch (e) {
    // 缺 ownedBgTokens 等编程错误：不许静默退回旧的全量搬运（那等于回到事故行为）。
    // 文案必须说实话——这里**没有**清掉此前写入的内联 token，不能声称「已回落」。
    toast("主题桥调用失败（面板自带配色继续生效）：" + String(e && e.message ? e.message : e));
    return 0;
  }
  const n = r.applied;
  if (n > 0) {
    bridgeLastOk = true;
    syncTierToHost();
    $("bridgeNotice").classList.remove("show");
    $("themeToggle").style.display = "none";
  } else if (bridgeLastOk) {
    // [已知] 退路：桥曾成功、现在收集不到变量（host 关闭/样式表消失）——
    // 旧变量只写不删会冻结在旧主题，必须重挂提示+复活手动钮
    bridgeLastOk = false;
    $("bridgeNotice").classList.add("show");
    $("themeToggle").style.display = "";
  }
  return n;
}

/**
 * 把面板的**背景档位**钉到宿主权威上（宿主 body 的 data-ds-dark-theme）。
 *
 * 为什么必须这样做：前景色（--dsw-alias-label-*）是桥从宿主搬来的，天然跟宿主档；
 * 而背景档若只靠 @media (prefers-color-scheme)，在**独立窗口档（popup）**里跟的是
 * 操作系统而不是宿主——两者不一致时会出现「宿主深色字 + 面板浅色底」= 白字白底
 * 1.02:1，比本事故（3.10:1）更糟。iframe 档因为继承宿主 color-scheme 侥幸一致，
 * 于是同一个偏好设置在两种打开方式下结果相反——这正是档位权威没收敛的表现。
 *
 * 拿不到宿主（桥断/跨域）时保持 media 兜底，不强行写 class。
 */
function syncTierToHost() {
  let isDark = null;
  try {
    const body = hostWindow && hostWindow.document ? hostWindow.document.body : null;
    if (body) isDark = body.hasAttribute("data-ds-dark-theme");
  } catch { /* 跨域拒读：保持 media 兜底 */ }
  if (isDark === null) return;
  document.body.classList.toggle("theme-dark", isDark);
  document.body.classList.toggle("theme-light", !isDark);
}
/** 主题桥从未成功的提示分档（B3）：内嵌档 392px 高塞不下常驻黄条，降级为 toast 一次；
 *  独立窗口档保持常驻黄条（.notice 静态隐藏 + show 才现）。 */
function bridgeNeverOkNotice() {
  if (EMBEDDED) {
    toast("未跟随应用主题，可点右上角 ◐ 手动切换");
  } else {
    $("bridgeNotice").classList.add("show");
  }
}
function startThemeBridge() {
  if (!hostWindow) { bridgeNeverOkNotice(); return; }
  const vars = L.collectThemeVarsFromDoc(hostWindow.document);
  if (Object.keys(vars).length > 0) bridgeApply(vars);
  else bridgeNeverOkNotice();
  window.addEventListener("message", (ev) => {
    if (ev && ev.data && ev.data.type === "dsh-keepsake:theme" && ev.data.vars) bridgeApply(ev.data.vars);
  });
  try {
    let pending = false;
    const observer = new MutationObserver(() => {
      if (pending) return;
      pending = true;
      setTimeout(() => { pending = false; bridgeApply(L.collectThemeVarsFromDoc(hostWindow.document)); }, 50);
    });
    const filter = ["style", "class", "data-ds-dark-theme", "data-ds-theme-source"];
    observer.observe(hostWindow.document.body, { attributes: true, attributeFilter: filter });
    observer.observe(hostWindow.document.documentElement, { attributes: true, attributeFilter: filter });
  } catch (e) { /* 保留静态变量 */ }
  try { hostWindow.postMessage({ type: "dsh-keepsake:panel-ready" }, "*"); } catch (e) {}
}
// B2：内嵌档把「手动切换深浅色」从顶栏大按钮缩成无文字图标钮——745px 宽下顶栏横向紧张，
// 大按钮（121px）会把页面标题挤成一行渣。只改静态形态（文字/标题/class + CSS 收宽度）；
// 显隐逻辑仍归 bridgeApply 的内联 style 赋值（成功 display:none / 失效复活），那两个点不动。
if (EMBEDDED) {
  const themeToggle = $("themeToggle");
  themeToggle.textContent = "◐";
  themeToggle.title = "手动切换深浅色";
  themeToggle.setAttribute("aria-label", "手动切换深浅色");
  themeToggle.classList.add("dsk-iconBtn");
}
$("themeToggle").addEventListener("click", () => {
  manualTheme = true; // 单向断桥（再点只切换深浅，桥不再接管）
  // 清掉桥写进 body 内联的 --dsw-alias-*（级联优先级高于样式表），
  // 让 body.theme-dark / theme-light 的 --fb-* 兜底重新生效——否则手动档被架空、按钮变死键
  const st = document.body.style;
  for (let i = st.length - 1; i >= 0; i -= 1) {
    const name = st[i];
    if (typeof name === "string" && name.startsWith("--dsw-alias-")) st.removeProperty(name);
  }
  // 两档互斥：之前只 toggle theme-dark，于是「系统深色 + 未手动选」的媒体查询兜底
  // 会在 .theme-light 缺失时继续生效，手动切浅色等于无效。
  // 判定必须用「实际渲染档」而不是「class 是否含 theme-dark」——
  // 系统深色 + 未手动选时实际已显示深色（media 生效），若只看 class 会判成浅色，
  // 于是首次点击写成 theme-dark → 视觉上毫无变化，用户以为按钮坏了。
  const isDark = currentTierIsDark();
  document.body.classList.toggle("theme-dark", !isDark);
  document.body.classList.toggle("theme-light", isDark);
});

/** 当前**实际渲染**的档位是否为深色（class 优先，其次 media 兜底）。 */
function currentTierIsDark() {
  const cls = document.body.classList;
  if (cls.contains("theme-dark")) return true;
  if (cls.contains("theme-light")) return false;
  try {
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  } catch {
    return false;
  }
}
// 「返回设置」分档：popup 关窗 / iframe 通知宿主收起 / 顶层绕开面板内部
// hash 路由历史一步回设置页（决策纯函数 L.panelBackAction 进检查）
let backDepth = 0; // 面板内部 hash 路由压栈计数（load 后 hashchange 次数）
window.addEventListener("hashchange", () => { backDepth += 1; });
// A4：内嵌档按钮文案分档。内嵌下 L.panelBackAction 给的是 notify-host（通知宿主收起面板），
// 「← 返回设置」会让人以为能回到设置页，实际只是收起——文案必须说实话（含 title 说明）。
// 非内嵌档逐字节保持原样（文案恒为「← 返回设置」）。只在初始化时设一次，点击时不再改。
if (EMBEDDED) {
  const backBtn = $("backBtn");
  backBtn.textContent = "收起面板";
  backBtn.title = "内嵌模式下点击会收起面板，不会离开设置页";
}
$("backBtn").addEventListener("click", () => {
  let hasOpener = false;
  let hasParent = false;
  try { hasOpener = Boolean(window.opener && window.opener !== window); } catch (e) {}
  try { hasParent = Boolean(window.parent && window.parent !== window); } catch (e) {}
  const act = L.panelBackAction(hasOpener, hasParent, window.history.length, backDepth);
  if (act.mode === "close") { try { window.close(); } catch (e) {} return; }
  if (act.mode === "notify-host") {
    try { window.parent.postMessage({ type: "dsh-keepsake:panel-close" }, "*"); } catch (e) {}
    return;
  }
  if (act.mode === "back") { window.history.go(-act.steps); return; }
  window.location.href = "/";
});

// ============ 基础 helper ============
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
/** 把响应体挂到 Error 上（半完成态端点用：archived/skipped/snapshotDir 要能被界面消费）。 */
function withDetails(err, body) {
  if (body && typeof body === "object") err.details = body;
  return err;
}
async function api(path, options) {
  const res = await fetch("/dsh-keepsake/api/" + path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    // 优先后端补的中文 message，回落到错误码 body.error（旧宿主只有 error）。
    // 半完成态端点（如归档审计失败）会把 archived/skipped/snapshotDir 一起回传到
    // err.details——调用方（归档流程）据此展示「哪几条没动、快照在哪」。
    throw withDetails(new Error(body.message || body.error || "HTTP " + res.status), body);
  }
  return body;
}
const apiPut = (path, obj) => api(path, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(obj) });
const apiPost = (path, obj) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(obj ?? {}) });
const apiDel = (path, obj) => api(path, { method: "DELETE", headers: { "content-type": "application/json" }, body: JSON.stringify(obj) });
const ENTRY_MAX_CHARS = 20000; // 与服务端 content 上限对齐——客户端拒绝而非静默截断
const ADDRESS_SAVE_DEBOUNCE_MS = 600; // 与 lib/client.js 同名常量一致（防漂移检查钉住）

const RECENT_ERRORS_MAX = 5; // 最近错误回看区保留条数
const recentErrors = []; // 最近错误（新在前），仅内存态
let toastTimer = null;
function renderRecentErrors() {
  const box = $("recentErrors");
  if (!box) return;
  if (recentErrors.length === 0) { box.hidden = true; return; }
  box.hidden = false;
  box.querySelector("[data-errList]").innerHTML = recentErrors
    .map((it) => `<div class="errItem"><span class="meta">${esc(it.at)}</span> ${esc(it.text)}</div>`)
    .join("");
}
function toast(text, kind = "ok") {
  const el = $("toast");
  const isErr = kind === "err";
  el.className = "notice show " + kind;
  // 无障碍角色分流：错误类 role=alert（读屏立即抢念， assertive 由下方 aria-live 保持），
  // 成功回落 role=status——两者互斥，不得同时挂着（同一节点两个 role 语义互相抵消）
  el.setAttribute("role", isErr ? "alert" : "status");
  // 错误类：写进「最近错误」回看区（时间取本地时刻），并延长提示条停留时间（8 秒）
  if (isErr) {
    recentErrors.unshift({ text, at: new Date().toLocaleTimeString("zh-CN", { hour12: false }) });
    if (recentErrors.length > RECENT_ERRORS_MAX) recentErrors.length = RECENT_ERRORS_MAX;
    renderRecentErrors();
  }
  el.setAttribute("aria-live", isErr ? "assertive" : "polite");
  el.textContent = text;
  // 关闭按钮（手动收起）——错误与成功都给，用户随时能清掉
  const close = document.createElement("button");
  close.className = "btn sm toastClose";
  close.type = "button";
  close.setAttribute("aria-label", "关闭提示");
  close.textContent = "关闭";
  close.addEventListener("click", () => { if (toastTimer) clearTimeout(toastTimer); el.className = "notice"; });
  el.appendChild(close);
  if (toastTimer) clearTimeout(toastTimer);
  // 成功类短时自动消失；错误类延长至 8 秒（读得完），且已进「最近错误」回看区兜底
  toastTimer = setTimeout(() => { el.className = "notice"; }, isErr ? 8000 : 3200);
}
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 迷你 markdown 渲染（人设预览用：标题/粗体/行内码/列表/段落）
function mdRender(text) {
  const lines = String(text ?? "").split("\n");
  let html = "";
  let inList = false;
  const inline = (s) => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  for (const line of lines) {
    const t = line.trimEnd();
    let m;
    if ((m = t.match(/^###\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = t.match(/^##\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h2>${inline(m[1])}</h2>`; }
    else if ((m = t.match(/^#\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h1>${inline(m[1])}</h1>`; }
    else if ((m = t.match(/^[-*]\s+(.*)$/))) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(m[1])}</li>`; }
    else if (t.trim() === "") { if (inList) { html += "</ul>"; inList = false; } }
    else { if (inList) { html += "</ul>"; inList = false; } html += `<p>${inline(t)}</p>`; }
  }
  if (inList) html += "</ul>";
  return html;
}

// ============ 确认弹窗（栈式：确认层不再覆写下层对话框——源码模式取消不丢编辑） ============
// 焦点陷阱走 L.trapFocus（四处弹窗复用的单一实现：Tab 循环 + 首尾回卷 + Esc 关闭），
// 关闭时必须调 off()——监听挂在 document 上，不摘会泄漏到背景页拦用户的键。
function confirmDialog({ title, body, dangerText = "确认", onConfirm }) {
  const layer = document.createElement("div"); // 独立层 append：下层对话框 DOM 原样保留
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(440px,92vw)">
        <h2>${esc(title)}</h2>
        <div style="font-size:13px;white-space:pre-wrap">${body}</div>
        <div class="foot">
          <button class="btn" data-x>取消</button>
          <button class="btn danger" data-ok>${esc(dangerText)}</button>
        </div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const close = () => { // 只摘本层，下层（若有）恢复可见、编辑内容无损
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); }; // Esc = 取消（键盘可达）
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close); // Tab 回卷 + Esc（trapFocus 自带 Esc，onKey 兼容旧路径）
  const cancelBtn = layer.querySelector("[data-x]");
  cancelBtn.addEventListener("click", close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => { if (e.target.classList.contains("mask")) close(); });
  layer.querySelector("[data-ok]").addEventListener("click", async () => {
    close();
    await onConfirm();
  });
  cancelBtn.focus(); // 打开即聚焦首个按钮（键盘/读屏可达）
}

// ============ 知识页弹窗（项目记忆派生视图；手动生成，不自动烧 token） ============
// 页面正文全部走 esc()；生成一次 = 一次 LLM 调用，按钮 busy 防连点。
function openPagesDialog(projectId) {
  const layer = document.createElement("div");
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(900px,96vw);max-height:${DIALOG_CAP_PAGES};display:flex;flex-direction:column">
        <h2>知识页 · <code class="k">${esc(projectId)}</code></h2>
        <div class="meta" data-status>加载中…</div>
        <div data-body style="overflow:auto;flex:1;min-height:220px;padding:4px 2px"></div>
        <div class="foot">
          <button class="btn" data-x>关闭</button>
          <button class="btn" data-gen>生成知识页</button>
        </div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const bodyEl = layer.querySelector("[data-body]");
  const statusEl = layer.querySelector("[data-status]");
  const genBtn = layer.querySelector("[data-gen]");
  let current = null;
  const close = () => {
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close);
  layer.querySelector("[data-x]").addEventListener("click", close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => { if (e.target.classList.contains("mask")) close(); });

  const renderPages = (data) => {
    current = data;
    if (data === null || data.available !== true || !Array.isArray(data.pages) || data.pages.length === 0) {
      statusEl.textContent = "还没有知识页";
      bodyEl.innerHTML = '<div class="empty">还没有知识页。生成一次会把现有项目记忆合成 5 页：组件地图 / 核心概念 / 约定与模式 / 关键决策 / 进行中事项。页面是派生视图，真源仍是条目文件。</div>';
      genBtn.textContent = "生成知识页";
      return;
    }
    const when = data.generatedAt ? fmtTime(new Date(data.generatedAt).getTime()) : "时间未知";
    statusEl.textContent = `已生成 ${data.pages.length} 页 · ${when}${data.model ? ` · ${data.model}` : ""}`;
    bodyEl.innerHTML = '<div class="meta" style="margin-bottom:8px">派生视图：每轮注入只带标题 + 摘要，全文在页面文件里；记忆条目仍是真源。</div>'
      + data.pages.map((page) => `
        <div class="card"><h3>${esc(page.title)}</h3>
        ${page.summary ? `<div class="meta">${esc(page.summary)}</div>` : ""}
        <div class="entry-body" style="max-height:260px;overflow:auto">${esc(page.content ?? "")}</div></div>`).join("");
    genBtn.textContent = "重新生成知识页";
  };

  const load = async () => {
    statusEl.textContent = "加载中…";
    try {
      renderPages(await api(`pages/read?projectId=${encodeURIComponent(projectId)}`));
    } catch (err) {
      statusEl.textContent = "加载失败：" + err.message;
      bodyEl.innerHTML = "";
    }
  };

  genBtn.addEventListener("click", async () => {
    if (genBtn.disabled) return;
    genBtn.disabled = true;
    genBtn.textContent = "生成中…（一次 LLM 调用）";
    statusEl.textContent = "生成中…（一次 LLM 调用，可能需要几十秒）";
    try {
      const out = await apiPost("pages/generate", { projectId });
      toast(`已生成 ${out.manifest?.pages?.length ?? 5} 页`);
      await load();
    } catch (err) {
      statusEl.textContent = "生成失败：" + err.message;
      toast("知识页生成失败：" + err.message, "err");
    } finally {
      genBtn.disabled = false;
      if (current === null || current.available !== true) genBtn.textContent = "生成知识页";
      else genBtn.textContent = "重新生成知识页";
    }
  });

  load();
  layer.querySelector("[data-x]").focus();
}

// ============ 条目编辑卡片（分类页/长期页共用） ============
function entryCard(cat, e, reload, keepDays) {
  const card = document.createElement("div");
  card.className = "card";
  const expireDays = L.recentExpireDays(e.timestamp, keepDays);
  const ageBadge = cat === "recent-activity"
    ? `<span class="badge">${esc(L.recentAgeOf(e.timestamp).text)}${expireDays === null ? "" : ` · ${expireDays} 天后过期`}</span> `
    : "";
  card.innerHTML = `
    <h3>${ageBadge}<span>${esc(e.title)}</span>
      <span class="ops">
        <button class="btn sm" data-edit>编辑</button>
        <button class="btn sm danger" data-del>删除</button>
      </span>
    </h3>
    ${e.description ? `<div class="meta">${esc(e.description)}</div>` : ""}
    <div class="meta">${esc(e.name)} · <span title="${esc(fmtTime(e.mtimeMs))}">${esc(L.relativeTimeOf(e.mtimeMs))}</span></div>
    <div class="entry-body">${esc(e.content)}</div>`;
  card.querySelector("[data-del]").addEventListener("click", () => {
    confirmDialog({
      title: "删除条目",
      body: `确定删除「${esc(e.title)}」吗？将移入回收站（可在回收站找回，保留天数见设置页保留策略）。`,
      dangerText: "移入回收站",
      onConfirm: async () => {
        try {
          // 三态判读走纯函数（deleteOutcomeOf）：不存在 / 已移入回收站 / 删除失败互不混同。
          // 关键：失败态**不**刷新列表——原件还在盘上，抹掉就是静默消失（比报错更糟）。
          const out = await apiDel("entry", { category: cat, name: e.name });
          const outcome = L.deleteOutcomeOf(out);
          toast(outcome.toast, outcome.kind === "failed" ? "err" : "ok");
          if (outcome.reload) reload();
        } catch (err) { toast("删除失败：" + err.message, "err"); }
      },
    });
  });
  card.querySelector("[data-edit]").addEventListener("click", () => {
    card.innerHTML = `
      <div class="field"><label>标题（60 字内） <span class="meta" data-tcnt></span></label><input class="inp" data-t maxlength="60" value="${esc(e.title)}"></div>
      <div class="field"><label>描述（一行钩子，可选，60 字内） <span class="meta" data-dcnt></span></label><input class="inp" data-d maxlength="60" value="${esc(e.description)}"></div>
      <div class="field"><label>正文（${ENTRY_MAX_CHARS} 字符上限）</label><textarea class="ta" data-c maxlength="${ENTRY_MAX_CHARS}"></textarea><div class="meta" data-cnt></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn sm" data-x>取消</button>
        <button class="btn sm primary" data-s>保存</button>
      </div>`;
    // maxlength 不拦脚本/存量数据，value 先行赋值再挂计数（存量超长立即可见）
    const $c = card.querySelector("[data-c]");
    const $cnt = card.querySelector("[data-cnt]");
    const $t = card.querySelector("[data-t]");
    const $d = card.querySelector("[data-d]");
    $c.value = e.content;
    const updCnt = () => {
      const over = $c.value.length > ENTRY_MAX_CHARS;
      $cnt.textContent = `${$c.value.length} / ${ENTRY_MAX_CHARS} 字符 · UTF-8 ${L.utf8Length($c.value)} 字节` + (over ? "（已超限，保存将被阻止）" : "");
    };
    // 标题/描述 60 字实时计数（maxlength 到了就截，用户看得见还剩多少）
    const updTitleCnt = () => { card.querySelector("[data-tcnt]").textContent = `${$t.value.length} / 60`; };
    const updDescCnt = () => { card.querySelector("[data-dcnt]").textContent = `${$d.value.length} / 60`; };
    updCnt(); updTitleCnt(); updDescCnt();
    $c.addEventListener("input", updCnt);
    $t.addEventListener("input", updTitleCnt);
    $d.addEventListener("input", updDescCnt);
    card.querySelector("[data-x]").addEventListener("click", reload);
    card.querySelector("[data-s]").addEventListener("click", async () => {
      const v = L.validateEntryDraft($t.value, $c.value); // 必填/字符/字节三道门
      if (!v.ok) { toast(v.error, "err"); return; }
      try {
        await apiPut("entry", {
          category: cat,
          name: e.name,
          title: $t.value,
          description: $d.value,
          content: $c.value,
        });
        toast("已保存");
        reload();
      } catch (err) { toast("保存失败：" + err.message, "err"); }
    });
  });
  return card;
}

function importDialog(cat, reload) {

  const $preview = dialogHost.querySelector("[data-previewHost]");
  const $fmtHint = dialogHost.querySelector("[data-fmtHint]");
  let fmtTouched = false; // 用户手选过格式后，选文件不再覆盖手选
  const clearPreview = () => { $preview.innerHTML = ""; $confirm.style.display = "none"; };
  // 格式说明随选择变化（死元素修复：让人看清每种格式会把内容怎么拆条）
  const FMT_HINTS = {
    "json": "结构：{\"entries\":[{\"title\":\"…\",\"content\":\"…\"}]}，逐条写入。",
    "markdown-split": "按 ## 标题拆成多条，每段成为一条记忆。",
    "markdown-whole": "整篇作为一条记忆写入（不拆分）。",
  };
  const updFmtHint = () => { $fmtHint.textContent = FMT_HINTS[$fmt.value] ?? ""; };
  updFmtHint();

      toast("文件超过 2MB 上限，请精简后重试（或直接把内容粘贴到下方）", "err");
      ev.target.value = "";

    reader.onerror = () => toast("文件读取失败，请重试或直接粘贴内容", "err"); // 读取错误可见
    reader.onload = () => {

  $text.addEventListener("input", clearPreview);

  $dry.addEventListener("click", async () => {
    const req = L.buildImportRequest(cat, $fmt.value, $text.value, L.importTitleOf($fmt.value, $text.value)); // markdown 标题随行
    if (!req.ok) { toast(req.error, "err"); return; }
    try {
      const out = await apiPost("import?dryRun=1", req.body);
      const rows = L.previewRowsOf(out.plans);

      $preview.innerHTML = `
        <div class="meta" style="margin:8px 0">③ 将要写入 ${rows.length} 条（<b style="color:var(--fb-danger)">${rows.filter((r) => r.danger).length} 条与现有内容冲突或批内改名</b>）：</div>
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:90px">动作</th><th>标题</th><th>文件</th><th style="width:40%">内容预览</th></tr>
          ${rows.map((r) => `<tr class="${r.danger ? "danger" : ""}"><td>${r.action === "rename" ? "改名" : r.danger ? "覆盖" : "新增"}</td><td>${esc(r.title)}</td><td class="meta">${esc(r.name)}</td><td class="meta">${esc(r.preview)}</td></tr>`).join("")}
        </table></div>
        ${(out.errors ?? []).length > 0 ? `<div class="notice show err" style="margin:8px 0">${(out.errors ?? []).map(esc).join("<br>")}</div>` : ""}
        ${(out.notes ?? []).length > 0 ? `<div class="meta" style="margin:8px 0">${(out.notes ?? []).map(esc).join("<br>")}</div>` : ""}`;
      $confirm.style.display = "";
    } catch (err) { toast("预览失败：" + err.message, "err"); }
  });
  $confirm.addEventListener("click", async () => {
    const req = L.buildImportRequest(cat, $fmt.value, $text.value, L.importTitleOf($fmt.value, $text.value));
    if (!req.ok) { toast(req.error, "err"); return; }
    try {
      const out = await apiPost("import", req.body);
      offFocus();
      dialogHost.innerHTML = "";
      // 修复：HTTP 200 + ok:false（部分条目失败）也要可见，不静默报成功
      if (out.ok === false) {
        toast(`导入部分失败：写入 ${out.written} 条，失败 ${out.failed.length} 条（${out.failed.join("、")}）；已自动备份 ${out.backupId}`, "err");
      } else {
        // merged 为导入重名合并修复的新计数口径——tolerant 消费（旧版无此字段显示 0）
        toast(`导入完成：写入 ${out.written} 条（覆盖 ${out.overwritten ?? 0} 条，合并 ${out.merged ?? 0} 条，已自动备份 ${out.backupId}）`);
      }
      reload();
    } catch (err) { toast("导入失败：" + err.message, "err"); }
  });
}

// ============ 页面渲染序号（快速切路由时旧响应不得写入新页） ============
let pageRenderSeq = 0;

// 近期动态保留天数：面板展示「N 天后过期」用。tolerant——新旧字段位置都认，
// 缺失/非法 → undefined（L.recentExpireDays 自行落默认 30）。
function recentKeepDaysOf(st) {
  const s = st && typeof st === "object" ? st : {};
  const nested = s.settings && typeof s.settings === "object" ? s.settings.recentKeepDays : undefined;
  const raw = nested !== undefined ? nested : s.recentKeepDays;
  const n = Number(raw);
  return Number.isFinite(n) && n > 0 ? n : undefined;
}

// ============ 页面：四分类 / 长期记忆 ============
// 列表分页（pageSize 50）：翻页保留检索词与页码；pageRenderSeq 竞态守卫沿用
// （旧渲染响应不得写入新页——翻页是异步渲染，连点「下一页」时靠它兜底）。
const PAGE_SIZE = L.PAGE_SIZE;

/** 分页底栏（上一页/下一页 · 第 N/M 页 · 共 X 条）。 */
function pagerHtml(pg) {
  if (pg.pageCount <= 1) return ""; // 一页以内不渲染底栏（不摆死键）
  return `
    <div class="toolbar" data-pager style="margin-top:10px;margin-bottom:0">
      <button class="btn" data-prev ${pg.hasPrev ? "" : "disabled"}>上一页</button>
      <button class="btn" data-next ${pg.hasNext ? "" : "disabled"}>下一页</button>
      <span class="meta" data-pagerText>${L.paginationText(pg)}</span>
    </div>`;
}
async function renderCategoryPage(cat, title, query = "", pageIndex = 0) {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = title;
  pageSub.textContent = cat === "recent-activity" ? "自动滚动清理（默认保留 30 条 / 30 天，可在设置页调整）" : "";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let data;
  try {
    data = await api("category/" + cat);
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  // 近期动态页顺路取一次保留天数（过期文案按真实配置显示）；其它分类跳过，不白拉
  let keepDays;
  if (cat === "recent-activity") {
    try { keepDays = recentKeepDaysOf(await api("state")); } catch { /* 取不到走默认 30 天 */ }
  }
  if (seq !== pageRenderSeq) return; // 旧渲染丢弃：用户已切到别的路由
  const all = data.entries ?? [];
  let current = query;
  let currentPage = pageIndex;
  // reload 后保留检索词与页码（翻页不丢上下文）
  const reload = () => { renderCategoryPage(cat, title, current, currentPage); refreshCounts(); };
  page.innerHTML = `
    <div class="toolbar">
      <input class="inp search" data-q placeholder="检索：标题 / 描述 / 正文即时过滤">
      <button class="btn danger" data-reset>重置</button>
      <button class="btn" data-source>源码模式</button>
      <button class="btn" data-import>导入</button>
      <span class="spacer"></span>
      <button class="btn primary" data-new>＋ 新增条目</button>
    </div>
    <div data-list></div>
    <div data-pagerHost></div>`;
  const list = page.querySelector("[data-list]");
  const pagerHost = page.querySelector("[data-pagerHost]");
  const $q = page.querySelector("[data-q]");
  $q.value = query;
  // 空态拆两态——库空（引导语）vs 搜索无命中（回显 query，区别于库空）
  const renderList = (entries, q = "") => {
    list.innerHTML = "";
    if (entries.length === 0) {
      list.innerHTML = all.length === 0
        ? '<div class="empty">暂无条目。对话中聊到相关信息后，DSH 会自动归类到这里；也可以手动新增或导入。</div>'
        : `<div class="empty">没有匹配「${esc(q)}」的条目——换个关键词，或清空检索框查看全部 ${all.length} 条。</div>`;
      pagerHost.innerHTML = "";
      return;
    }
    // 分页：检索变化时页码回落第 1 页（旧页号对着新过滤结果可能越界）
    const pg = L.paginateOf(entries.length, currentPage);
    currentPage = pg.page;
    const slice = entries.slice(pg.start, pg.end);
    for (const e of slice) list.appendChild(entryCard(cat, e, reload, keepDays));
    pagerHost.innerHTML = pagerHtml(pg);
    const prev = pagerHost.querySelector("[data-prev]");
    const next = pagerHost.querySelector("[data-next]");
    if (prev) prev.addEventListener("click", () => { currentPage = pg.page - 1; renderList(entries, q); });
    if (next) next.addEventListener("click", () => { currentPage = pg.page + 1; renderList(entries, q); });
  };
  renderList(L.filterEntries(all, query), query);
  $q.addEventListener("input", (ev) => { current = ev.target.value; currentPage = 0; renderList(L.filterEntries(all, ev.target.value), ev.target.value); });
  page.querySelector("[data-new]").addEventListener("click", () => newEntryDialog(cat, reload));
  page.querySelector("[data-import]").addEventListener("click", () => importDialog(cat, reload));
  // 源码模式改的是整类（不随检索框过滤）——恒用全量，避免只写回命中的那几条
  page.querySelector("[data-source]").addEventListener("click", () => sourceModeDialog(cat, all, reload));
  page.querySelector("[data-reset]").addEventListener("click", () => {
    confirmDialog({
      title: `重置「${title}」`,
      body: `将清空该分类全部 ${all.length} 条。\n清空前系统会自动把当前内容存一份备份（可在「设置」页恢复）。`,
      dangerText: "备份并清空",
      onConfirm: async () => {
        try {
          const out = await apiPost(`category/${cat}/reset`);
          toast(`已清空（${out.removed} 条，备份 ${out.backupId}）`);
          reload();
        } catch (err) { toast("重置失败：" + err.message, "err"); }
      },
    });
  });
}

// ============ 页面：长期记忆（检索增强 + 分页） ============
async function renderLongTermPage(query = "", pageIndex = 0) {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "长期记忆";

  page.innerHTML = '<div class="empty">加载中…</div>';
  let data;
  try {

    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;

  const all = data.entries ?? [];
  let current = query;
  let currentPage = pageIndex;

  page.innerHTML = `
    <div class="toolbar">

    if (entries.length === 0) {

        : `<div class="empty">没有匹配「${esc(q)}」的条目——换个关键词，或清空检索框查看全部 ${all.length} 条。</div>`;
      pagerHost.innerHTML = "";
      return;
    }
    const pg = L.paginateOf(entries.length, currentPage);
    currentPage = pg.page;
    for (const e of entries.slice(pg.start, pg.end)) list.appendChild(entryCard("long-term", e, reload));
    pagerHost.innerHTML = pagerHtml(pg);
    const prev = pagerHost.querySelector("[data-prev]");
    const next = pagerHost.querySelector("[data-next]");
    if (prev) prev.addEventListener("click", () => { currentPage = pg.page - 1; renderList(entries, q); });
    if (next) next.addEventListener("click", () => { currentPage = pg.page + 1; renderList(entries, q); });
  };
  renderList(L.filterEntries(all, query), query);
  $q.addEventListener("input", (ev) => { current = ev.target.value; currentPage = 0; renderList(L.filterEntries(all, ev.target.value), ev.target.value); });
  page.querySelector("[data-new]").addEventListener("click", () => newEntryDialog("long-term", reload));
  page.querySelector("[data-import]").addEventListener("click", () => importDialog("long-term", reload));
  page.querySelector("[data-source]").addEventListener("click", () => sourceModeDialog("long-term", all, reload));
  page.querySelector("[data-reset]").addEventListener("click", () => {
    confirmDialog({
      title: "重置「长期记忆」",
      body: `将清空全部 ${all.length} 条。\n清空前系统会自动备份（可在「设置」页恢复）。`,
      dangerText: "备份并清空",
      onConfirm: async () => {
        try {
          const out = await apiPost("category/long-term/reset");
          toast(`已清空（${out.removed} 条，备份 ${out.backupId}）`);
          reload();
        } catch (err) { toast("重置失败：" + err.message, "err"); }
      },
    });
  });
}

// ============ 页面：运行时记忆（RUNTIME-FORMAT §十二 UX 约定） ============
// 端点：GET runtime/<scope> / POST runtime/<scope>/compile / POST runtime/<scope>/evict /
//       POST runtime/<scope>/pin / POST runtime/global/archive/restore（+ POST runtime/compile-all）。
// 分工：一切展示判定走 panel-logic 纯函数（用量/状态徽标/候选行/diff 摘要/skip 明细/移回行），
//   本函数只拉取、渲染、接线；破坏/搬动操作（归档、移回、解 pin）一律先确认弹窗。
let runtimeScope = "global"; // 当前选中 scope（页内重渲染保留选择）
let runtimeSkippedNotice = null; // 上次归档的 skipped 明细 {scope, rows}（限定 scope 展示，不跨 scope 误串）
let runtimeCompileResult = null; // 上次「重新编译」diff 摘要（限定 scope 展示，不跨 scope 误串）
let runtimeBadgeCount = null; // aside 徽标口径：候选数（null=本次会话还没拉过，不显示）
let runtimeEnabledLocal = null; // 本会话 PUT runtimeEnabled 成功后的回填（/state 未带该字段时的兜底）
let runtimeGuideSeen = false; // 引导句是否已展示过（§十二：首次打开且开关关 → 内联引导；此后只留一行提示）

async function renderRuntimePage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "运行时记忆";
  pageSub.textContent = "每轮注入的紧凑记忆层（USER.md / MEMORY.md 编译产物）；产物非真源，可随时重建";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let st;
  try {
    st = await api("state");
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  const enabled = L.runtimeEnabledOf(st?.settings, runtimeEnabledLocal);
  const opts = L.runtimeScopeOptions(st.projects);
  // 选中 scope 已消失（项目被清掉/切换后残留）→ 先回落全局再拉产物（不拿必 404 的 scope 打空转）
  if (!opts.some((o) => o.scope === runtimeScope)) runtimeScope = L.RUNTIME_GLOBAL_SCOPE;
  // 产物读取：404（尚未编译/未失效重建）与真错误都如实显示服务端 message，不冒充成功。
  // 「未编译过」是正常初态而非故障：单独给一句人话引导，别把 code 式 message 直接拼在
  // 「未能读取产物：」后面（那会读成「未能读取产物：无编译产物」，绕且像是出错）。
  let data = null;
  let loadError = "";
  let notCompiledYet = false;
  try {
    data = await api("runtime/" + runtimeScope);
  } catch (err) {
    loadError = err.message;
    notCompiledYet = err.code === "E_NO_ARTIFACTS" || /无编译产物/.test(String(err.message ?? ""));
  }
  if (seq !== pageRenderSeq) return;
  const badge = L.runtimeStatusBadge(data ? data.status : null);
  const userUsage = L.runtimeUsageOf(data?.user);
  const memUsage = L.runtimeUsageOf(data?.memory);
  const candRows = L.runtimeCandidateRows(data?.evictCandidates);
  runtimeBadgeCount = candRows.length;
  const badgeEl = document.querySelector('[data-cnt="runtime"]');
  if (badgeEl) badgeEl.textContent = candRows.length > 0 ? String(candRows.length) : "";
  // pin 清单：产物行反推（产物只渲染入选条目，故这里恰是「可 pin 的条目全集」；
  // 被淘汰的条目不可能是关键标记——pinned 永不参与淘汰，语义自洽）
  const pinRows = data
    ? [
      ...L.runtimeArtifactRows(data.user?.text, runtimeScope).map((r) => ({ ...r, artifact: "USER.md" })),
      ...L.runtimeArtifactRows(data.memory?.text, runtimeScope).map((r) => ({ ...r, artifact: "MEMORY.md" })),
    ]
    : [];
  const compiledText = data && data.compiledAt
    ? `编译于 <span title="${esc(data.compiledAt)}">${esc(L.relativeTimeOf(data.compiledAt))}</span> · sourceHash ${esc(String(data.sourceHash ?? "").slice(0, 12))}`
    : "尚无编译清单";
  // 跨 scope 不误串：归档明细 / 重编摘要只在各自的 scope 下展示（切 scope 后旧结果不冒充新 scope 的）
  const skippedRows = runtimeSkippedNotice && runtimeSkippedNotice.scope === runtimeScope ? runtimeSkippedNotice.rows : null;
  const compileResultText = runtimeCompileResult && runtimeCompileResult.scope === runtimeScope ? runtimeCompileResult.text : "";
  // §十二：首次打开该页签且开关关闭 → 内联引导（非打断式弹窗；此后降为一行 meta 提示，不反复占屏）
  const guideFirstTime = !enabled && !runtimeGuideSeen;
  runtimeGuideSeen = true;
  const guideHtml = enabled
    ? ""
    : guideFirstTime
      ? `<div class="notice show" style="margin:0 0 10px">${esc(L.RUNTIME_GUIDE_TEXT)}——可在「设置」页开关区开启。</div>`
      : `<div class="meta" style="margin:0 0 10px">运行时记忆当前关闭（${esc(L.RUNTIME_GUIDE_TEXT)}）——「设置」页开关区可开启。</div>`;
  const checked = new Set(); // 候选勾选态（页内状态，重渲染即重置）
  page.innerHTML = `
    ${guideHtml}
    <div class="toolbar">
      <span class="meta">存储范围</span>
      <span class="presetRow" style="margin:0" data-scopes>
        ${opts.map((o) => `<button class="pill${o.scope === runtimeScope ? " on" : ""}" data-scope="${esc(o.scope)}">${esc(o.label)}${o.entries === null ? "" : ` <span class="meta">${o.entries}</span>`}</button>`).join("")}
      </span>
      <span class="spacer"></span>
      <button class="btn sm" data-compileAll title="对全部 scope 强制重编">全部 scope 重编</button>
      <button class="btn primary" data-compile>重新编译</button>
    </div>
    <div class="card"><h3>
        <span class="dot ${badge.level}" role="img" aria-label="状态：${esc(badge.word)}"></span><span class="statusWord ${badge.level}">${esc(badge.word)}</span>编译状态
        <span class="badge">淘汰候选 ${candRows.length}</span>
        <span class="meta" style="font-weight:400">${compiledText}</span>
      </h3>
      ${badge.hint ? `<div class="notice show${badge.level === "red" ? " err" : ""}" style="margin:6px 0 0">${esc(badge.hint)}</div>` : ""}
      <div class="kv"><b>USER.md 用量</b><span class="bar${userUsage.over ? " over" : ""}"><i style="width:${userUsage.barPct}%"></i></span><span class="meta">${esc(userUsage.text)}</span></div>
      <div class="kv"><b>MEMORY.md 用量</b><span class="bar${memUsage.over ? " over" : ""}"><i style="width:${memUsage.barPct}%"></i></span><span class="meta">${esc(memUsage.text)}</span></div>
      ${compileResultText ? `<div class="meta" data-compileResult style="margin-top:6px">${esc(compileResultText)}</div>` : ""}
      <div class="meta">开关只控制自动编译与注入；这里的手动重编随时可用（产物仅供查看/整理，真源永远是条目文件）。</div>
    </div>
    ${data ? `
    <div class="split">
      <div class="card"><h3>USER.md <span class="badge">只读</span></h3>
        <div class="meta">${esc(L.RUNTIME_READONLY_NOTE)}</div>
        <pre class="codeBox">${esc(data.user?.text ?? "")}</pre></div>
      <div class="card"><h3>MEMORY.md <span class="badge">只读</span></h3>
        <div class="meta">${esc(L.RUNTIME_READONLY_NOTE)}</div>
        <pre class="codeBox">${esc(data.memory?.text ?? "")}</pre></div>
    </div>` : `<div class="card"><h3>编译产物</h3><div class="empty">${notCompiledYet
      ? "该范围尚未编译——点上方「重新编译」立即生成（不开运行时记忆层也不影响：注入前会懒触发编译）"
      : `未能读取产物：${esc(loadError || "未知错误")}`}</div>
      <div class="meta">${notCompiledYet ? "" : "点上方「重新编译」可再试一次；若持续失败，请查看服务端日志。"}</div></div>`}
    <div class="card" data-pinCard></div>
    <div class="card" data-candCard></div>
    <div data-restoreHost></div>`;

  // ---- scope 切换（保留页内其它状态：切换本身重渲染，选择由 runtimeScope 带走） ----
  for (const btn of Array.from(page.querySelectorAll("[data-scope]"))) {
    btn.addEventListener("click", () => {
      const next = btn.getAttribute("data-scope");
      if (!next || next === runtimeScope) return;
      runtimeScope = next;
      renderRuntimePage();
    });
  }

  // ---- 重新编译（§八：返回 diff 摘要）----
  const compileBtn = page.querySelector("[data-compile]");
  compileBtn.addEventListener("click", async () => {
    const before = data; // 竞争前快照：摘要「字节变化」的前值（缺失=没有前值，只报现值）
    compileBtn.disabled = true; compileBtn.textContent = "编译中…"; // 三段式 busy
    try {
      const out = await apiPost(`runtime/${runtimeScope}/compile`);
      const text = L.runtimeCompileSummaryText(out, before);
      runtimeCompileResult = { scope: runtimeScope, text };
      toast(text);
      renderRuntimePage();
    } catch (err) {
      toast("重新编译失败：" + err.message, "err");
      compileBtn.disabled = false; compileBtn.textContent = "重新编译";
    }
  });
  const compileAllBtn = page.querySelector("[data-compileAll]");
  compileAllBtn.addEventListener("click", async () => {
    compileAllBtn.disabled = true; compileAllBtn.textContent = "编译中…";
    try {
      const out = await apiPost("runtime/compile-all");
      const scopes = Array.isArray(out?.scopes) ? out.scopes : [];
      const failed = scopes.filter((s) => s && s.ok === false);
      const text = failed.length === 0
        ? `全部 scope 重编完成（${scopes.length} 个）`
        : `全部 scope 重编：${scopes.length} 个，失败 ${failed.length} 个（${failed.map((s) => L.runtimeScopeLabel(s.scope)).join("、")}）`;
      toast(text, failed.length > 0 ? "err" : "ok");
      renderRuntimePage();
    } catch (err) {
      toast("全部重编失败：" + err.message, "err");
      compileAllBtn.disabled = false; compileAllBtn.textContent = "全部 scope 重编";
    }
  });

  // ---- 条目与关键标记（pin）：只对能定位到真源的产物行开放 ----
  const pinCard = page.querySelector("[data-pinCard]");
  if (pinRows.length === 0) {
    pinCard.innerHTML = "<h3>条目与关键标记（pin）</h3><div class=\"meta\">产物里暂无条目（或尚未编译）。关键标记的条目永不淘汰，始终优先入选。</div>";
  } else {
    pinCard.innerHTML = `
      <h3>条目与关键标记（pin）<span class="meta" style="font-weight:400">关键条目永不淘汰、始终优先入选</span></h3>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:96px">产物</th><th>条目</th><th style="width:96px">标记</th><th style="width:110px"></th></tr>
        ${pinRows.map((r, i) => {
          const target = L.runtimePinTarget(r, runtimeScope);
          const label = r.pinned ? '<span class="badge warn">关键</span>' : '<span class="badge">普通</span>';
          const btn = target.ok
            ? `<button class="btn sm" data-pin="${i}">${r.pinned ? "取消关键标记" : "标为关键"}</button>`
            : `<span class="meta" title="${esc(target.reason)}">不可在此切换</span>`;
          return `<tr><td class="meta">${esc(r.artifact)}</td><td>${esc(r.title)}${r.hook ? `<div class="meta">${esc(r.hook)}</div>` : ""}<div class="meta"><code class="k">${esc(r.file ?? "—")}</code></div></td><td>${label}</td><td>${btn}</td></tr>`;
        }).join("")}
      </table></div>`;
    for (const btn of Array.from(pinCard.querySelectorAll("[data-pin]"))) {
      btn.addEventListener("click", () => {
        const row = pinRows[Number(btn.getAttribute("data-pin"))];
        const target = L.runtimePinTarget(row, runtimeScope);
        if (!target.ok) { toast(target.reason, "err"); return; }
        const nextPinned = !row.pinned;
        const submit = async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            await apiPost(`runtime/${runtimeScope}/pin`, { rootKey: target.rootKey, file: target.file, pinned: nextPinned });
            toast(nextPinned ? "已标为关键（下次编译起始终优先入选）" : "已取消关键标记");
            renderRuntimePage(); // 服务端已重编：重拉即见新产物与新候选清单
          } catch (err) {
            toast("关键标记保存失败：" + err.message, "err");
            btn.disabled = false; btn.textContent = nextPinned ? "标为关键" : "取消关键标记";
          }
        };
        if (nextPinned) { submit(); return; } // 加 pin 无风险，不打断
        // 解 pin 是「可能被淘汰」的前置动作：预警文案固定口径（RUNTIME_UNPIN_WARNING），不静默
        confirmDialog({
          title: "取消关键标记",
          body: `${esc(L.RUNTIME_UNPIN_WARNING)}\n\n条目：${esc(row.title)}`,
          dangerText: "取消关键标记",
          onConfirm: submit,
        });
      });
    }
  }

  // ---- 淘汰候选（勾选 + 执行归档；§十二：点击后先刷新清单再提交） ----
  const candCard = page.querySelector("[data-candCard]");
  const skippedHtml = skippedRows && skippedRows.length > 0
    ? `<div class="notice show err" style="margin:6px 0 0">上次归档有 ${skippedRows.length} 条未搬动：${skippedRows.map((r) => esc(`${r.file}（${r.text}）`)).join("；")}</div>`
    : "";
  candCard.innerHTML = `
    <h3>淘汰候选 <span class="badge">${candRows.length}</span>
      <span class="ops"><button class="btn sm danger" data-evict>执行归档</button></span>
    </h3>
    <div class="meta">编译时登记「装不进配额」的条目（只登记，不搬动）。执行归档 = 搬进 long-term 归档区并留手术式快照，<b>不是删除</b>，可从这里移回。</div>
    ${skippedHtml}
    ${candRows.length === 0 ? '<div class="meta">当前没有淘汰候选——配额装得下全部候选条目；或还没编译过。</div>' : `
    <div class="tableScroll"><table class="preview">
      <tr><th style="width:36px"><input type="checkbox" data-all title="全选/全不选"></th><th>条目</th><th style="width:150px">分类</th><th style="width:96px">字节</th><th style="width:90px">原因</th></tr>
      ${candRows.map((r, i) => `<tr><td><input type="checkbox" data-ck="${i}"></td><td>${esc(r.title)}<div class="meta"><code class="k">${esc(r.file)}</code></div></td><td class="meta">${esc(r.category)}</td><td class="meta">${esc(r.sizeText)}</td><td class="meta">${esc(r.reasonText)}</td></tr>`).join("")}
    </table></div>`}`;
  const evictBtn = candCard.querySelector("[data-evict]");
  const boxes = Array.from(candCard.querySelectorAll("[data-ck]"));
  const allBox = candCard.querySelector("[data-all]");
  // 初始态：无候选或未勾选都不可点（防误点触发空提交）
  const syncEvictBtn = () => { evictBtn.disabled = boxes.length === 0 || checked.size === 0; };
  syncEvictBtn();
  for (const box of boxes) {
    box.addEventListener("change", () => {
      const key = candRows[Number(box.getAttribute("data-ck"))].key;
      if (box.checked) checked.add(key); else checked.delete(key);
      if (allBox) allBox.checked = boxes.length > 0 && checked.size === boxes.length;
      syncEvictBtn();
    });
  }
  if (allBox) allBox.addEventListener("change", () => {
    for (const box of boxes) {
      const key = candRows[Number(box.getAttribute("data-ck"))].key;
      box.checked = allBox.checked;
      if (allBox.checked) checked.add(key); else checked.delete(key);
    }
    syncEvictBtn();
  });
  if (evictBtn) evictBtn.addEventListener("click", () => {
    const count = checked.size;
    if (count === 0) return;
    confirmDialog({
      title: "执行归档",
      body: `将把勾选的 ${count} 条候选搬进 long-term 归档区（不删除；归档前会留手术式快照，之后可从这里移回）。\n提交前会先刷新候选清单，已变化的条目自动跳过并如实报告。确定继续吗？`,
      dangerText: "归档并移出编译池",
      onConfirm: async () => {
        evictBtn.disabled = true; evictBtn.textContent = "归档中…"; // 三段式 busy
        try {
          // 防过期（§十二）：先用最新 GET 刷新候选清单，再与勾选集求交提交；
          // 刷新后已消失的条目不可能被归档（服务端也会按 skipped 兜底报），这里先如实拦下
          const fresh = await api("runtime/" + runtimeScope);
          const freshRows = L.runtimeCandidateRows(fresh?.evictCandidates);
          const sel = L.runtimeEvictSelection(checked, freshRows);
          if (sel.files.length === 0) {
            runtimeSkippedNotice = { scope: runtimeScope, rows: sel.dropped.map((d) => ({ file: d.file, text: "条目已变化，已跳过" })) };
            toast(`候选清单已变化：${sel.dropped.length} 条已不在清单，未提交任何归档`, "err");
            renderRuntimePage();
            return;
          }
          const out = await apiPost(`runtime/${runtimeScope}/evict`, { files: sel.files });
          const outSkipped = L.runtimeSkippedRows(out?.skipped);
          runtimeSkippedNotice = { scope: runtimeScope, rows: outSkipped };
          toast(L.runtimeEvictToastText(out), outSkipped.length > 0 ? "err" : "ok");
          renderRuntimePage();
        } catch (err) {
          // 半完成态（归档审计失败）：服务端带回 archived/skipped/snapshotDir，页内如实展示
          // 哪几条没动、快照在哪——不让「失败」只剩一句不知道发生了什么的话。
          const d = err?.details;
          const rows = Array.isArray(d?.skipped) ? L.runtimeSkippedRows(d.skipped) : [];
          runtimeSkippedNotice = { scope: runtimeScope, rows };
          toast("归档失败：" + err.message, "err");
          renderRuntimePage();
          evictBtn.disabled = false; evictBtn.textContent = "执行归档";
        }
      },
    });
  });

  // ---- 从归档移回（§6.4：long-term 条目 → 按 origin 落回原位）----
  const restoreHost = page.querySelector("[data-restoreHost]");
  api("category/long-term")
    .then((lt) => {
      if (seq !== pageRenderSeq) return; // 旧渲染响应不得写入新页
      const rows = L.runtimeRestoreRows(lt?.entries);
      restoreHost.innerHTML = `
        <div class="card"><h3>从归档移回 <span class="badge">long-term ${rows.length}</span></h3>
          <div class="meta">${esc(L.RUNTIME_RESTORE_NOTE)}</div>
          ${rows.length === 0 ? '<div class="meta">long-term 里暂无条目。</div>' : `
          <div class="tableScroll"><table class="preview">
            <tr><th>条目</th><th style="width:220px">文件</th><th style="width:110px">更新</th><th style="width:90px"></th></tr>
            ${rows.map((r, i) => `<tr><td>${esc(r.title)}${r.description ? `<div class="meta">${esc(r.description)}</div>` : ""}</td><td class="meta"><code class="k">${esc(r.file)}</code></td><td class="meta">${esc(r.whenText)}</td><td><button class="btn sm" data-restore="${i}">移回</button></td></tr>`).join("")}
          </table></div>`}
        </div>`;
      for (const btn of Array.from(restoreHost.querySelectorAll("[data-restore]"))) {
        btn.addEventListener("click", () => {
          const row = rows[Number(btn.getAttribute("data-restore"))];
          confirmDialog({
            title: "从归档移回",
            body: `将把「${esc(row.title)}」按归档记录移回原位（恢复原分类/原属性；重名走 -2 避让），并重建索引。\n移回后该条目会重新进入编译候选池。确定继续吗？`,
            dangerText: "移回原位",
            onConfirm: async () => {
              btn.disabled = true; btn.textContent = "处理中…";
              try {
                const out = await apiPost("runtime/global/archive/restore", { file: row.file });
                toast(L.runtimeRestoreToastText(out));
                renderRuntimePage();
              } catch (err) {
                toast("移回失败：" + err.message, "err");
                btn.disabled = false; btn.textContent = "移回";
              }
            },
          });
        });
      }
    })
    .catch((err) => {
      if (seq !== pageRenderSeq) return;
      restoreHost.innerHTML = `<div class="card"><h3>从归档移回</h3><div class="meta">归档条目暂不可读（${esc(err.message)}）。</div></div>`;
    });
}

    saveBtn.disabled = true; // 三段式：busy 期间禁用，完成/失败恢复
    saveBtn.textContent = "处理中…";
    try {
      await apiPut("persona", { content: editor.value });
      savedContent = editor.value;
      dirty.textContent = "";

      },
    });
  });
}

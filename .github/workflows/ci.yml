name: CI

on:
  push:
    branches: [ main ]
  pull_request:

# 只读仓库内容即可，不给写权限
permissions:
  contents: read

# 同分支连续推送时取消旧跑，省掉排队和重复占用
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-26.04, windows-latest ]
        node-version: [ 18, 20, 22, 24 ]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # 零运行时依赖：无需 npm install
      - name: Syntax check (lib + tools)
        run: npm run check
      - name: Unit tests
        run: npm test

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆管理</title>
<style>
  body { --fb-bg: #f7f8fa; --fb-panel: #ffffff; --fb-label: #1f2328; --fb-label2: #59636e; --fb-border: rgba(27,31,36,.12); }
  body.theme-dark { --fb-bg: #17181c; --fb-panel: #1f2126; --fb-label: #e6e8eb; --fb-label2: #9aa2ab; --fb-border: rgba(240,244,248,.14); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--dsw-alias-bg-layer-1, var(--fb-bg)); color: var(--dsw-alias-label-primary, var(--fb-label)); display: flex; min-height: 100vh; }
  aside { width: 200px; flex: none; padding: 18px 12px; border-right: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: var(--dsw-alias-bg-layer-2, var(--fb-panel)); display: flex; flex-direction: column; gap: 2px; }
  aside .brand { font-weight: 700; font-size: 15px; padding: 2px 10px 12px; }
  aside .group { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); padding: 10px 10px 4px; font-weight: 600; }
  aside a { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; user-select: none; color: inherit; text-decoration: none; }
  aside a:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(128,128,128,.1)); }
  aside a.on { background: var(--dsw-alias-button-ghost-active-fill, rgba(128,128,128,.16)); font-weight: 600; }
  aside a .cnt { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-weight: 400; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: var(--dsw-alias-bg-layer-2, var(--fb-panel)); }
  .topbar h1 { font-size: 16px; margin: 0; display: inline; }
  .topbar .sub { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); margin-left: 8px; }
  .btn { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: transparent; color: inherit; border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .btn:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(128,128,128,.12)); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--dsw-alias-button-ghost-active-fill, rgba(128,128,128,.2)); font-weight: 600; }
  .btn.danger { color: #d5564d; border-color: rgba(221,85,85,.5); }
  .btn.sm { padding: 1px 8px; font-size: 11px; }
  .notice { margin: 12px 20px 0; border-radius: 6px; padding: 6px 10px; font-size: 12px; background: rgba(204,153,102,.16); display: none; }
  .notice.show { display: block; }
  .notice.err { background: rgba(221,85,85,.14); }
  .notice.ok { background: rgba(80,160,90,.14); }
  #page { padding: 18px 20px; overflow: auto; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar .spacer { flex: 1; }
  .card { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 10px; background: var(--dsw-alias-bg-layer-2, var(--fb-panel)); padding: 12px 14px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 6px; font-size: 13.5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card h3 .ops { margin-left: auto; display: flex; gap: 6px; }
  .meta { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .entry-body { margin-top: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-size: 13px; padding: 24px 0; text-align: center; }
  .kv { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 13px; }
  .kv b { min-width: 120px; font-weight: 600; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .badge.warn { color: #c98a3d; border-color: rgba(204,153,102,.55); }
  .inp, .ta { border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: transparent; color: inherit; border-radius: 6px; padding: 5px 8px; font-size: 12.5px; font-family: inherit; width: 100%; }
  .inp:focus, .ta:focus { outline: none; border-color: var(--dsw-alias-state-business-primary, #4176e6); }
  .ta { min-height: 90px; resize: vertical; font-family: ui-monospace, Consolas, monospace; line-height: 1.5; }
  .ta.tall { min-height: 300px; }
  .field { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
  .field label { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .switchWrap { display: inline-flex; align-items: center; gap: 8px; }
  .switch { position: relative; width: 34px; height: 19px; flex: none; display: inline-block; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .slider { position: absolute; inset: 0; border-radius: 99px; background: rgba(128,128,128,.4); transition: .15s; pointer-events: none; }
  .slider::after { content: ''; position: absolute; top: 2.5px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #c8cdd4; transition: .15s; }
  .switch input:checked + .slider { background: var(--dsw-alias-state-business-primary, #4176e6); }
  .switch input:checked + .slider::after { left: 17px; background: #fff; }
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog { background: var(--dsw-alias-bg-layer-2, var(--fb-panel)); color: inherit; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); box-shadow: 0 0 16px rgba(0,0,0,.25); border-radius: 10px; padding: 16px; width: min(720px, 94vw); max-height: 86vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .dialog h2 { font-size: 14px; margin: 0; }
  .dialog .foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px dashed var(--dsw-alias-border-l2, var(--fb-border)); padding-top: 10px; }
  table.preview { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.preview th, table.preview td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); vertical-align: top; }
  table.preview tr.danger td { background: rgba(221,85,85,.1); }
  table.preview tr.danger td:first-child { border-left: 3px solid #d5564d; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
  .mdprev h1, .mdprev h2, .mdprev h3 { margin: 8px 0 4px; }
  .mdprev h1 { font-size: 17px; } .mdprev h2 { font-size: 15px; } .mdprev h3 { font-size: 13.5px; }
  .mdprev p { margin: 6px 0; }
  .mdprev code { font-family: Consolas, monospace; font-size: 12px; background: rgba(128,128,128,.14); border-radius: 4px; padding: 0 4px; }
  .mdprev ul { margin: 4px 0; padding-left: 20px; }
  .presetRow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { display: inline-flex; align-items: center; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 8px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; user-select: none; background: transparent; color: inherit; }
  .pill:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(128,128,128,.1)); }
  .pill.on { background: var(--dsw-alias-button-ghost-active-fill, rgba(128,128,128,.18)); font-weight: 600; }
  .search { max-width: 320px; }
  code.k { font-family: Consolas, monospace; font-size: 12px; background: rgba(128,128,128,.12); border-radius: 4px; padding: 0 4px; }
  /* 窄屏横向滚动容器（导入预览表 + 失败详情表共用，防小窗撑破） */
  .tableScroll { overflow: auto; margin: 8px 0; }
  /* 三态灯点：绿/黄/红只用既有色值（#50a05a/#c98a3d/#d5564d，不引新值）；
     灰=提取在途（闪烁），色取 --dsw-alias-label-secondary 带 fallback */
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.green { background: #50a05a; }
  .dot.yellow { background: #c98a3d; }
  .dot.red { background: #d5564d; }
  .dot.grey { background: var(--dsw-alias-label-secondary, #9aa2ab); animation: dotBlink 1.1s ease-in-out infinite; }
  @keyframes dotBlink { 50% { opacity: .3; } }
  /* aside 设置项的提取连击红徽标（与 .cnt 同形，红=#d5564d 既有值） */
  aside a .cnt.alert { color: #d5564d; font-weight: 600; }
  /* 提示条（.notice）：错误类延长至 8 秒自动消失 + 最近错误区兜底，关闭按钮贴在文字右侧 */
  #toast .toastClose { margin-left: 10px; vertical-align: middle; }
  /* 「最近错误」回看区（保留最近 5 条，折叠收纳） */
  #recentErrors { margin: 12px 20px 0; }
  #recentErrors summary { cursor: pointer; }
  #recentErrors .errItem { margin: 4px 0; white-space: pre-wrap; word-break: break-word; }
  /* 三态灯状态词（颜色之外的第二编码，色弱/灰度屏也能读） */
  .statusWord { font-size: 12px; font-weight: 600; }
  .statusWord.green { color: #50a05a; }
  .statusWord.yellow { color: #c98a3d; }
  .statusWord.red { color: #d5564d; }
  .statusWord.grey { color: var(--dsw-alias-label-secondary, #9aa2ab); }
  /* 窄屏（≤800px）：侧栏转横排、分栏堆叠单列、顶栏可换行，防小窗破版 */
  @media (max-width: 800px) {
    body { flex-direction: column; }
    aside { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; border-right: none; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); padding: 10px 12px; }
    aside .brand { padding: 2px 10px; }
    aside .group { padding: 4px 8px; }
    aside a { padding: 4px 8px; }
    .topbar { flex-wrap: wrap; }
    .split { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <aside id="nav">
    <div class="brand">记忆管理台</div>
    <div class="group">记忆分类</div>
    <a href="#/category/work-profile" data-route="category/work-profile">工作背景 <span class="cnt" data-cnt="work-profile"></span></a>
    <a href="#/category/user-profile" data-route="category/user-profile">用户个人背景 <span class="cnt" data-cnt="user-profile"></span></a>
    <a href="#/category/current-focus" data-route="category/current-focus">当前关注 <span class="cnt" data-cnt="current-focus"></span></a>
    <a href="#/category/recent-activity" data-route="category/recent-activity">近期动态 <span class="cnt" data-cnt="recent-activity"></span></a>
    <div class="group">通用</div>
    <a href="#/long-term" data-route="long-term">长期记忆 <span class="cnt" data-cnt="long-term"></span></a>
    <a href="#/persona" data-route="persona">人设</a>
    <a href="#/addressing" data-route="addressing">称呼</a>
    <a href="#/projects" data-route="projects">项目记忆 <span class="cnt" data-cnt="projects"></span></a>
    <div class="group">可逆性</div>
    <a href="#/trash" data-route="trash">回收站 <span class="cnt" data-cnt="trash"></span></a>
    <a href="#/snapshots" data-route="snapshots">快照 <span class="cnt" data-cnt="snapshots"></span></a>
    <a href="#/settings" data-route="settings">设置 <span class="cnt alert" data-cnt="extraction-streak" title="自动提取连续失败次数（设置页管道健康卡可看详情）"></span></a>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="pageTitle">记忆管理</h1><span class="sub" id="pageSub"></span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="themeToggle" title="未能自动跟随应用主题时，在这里手动切换深浅色">◐ 手动切换深浅色</button>
        <button class="btn" id="backBtn">← 返回设置</button>
      </div>
    </div>
    <div class="notice" id="bridgeNotice">未能跟随应用主题，请手动选择深浅色——右上角可切换。</div>
    <div class="notice" id="toast" role="status" aria-live="polite"></div>    <div class="meta" id="countsStatus" hidden style="margin:6px 20px 0"></div>
    <details id="recentErrors" hidden>
      <summary class="meta">最近错误（保留最近 5 条）</summary>
      <div data-errList></div>
    </details>
    <div id="page"></div>
  </main>
  <div id="dialogHost"></div>

<script type="module">
import * as L from "/dsh-keepsake/panel/panel-logic.js";

const $ = (id) => document.getElementById(id);
const page = $("page");
const pageTitle = $("pageTitle");
const pageSub = $("pageSub");
const dialogHost = $("dialogHost");

// ============ 主题桥（定案机制） ============
const hostWindow = (() => {
  try { if (window.opener && window.opener !== window) return window.opener; } catch (e) {}
  try { if (window.parent && window.parent !== window) return window.parent; } catch (e) {}
  return null;
})();
let manualTheme = false;
let bridgeLastOk = false; // [已知] 桥曾成功标记：桥再失效（n===0）时重挂退路

function bridgeApply(vars) {
  if (manualTheme) return 0; // 手动档已选即断桥——晚到的成功不得踩死手动选择
  const n = L.applyThemeVars(document.body.style, vars);
  if (n > 0) {
    bridgeLastOk = true;
    $("bridgeNotice").classList.remove("show");
    $("themeToggle").style.display = "none";
  } else if (bridgeLastOk) {
    // [已知] 退路：桥曾成功、现在收集不到变量（host 关闭/样式表消失）——
    // 旧变量只写不删会冻结在旧主题，必须重挂提示+复活手动钮
    bridgeLastOk = false;
    $("bridgeNotice").classList.add("show");
    $("themeToggle").style.display = "";
  }
  return n;
}
function startThemeBridge() {
  if (!hostWindow) { $("bridgeNotice").classList.add("show"); return; }
  const vars = L.collectThemeVarsFromDoc(hostWindow.document);
  if (Object.keys(vars).length > 0) bridgeApply(vars);
  else $("bridgeNotice").classList.add("show");
  window.addEventListener("message", (ev) => {
    if (ev && ev.data && ev.data.type === "dsh-keepsake:theme" && ev.data.vars) bridgeApply(ev.data.vars);
  });
  try {
    let pending = false;
    const observer = new MutationObserver(() => {
      if (pending) return;
      pending = true;
      setTimeout(() => { pending = false; bridgeApply(L.collectThemeVarsFromDoc(hostWindow.document)); }, 50);
    });
    const filter = ["style", "class", "data-ds-dark-theme", "data-ds-theme-source"];
    observer.observe(hostWindow.document.body, { attributes: true, attributeFilter: filter });
    observer.observe(hostWindow.document.documentElement, { attributes: true, attributeFilter: filter });
  } catch (e) { /* 保留静态变量 */ }
  try { hostWindow.postMessage({ type: "dsh-keepsake:panel-ready" }, "*"); } catch (e) {}
}
$("themeToggle").addEventListener("click", () => {
  manualTheme = true; // 单向断桥（再点只切换深浅，桥不再接管）
  // 清掉桥写进 body 内联的 --dsw-alias-*（级联优先级高于样式表），
  // 让 body.theme-dark 的 --fb-* 兜底重新生效——否则手动档被架空、按钮变死键
  const st = document.body.style;
  for (let i = st.length - 1; i >= 0; i -= 1) {
    const name = st[i];
    if (typeof name === "string" && name.startsWith("--dsw-alias-")) st.removeProperty(name);
  }
  document.body.classList.toggle("theme-dark");
});
// 「返回设置」分档：popup 关窗 / iframe 通知宿主收起 / 顶层绕开面板内部
// hash 路由历史一步回设置页（决策纯函数 L.panelBackAction 进检查）
let backDepth = 0; // 面板内部 hash 路由压栈计数（load 后 hashchange 次数）
window.addEventListener("hashchange", () => { backDepth += 1; });
$("backBtn").addEventListener("click", () => {
  let hasOpener = false;
  let hasParent = false;
  try { hasOpener = Boolean(window.opener && window.opener !== window); } catch (e) {}
  try { hasParent = Boolean(window.parent && window.parent !== window); } catch (e) {}
  const act = L.panelBackAction(hasOpener, hasParent, window.history.length, backDepth);
  if (act.mode === "close") { try { window.close(); } catch (e) {} return; }
  if (act.mode === "notify-host") {
    try { window.parent.postMessage({ type: "dsh-keepsake:panel-close" }, "*"); } catch (e) {}
    return;
  }
  if (act.mode === "back") { window.history.go(-act.steps); return; }
  window.location.href = "/";
});

// ============ 基础 helper ============
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
async function api(path, options) {
  const res = await fetch("/dsh-keepsake/api/" + path, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    // 优先后端补的中文 message，回落到错误码 body.error（旧宿主只有 error）
    throw new Error(body.message || body.error || "HTTP " + res.status);
  }
  return body;
}
const apiPut = (path, obj) => api(path, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(obj) });
const apiPost = (path, obj) => api(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(obj ?? {}) });
const apiDel = (path, obj) => api(path, { method: "DELETE", headers: { "content-type": "application/json" }, body: JSON.stringify(obj) });
const ENTRY_MAX_CHARS = 20000; // 与服务端 content 上限对齐——客户端拒绝而非静默截断
const ADDRESS_SAVE_DEBOUNCE_MS = 600; // 与 lib/client.js 同名常量一致（防漂移检查钉住）

const RECENT_ERRORS_MAX = 5; // 最近错误回看区保留条数
const recentErrors = []; // 最近错误（新在前），仅内存态
let toastTimer = null;
function renderRecentErrors() {
  const box = $("recentErrors");
  if (!box) return;
  if (recentErrors.length === 0) { box.hidden = true; return; }
  box.hidden = false;
  box.querySelector("[data-errList]").innerHTML = recentErrors
    .map((it) => `<div class="errItem"><span class="meta">${esc(it.at)}</span> ${esc(it.text)}</div>`)
    .join("");
}
function toast(text, kind = "ok") {
  const el = $("toast");
  const isErr = kind === "err";
  el.className = "notice show " + kind;
  // 无障碍角色分流：错误类 role=alert（读屏立即抢念， assertive 由下方 aria-live 保持），
  // 成功回落 role=status——两者互斥，不得同时挂着（同一节点两个 role 语义互相抵消）
  el.setAttribute("role", isErr ? "alert" : "status");
  // 错误类：写进「最近错误」回看区（时间取本地时刻），并延长提示条停留时间（8 秒）
  if (isErr) {
    recentErrors.unshift({ text, at: new Date().toLocaleTimeString("zh-CN", { hour12: false }) });
    if (recentErrors.length > RECENT_ERRORS_MAX) recentErrors.length = RECENT_ERRORS_MAX;
    renderRecentErrors();
  }
  el.setAttribute("aria-live", isErr ? "assertive" : "polite");
  el.textContent = text;
  // 关闭按钮（手动收起）——错误与成功都给，用户随时能清掉
  const close = document.createElement("button");
  close.className = "btn sm toastClose";
  close.type = "button";
  close.setAttribute("aria-label", "关闭提示");
  close.textContent = "关闭";
  close.addEventListener("click", () => { if (toastTimer) clearTimeout(toastTimer); el.className = "notice"; });
  el.appendChild(close);
  if (toastTimer) clearTimeout(toastTimer);
  // 成功类短时自动消失；错误类延长至 8 秒（读得完），且已进「最近错误」回看区兜底
  toastTimer = setTimeout(() => { el.className = "notice"; }, isErr ? 8000 : 3200);
}
function fmtTime(ms) {
  if (!ms) return "—";
  const d = new Date(ms);
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// 迷你 markdown 渲染（人设预览用：标题/粗体/行内码/列表/段落）
function mdRender(text) {
  const lines = String(text ?? "").split("\n");
  let html = "";
  let inList = false;
  const inline = (s) => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+)`/g, "<code>$1</code>");
  for (const line of lines) {
    const t = line.trimEnd();
    let m;
    if ((m = t.match(/^###\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h3>${inline(m[1])}</h3>`; }
    else if ((m = t.match(/^##\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h2>${inline(m[1])}</h2>`; }
    else if ((m = t.match(/^#\s+(.*)$/))) { if (inList) { html += "</ul>"; inList = false; } html += `<h1>${inline(m[1])}</h1>`; }
    else if ((m = t.match(/^[-*]\s+(.*)$/))) { if (!inList) { html += "<ul>"; inList = true; } html += `<li>${inline(m[1])}</li>`; }
    else if (t.trim() === "") { if (inList) { html += "</ul>"; inList = false; } }
    else { if (inList) { html += "</ul>"; inList = false; } html += `<p>${inline(t)}</p>`; }
  }
  if (inList) html += "</ul>";
  return html;
}

// ============ 确认弹窗（栈式：确认层不再覆写下层对话框——源码模式取消不丢编辑） ============
// 焦点陷阱走 L.trapFocus（四处弹窗复用的单一实现：Tab 循环 + 首尾回卷 + Esc 关闭），
// 关闭时必须调 off()——监听挂在 document 上，不摘会泄漏到背景页拦用户的键。
function confirmDialog({ title, body, dangerText = "确认", onConfirm }) {
  const layer = document.createElement("div"); // 独立层 append：下层对话框 DOM 原样保留
  layer.innerHTML = `
    <div class="mask">
      <div class="dialog" role="dialog" aria-modal="true" style="width:min(440px,92vw)">
        <h2>${esc(title)}</h2>
        <div style="font-size:13px;white-space:pre-wrap">${body}</div>
        <div class="foot">
          <button class="btn" data-x>取消</button>
          <button class="btn danger" data-ok>${esc(dangerText)}</button>
        </div>
      </div>
    </div>`;
  dialogHost.appendChild(layer);
  const close = () => { // 只摘本层，下层（若有）恢复可见、编辑内容无损
    offFocus();
    document.removeEventListener("keydown", onKey);
    layer.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); }; // Esc = 取消（键盘可达）
  document.addEventListener("keydown", onKey);
  const offFocus = L.trapFocus(layer, close); // Tab 回卷 + Esc（trapFocus 自带 Esc，onKey 兼容旧路径）
  const cancelBtn = layer.querySelector("[data-x]");
  cancelBtn.addEventListener("click", close);
  layer.querySelector(".mask").addEventListener("mousedown", (e) => { if (e.target.classList.contains("mask")) close(); });
  layer.querySelector("[data-ok]").addEventListener("click", async () => {
    close();
    await onConfirm();
  });
  cancelBtn.focus(); // 打开即聚焦首个按钮（键盘/读屏可达）
}

// ============ 条目编辑卡片（分类页/长期页共用） ============
function entryCard(cat, e, reload, keepDays) {
  const card = document.createElement("div");
  card.className = "card";
  const expireDays = L.recentExpireDays(e.timestamp, keepDays);
  const ageBadge = cat === "recent-activity"
    ? `<span class="badge">${esc(L.recentAgeOf(e.timestamp).text)}${expireDays === null ? "" : ` · ${expireDays} 天后过期`}</span> `
    : "";
  card.innerHTML = `
    <h3>${ageBadge}<span>${esc(e.title)}</span>
      <span class="ops">
        <button class="btn sm" data-edit>编辑</button>
        <button class="btn sm danger" data-del>删除</button>
      </span>
    </h3>
    ${e.description ? `<div class="meta">${esc(e.description)}</div>` : ""}
    <div class="meta">${esc(e.name)} · <span title="${esc(fmtTime(e.mtimeMs))}">${esc(L.relativeTimeOf(e.mtimeMs))}</span></div>
    <div class="entry-body">${esc(e.content)}</div>`;
  card.querySelector("[data-del]").addEventListener("click", () => {
    confirmDialog({
      title: "删除条目",
      body: `确定删除「${esc(e.title)}」吗？将移入回收站（可在回收站找回，保留天数见设置页保留策略）。`,
      dangerText: "移入回收站",
      onConfirm: async () => {
        try {
          // 三态判读走纯函数（deleteOutcomeOf）：不存在 / 已移入回收站 / 删除失败互不混同。
          // 关键：失败态**不**刷新列表——原件还在盘上，抹掉就是静默消失（比报错更糟）。
          const out = await apiDel("entry", { category: cat, name: e.name });
          const outcome = L.deleteOutcomeOf(out);
          toast(outcome.toast, outcome.kind === "failed" ? "err" : "ok");
          if (outcome.reload) reload();
        } catch (err) { toast("删除失败：" + err.message, "err"); }
      },
    });
  });
  card.querySelector("[data-edit]").addEventListener("click", () => {
    card.innerHTML = `
      <div class="field"><label>标题（60 字内） <span class="meta" data-tcnt></span></label><input class="inp" data-t maxlength="60" value="${esc(e.title)}"></div>
      <div class="field"><label>描述（一行钩子，可选，60 字内） <span class="meta" data-dcnt></span></label><input class="inp" data-d maxlength="60" value="${esc(e.description)}"></div>
      <div class="field"><label>正文（${ENTRY_MAX_CHARS} 字符上限）</label><textarea class="ta" data-c maxlength="${ENTRY_MAX_CHARS}"></textarea><div class="meta" data-cnt></div></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn sm" data-x>取消</button>
        <button class="btn sm primary" data-s>保存</button>
      </div>`;
    // maxlength 不拦脚本/存量数据，value 先行赋值再挂计数（存量超长立即可见）
    const $c = card.querySelector("[data-c]");
    const $cnt = card.querySelector("[data-cnt]");
    const $t = card.querySelector("[data-t]");
    const $d = card.querySelector("[data-d]");
    $c.value = e.content;
    const updCnt = () => {
      const over = $c.value.length > ENTRY_MAX_CHARS;
      $cnt.textContent = `${$c.value.length} / ${ENTRY_MAX_CHARS} 字符 · UTF-8 ${L.utf8Length($c.value)} 字节` + (over ? "（已超限，保存将被阻止）" : "");
    };
    // 标题/描述 60 字实时计数（maxlength 到了就截，用户看得见还剩多少）
    const updTitleCnt = () => { card.querySelector("[data-tcnt]").textContent = `${$t.value.length} / 60`; };
    const updDescCnt = () => { card.querySelector("[data-dcnt]").textContent = `${$d.value.length} / 60`; };
    updCnt(); updTitleCnt(); updDescCnt();
    $c.addEventListener("input", updCnt);
    $t.addEventListener("input", updTitleCnt);
    $d.addEventListener("input", updDescCnt);
    card.querySelector("[data-x]").addEventListener("click", reload);
    card.querySelector("[data-s]").addEventListener("click", async () => {
      const v = L.validateEntryDraft($t.value, $c.value); // 必填/字符/字节三道门
      if (!v.ok) { toast(v.error, "err"); return; }
      try {
        await apiPut("entry", {
          category: cat,
          name: e.name,
          title: $t.value,
          description: $d.value,
          content: $c.value,
        });
        toast("已保存");
        reload();
      } catch (err) { toast("保存失败：" + err.message, "err"); }
    });
  });
  return card;
}

// ============ 源码模式（整类直接编辑：序列化 → 编辑 → reset+import 重建） ============
// 序列化/解析纯函数在 panel-logic.js（与检查共享同一份；desc 随注释往返不丢——修复）。
// 已知边界：正文内含 "\n---\n"（单独一行 ---）的条目会被当分隔符切散，弹窗说明已注明。
function sourceModeDialog(cat, entries, reload) {
  const original = L.serializeEntries(entries);
  dialogHost.innerHTML = `
    <div class="mask">
      <div class="dialog" style="width:min(860px,96vw)" role="dialog" aria-modal="true">
        <h2>源码模式——直接编辑整类</h2>
        <div class="meta">每条 = <code class="k">## 标题</code> + 可选 <code class="k">&lt;!-- name: file.md desc: 一行钩子 --&gt;</code> + 正文；条目间用一行 <code class="k">---</code> 分隔（正文中请勿出现单独一行 --- ，会被当分隔符）。保存 = 整类替换（先自动备份再重建，desc 随注释往返不丢）。</div>
        <textarea class="ta tall" data-src style="min-height:46vh">${esc(original)}</textarea>
        <div class="foot">
          <button class="btn" data-x>取消</button>
          <button class="btn danger" data-s>保存整类（先备份）</button>
        </div>
      </div>
    </div>`;
  // 焦点陷阱（L.trapFocus）：Esc 等同取消（改过内容同样先确认，不静默丢草稿）
  const offFocus = L.trapFocus(dialogHost, () => dialogHost.querySelector("[data-x]").click());
  // 取消：编辑过（与打开时内容不同）先确认，防止误点丢草稿
  const cancelSource = () => {
    const changed = dialogHost.querySelector("[data-src]").value !== original;
    if (!changed) { offFocus(); dialogHost.innerHTML = ""; return; }
    confirmDialog({
      title: "放弃未保存内容？",
      body: "源码模式已改动但尚未保存，取消将丢弃这些改动。确定要放弃吗？",
      dangerText: "放弃",
      onConfirm: () => { offFocus(); dialogHost.innerHTML = ""; },
    });
  };
  dialogHost.querySelector("[data-x]").addEventListener("click", cancelSource);
  dialogHost.querySelector("[data-s]").addEventListener("click", () => {
    const parsed = L.parseSourceText(dialogHost.querySelector("[data-src]").value);
    confirmDialog({
      title: "整类替换确认",
      body: `将解析出 ${parsed.length} 条。\n操作会先自动备份当前内容，再清空整类并写入这些条目。确定继续吗？`,
      dangerText: "备份并替换",
      onConfirm: async () => {
        let resetBackupId = null; // reset+import 两步非原子——失败时指路备份
        try {
          const resetOut = await apiPost(`category/${cat}/reset`);
          resetBackupId = resetOut.backupId ?? null;
          if (parsed.length > 0) {
            await apiPost("import", { category: cat, format: "json", payload: { entries: parsed } });
          }
          offFocus();
          dialogHost.innerHTML = ""; // 栈式确认层只摘自己，成功才撤源对话框
          toast(`整类已替换（${parsed.length} 条，已自动备份）`);
          reload();
        } catch (err) {
          const hint = resetBackupId
            ? `——分类已清空但写入失败：原内容已自动备份（${resetBackupId}），可到「设置」页恢复`
            : "——尚未做任何改动，可重试";
          toast("整类替换失败：" + err.message + hint, "err");
        }
      },
    });
  });
}

// ============ 导入向导（上传/粘贴 → 格式 → dryRun 冲突标红 → 确认） ============
// 焦点陷阱（L.trapFocus）：Esc = 取消（关闭即撤，无草稿保留语义——导入内容以文本框现值重新取）。
function importDialog(cat, reload) {
  dialogHost.innerHTML = `
    <div class="mask">
      <div class="dialog">
        <h2>导入到「${esc(cat)}」</h2>
        <div class="field"><label>① 选择文件（.json / .md）或直接在下方粘贴</label>
          <input type="file" data-file accept=".json,.md,.txt">
        </div>
        <div class="field"><label>② 内容（可粘贴/编辑）</label>
          <textarea class="ta tall" data-text placeholder='JSON：{"entries":[{"title":"…","content":"…"}]}；或 Markdown（## 拆条 / 整段）'></textarea>
        </div>
        <div class="kv"><b>格式</b>
          <select class="inp" data-fmt style="width:auto">
            <option value="json">JSON（结构化逐条）</option>
            <option value="markdown-split">Markdown 拆条（按 ## 标题）</option>
            <option value="markdown-whole">Markdown 整段（整条一条）</option>
          </select>
          <span class="meta" data-fmtHint></span>
        </div>
        <div data-previewHost></div>
        <div class="foot">
          <button class="btn" data-x>取消</button>
          <button class="btn primary" data-dry>预览将要写入的内容</button>
          <button class="btn danger" data-confirm style="display:none">确认写入</button>
        </div>
      </div>
    </div>`;
  const $fmt = dialogHost.querySelector("[data-fmt]");
  const $text = dialogHost.querySelector("[data-text]");
  const $dry = dialogHost.querySelector("[data-dry]");
  const $confirm = dialogHost.querySelector("[data-confirm]");
  const $preview = dialogHost.querySelector("[data-previewHost]");
  const $fmtHint = dialogHost.querySelector("[data-fmtHint]");
  let fmtTouched = false; // 用户手选过格式后，选文件不再覆盖手选
  const clearPreview = () => { $preview.innerHTML = ""; $confirm.style.display = "none"; };
  // 格式说明随选择变化（死元素修复：让人看清每种格式会把内容怎么拆条）
  const FMT_HINTS = {
    "json": "结构：{\"entries\":[{\"title\":\"…\",\"content\":\"…\"}]}，逐条写入。",
    "markdown-split": "按 ## 标题拆成多条，每段成为一条记忆。",
    "markdown-whole": "整篇作为一条记忆写入（不拆分）。",
  };
  const updFmtHint = () => { $fmtHint.textContent = FMT_HINTS[$fmt.value] ?? ""; };
  updFmtHint();
  const offFocus = L.trapFocus(dialogHost, () => dialogHost.querySelector("[data-x]").click());
  const closeImport = () => { offFocus(); dialogHost.innerHTML = ""; };
  dialogHost.querySelector("[data-x]").addEventListener("click", closeImport);
  dialogHost.querySelector("[data-file]").addEventListener("change", (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) { // 2MB 预检——超限文件不白读白传
      toast("文件超过 2MB 上限，请精简后重试（或直接把内容粘贴到下方）", "err");
      ev.target.value = "";
      return;
    }
    const reader = new FileReader();
    reader.onerror = () => toast("文件读取失败，请重试或直接粘贴内容", "err"); // 读取错误可见
    reader.onload = () => {
      $text.value = String(reader.result ?? "");
      if (!fmtTouched) { $fmt.value = L.detectImportFormat(file.name, $text.value); updFmtHint(); }
      clearPreview();
    };
    reader.readAsText(file);
  });
  // [已知] 预览失效修复：文本与格式任一变化都清旧预览/藏确认钮——所见即所写
  $text.addEventListener("input", clearPreview);
  $fmt.addEventListener("change", () => { fmtTouched = true; updFmtHint(); clearPreview(); });
  $dry.addEventListener("click", async () => {
    const req = L.buildImportRequest(cat, $fmt.value, $text.value, L.importTitleOf($fmt.value, $text.value)); // markdown 标题随行
    if (!req.ok) { toast(req.error, "err"); return; }
    try {
      const out = await apiPost("import?dryRun=1", req.body);
      const rows = L.previewRowsOf(out.plans);
      if (rows.length === 0) { $preview.innerHTML = '<div class="empty">没有可导入的条目</div>'; return; }
      $preview.innerHTML = `
        <div class="meta" style="margin:8px 0">③ 将要写入 ${rows.length} 条（<b style="color:#d5564d">${rows.filter((r) => r.danger).length} 条与现有内容冲突或批内改名</b>）：</div>
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:90px">动作</th><th>标题</th><th>文件</th><th style="width:40%">内容预览</th></tr>
          ${rows.map((r) => `<tr class="${r.danger ? "danger" : ""}"><td>${r.action === "rename" ? "改名" : r.danger ? "覆盖" : "新增"}</td><td>${esc(r.title)}</td><td class="meta">${esc(r.name)}</td><td class="meta">${esc(r.preview)}</td></tr>`).join("")}
        </table></div>
        ${(out.errors ?? []).length > 0 ? `<div class="notice show err" style="margin:8px 0">${(out.errors ?? []).map(esc).join("<br>")}</div>` : ""}
        ${(out.notes ?? []).length > 0 ? `<div class="meta" style="margin:8px 0">${(out.notes ?? []).map(esc).join("<br>")}</div>` : ""}`;
      $confirm.style.display = "";
    } catch (err) { toast("预览失败：" + err.message, "err"); }
  });
  $confirm.addEventListener("click", async () => {
    const req = L.buildImportRequest(cat, $fmt.value, $text.value, L.importTitleOf($fmt.value, $text.value));
    if (!req.ok) { toast(req.error, "err"); return; }
    try {
      const out = await apiPost("import", req.body);
      offFocus();
      dialogHost.innerHTML = "";
      // 修复：HTTP 200 + ok:false（部分条目失败）也要可见，不静默报成功
      if (out.ok === false) {
        toast(`导入部分失败：写入 ${out.written} 条，失败 ${out.failed.length} 条（${out.failed.join("、")}）；已自动备份 ${out.backupId}`, "err");
      } else {
        // merged 为导入重名合并修复的新计数口径——tolerant 消费（旧版无此字段显示 0）
        toast(`导入完成：写入 ${out.written} 条（覆盖 ${out.overwritten ?? 0} 条，合并 ${out.merged ?? 0} 条，已自动备份 ${out.backupId}）`);
      }
      reload();
    } catch (err) { toast("导入失败：" + err.message, "err"); }
  });
}

// ============ 页面渲染序号（快速切路由时旧响应不得写入新页） ============
let pageRenderSeq = 0;

// 近期动态保留天数：面板展示「N 天后过期」用。tolerant——新旧字段位置都认，
// 缺失/非法 → undefined（L.recentExpireDays 自行落默认 30）。
function recentKeepDaysOf(st) {
  const s = st && typeof st === "object" ? st : {};
  const nested = s.settings && typeof s.settings === "object" ? s.settings.recentKeepDays : undefined;
  const raw = nested !== undefined ? nested : s.recentKeepDays;
  const n = Number(raw);
  return Number.isFinite(n) && n > 0 ? n : undefined;
}

// ============ 页面：四分类 / 长期记忆 ============
// 列表分页（pageSize 50）：翻页保留检索词与页码；pageRenderSeq 竞态守卫沿用
// （旧渲染响应不得写入新页——翻页是异步渲染，连点「下一页」时靠它兜底）。
const PAGE_SIZE = L.PAGE_SIZE;

/** 分页底栏（上一页/下一页 · 第 N/M 页 · 共 X 条）。 */
function pagerHtml(pg) {
  if (pg.pageCount <= 1) return ""; // 一页以内不渲染底栏（不摆死键）
  return `
    <div class="toolbar" data-pager style="margin-top:10px;margin-bottom:0">

async function renderCategoryPage(cat, title, query = "", pageIndex = 0) {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = title;
  pageSub.textContent = cat === "recent-activity" ? "自动滚动清理（默认保留 30 条 / 30 天，可在设置页调整）" : "";
  page.innerHTML = '<div class="empty">加载中…</div>';

    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  // 近期动态页顺路取一次保留天数（过期文案按真实配置显示）；其它分类跳过，不白拉
  let keepDays;
  if (cat === "recent-activity") {
    try { keepDays = recentKeepDaysOf(await api("state")); } catch { /* 取不到走默认 30 天 */ }
  }
  if (seq !== pageRenderSeq) return; // 旧渲染丢弃：用户已切到别的路由
  const all = data.entries ?? [];
  let current = query;
  let currentPage = pageIndex;
  // reload 后保留检索词与页码（翻页不丢上下文）
  const reload = () => { renderCategoryPage(cat, title, current, currentPage); refreshCounts(); };
  page.innerHTML = `
    <div class="toolbar">
      <input class="inp search" data-q placeholder="检索：标题 / 描述 / 正文即时过滤">
      <button class="btn danger" data-reset>重置</button>
      <button class="btn" data-source>源码模式</button>
      <button class="btn" data-import>导入</button>
      <span class="spacer"></span>
      <button class="btn primary" data-new>＋ 新增条目</button>
    </div>
    <div data-list></div>
    <div data-pagerHost></div>`;
  const list = page.querySelector("[data-list]");
  const pagerHost = page.querySelector("[data-pagerHost]");
  const $q = page.querySelector("[data-q]");
  $q.value = query;
  // 空态拆两态——库空（引导语）vs 搜索无命中（回显 query，区别于库空）
  const renderList = (entries, q = "") => {
    list.innerHTML = "";
    if (entries.length === 0) {
      list.innerHTML = all.length === 0
        ? '<div class="empty">暂无条目。对话中聊到相关信息后，DSH 会自动归类到这里；也可以手动新增或导入。</div>'
        : `<div class="empty">没有匹配「${esc(q)}」的条目——换个关键词，或清空检索框查看全部 ${all.length} 条。</div>`;
      pagerHost.innerHTML = "";
      return;
    }
    // 分页：检索变化时页码回落第 1 页（旧页号对着新过滤结果可能越界）
    const pg = L.paginateOf(entries.length, currentPage);

  };
  renderList(L.filterEntries(all, query), query);
  $q.addEventListener("input", (ev) => { current = ev.target.value; currentPage = 0; renderList(L.filterEntries(all, ev.target.value), ev.target.value); });
  page.querySelector("[data-new]").addEventListener("click", () => newEntryDialog(cat, reload));

// ============ 管道健康卡 + 提取模型卡（布局 + 模型可视化） ============
// /state 新字段 tolerant 消费（host 契约）：新服务端恒在、缺失=旧版。
// 三态判定/文案/短名/相对时间全走 panel-logic 纯函数（双端一致）；
// recent[].message 是上游错误串不可信，渲染必过 esc()。
let pipePollTimer = null; // streak>0 期间 5s 本地轮询；render() 切路由统一清
let pipeRetryBusy = false; // 手动重试轮询在途——5s 轮询让位（避免卡片重渲染打断按钮 busy 态）

function stopPipePoll() {
  if (pipePollTimer) { clearInterval(pipePollTimer); pipePollTimer = null; }
}

/** 分桶 badge 行（零值不渲染——零桶平铺只会稀释病灶）。 */
function pipeBucketsHtml(ef) {
  const badges = L.EXTRACTION_BUCKET_KEYS
    .filter((k) => Number(ef && ef[k] != null ? ef[k] : 0) > 0)
    .map((k) => `<span class="badge">${esc(k)} ${Number(ef[k])}</span>`);
  return badges.length > 0 ? badges.join(" ") : '<span class="meta">无失败计数</span>';
}

/** aside 设置项红徽标（连击>0 才显示；刷新计数/健康卡轮询顺路更新）。 */
function updateStreakBadge(streak) {
  const el = document.querySelector('[data-cnt="extraction-streak"]');
  if (el) el.textContent = streak > 0 ? String(streak) : "";
}

/** 最近提取记录折叠区（/state.extractionLog.runs；缺失/空 = 旧版宿主或无记录，不渲染）。
 *  为什么单独一块：三态灯只答"最近健康不健康"，答不了"上次到底写了没有"；runs 是把提取
 *  管线一日的行为摊开给人看的唯一面。上限 12 行——再多信息密度反而压过病灶，余量如实报数。
 *  行模型/文案全走 L.extractionRunLines + L.extractionRunLabel，双端不漂移。 */
function pipeExtractionLogHtml(data, limit = 12) {
  const lines = L.extractionRunLines(data.extractionLog);
  if (lines.length === 0) return "";
  const rows = lines.slice(0, limit).map((r) => `
      <tr><td class="meta">${esc(L.relativeTimeOf(r.at))}</td><td class="meta">${esc(r.range || "—")}</td><td>${esc(r.label)}${r.sessionId ? `<span class="meta"> · ${esc(r.sessionId)}</span>` : ""}</td></tr>`).join("");
  const rest = lines.length - Math.min(lines.length, limit);
  return `
      <details style="margin:8px 0 0"><summary class="meta" style="cursor:pointer">最近提取记录（${lines.length} 条）</summary>
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:92px">时间</th><th style="width:110px">范围</th><th>结果</th></tr>
          ${rows}
          ${rest > 0 ? `<tr><td colspan="3" class="meta">还有 ${rest} 条未显示（仅保留最近 ${limit} 条）。</td></tr>` : ""}
        </table></div>
      </details>`;
}

/** 补提重试轮询窗口：单次提取超时 × 重试次数，夹在 [60s, 10min]。
 *  新契约 /state.extractionTimeoutMs / extractionRetryAttempts 缺失=旧版 → 走缺省 120s × 3。
 *  真实提取链耗时 ≈ retryAttempts × timeoutMs + 退避，窗口太短会误报"未恢复"。 */
function retryPollWindowMs(st) {
  const s = st && typeof st === "object" ? st : {};
  const to = Number(s.extractionTimeoutMs);
  const attempts = Number(s.extractionRetryAttempts);
  const timeoutMs = Number.isFinite(to) && to > 0 ? to : 120000;
  const n = Number.isFinite(attempts) && attempts > 0 ? attempts : 3;
  return Math.min(10 * 60_000, Math.max(60_000, timeoutMs * n));
}

/** 管道健康卡：三态灯 + 分桶 + 最近 5 条详情 + 错过区间 + 失败日志 + 重试/诊断按钮。
 *  绿态折叠一行摘要；红/黄/在途展开病灶。
 *  状态优先级（绿红并置修正）：数据损坏/只读 > 未恢复区间 > 已放弃 > 「最近无失败」绿行。
 *  老逻辑里绿灯只看 streak/inFlight，出现「最近无失败」与「有区间没提取上」红条并置——
 *  两条都真但并置读不通。现在优先级走 L.healthPriorityLevel 显式判定，有未恢复/已放弃
 *  区间时绿行让位（canShowNoFailureLine 为假），状态词同步改口。 */
function buildPipeHealthCard(data) {
  const efRaw = data.extractionFailures;
  const ef = efRaw && typeof efRaw === "object" ? efRaw : null;
  const streak = L.extractionStreakOf(efRaw);
  const inFlight = data.extractionInFlight === true;
  const level = L.pipeHealthLevel(efRaw, { inFlight });
  const dotCls = level === "green" ? "green" : level === "yellow" ? "yellow" : level === "red" ? "red" : "grey";
  // 状态优先级（显式）：有未恢复/已放弃区间时不许显示「最近无失败」绿行（并置自相矛盾）
  const priority = L.healthPriorityLevel(data);
  const allowGreenLine = L.canShowNoFailureLine(priority);
  // 状态词：颜色之外的第二编码（色弱/灰度屏也能读），与灯同 aria 标注。
  // 绿灯但优先级非绿（有未恢复/已放弃区间）→ 改用优先级词，灯仍按 streak 三态。
  const statusWord = level === "green"
    ? (allowGreenLine ? "正常" : L.healthPriorityWord(priority))
    : level === "yellow" ? "告警" : level === "red" ? "失败" : "进行中";
  const statusCls = level === "green" && !allowGreenLine ? "yellow" : dotCls; // 灯色随优先级降级
  const hasDetail = ef !== null && Array.isArray(ef.recent); // recent 缺失=旧服务端
  // 未恢复区间双源（提前算，绿态摘要文案要用）：内存态 lastFailedRange 在场照旧
  // （extractionRangeText 自带 streak≥1 门），否则回落盘侧 extractionLog.unrecovered——
  // lastFailedRange 是进程内存态，DSH 一重启就归零，没有第二源的话失败区间会跨重启彻底隐身。
  const memRangeText = L.extractionRangeText(efRaw, data.lastFailedRange);
  const diskRangeText = memRangeText ? "" : L.unrecoveredTextFromLog(data.extractionLog && data.extractionLog.unrecovered);
  const parts = [];
  if (level === "green" && allowGreenLine) {
    // 绿态折叠：健康时只占一行；notice ok 复用三态色板。
    // 有未恢复/已放弃区间时（allowGreenLine=false）整段不渲染——让位给下方红条，
    // 不再出现「最近无失败」与「有区间没提取上」并置（两条都真，但并置读不通）。
    const at = data.lastAttemptAt ? ` · 上次尝试 ${L.relativeTimeOf(data.lastAttemptAt)}` : "";
    parts.push(`<div class="notice show ok" style="margin:6px 0 0">最近无失败${at}</div>`);
  } else if (level !== "green") {
    if (level === "red") {
      const notice = L.extractionNoticeText(efRaw); // 与门牌红条同文案（双端一致）
      if (notice) parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(notice)}</div>`);
    } else if (level === "yellow") {
      parts.push('<div class="notice show" style="margin:6px 0 0">近期有过提取失败或重试，现已自动恢复——下方计数供回看。</div>');
    } else {
      parts.push('<div class="meta" style="margin:6px 0 0">正在提取，结束后状态自动刷新。</div>');
    }
    parts.push(`<div style="margin:8px 0 2px">${pipeBucketsHtml(ef)}</div>`);
    if (!hasDetail) {
      // 旧服务端：桶照展示（存量字段），详情面没有就不装样子（与"recent:[]"不同文案）
      parts.push('<div class="meta">宿主版本较旧，未提供失败详情（升级宿主后可见最近 5 条病因与失败日志）。</div>');
    } else {
      const rows = ef.recent.slice(0, 5).map((r) => {
        const msg = String(r && r.message != null ? r.message : "");
        const short = msg.length > 60 ? msg.slice(0, 60) + "…" : msg;
        return `<tr><td class="meta">${esc(L.relativeTimeOf(r && r.at))}</td><td>${esc(r && r.reason)}</td><td class="meta">${esc(L.modelShortName(r && r.model) || "—")}</td><td class="meta" title="${esc(msg)}">${esc(short)}</td></tr>`;
      }).join("");
      parts.push(`
        <div class="tableScroll"><table class="preview">
          <tr><th style="width:92px">时间</th><th style="width:96px">原因</th><th style="width:150px">模型</th><th>摘要</th></tr>
          ${rows.length > 0 ? rows : '<tr><td colspan="4" class="meta">暂无最近失败详情。</td></tr>'}
        </table></div>`);
      // 失败日志入口（storageRoot 顶层字段缺失时只显示文件名）
      const logPath = data.storageRoot ? String(data.storageRoot).replace(/[\\/]+$/, "") + "/extraction-errors.log" : "extraction-errors.log";
      parts.push(`<div class="meta" style="margin-top:4px">失败日志：<code class="k">${esc(logPath)}</code></div>`);
    }
  }
  // 未恢复区间红条放在三态分支**之外**：重启后内存态失败计数也是空的（卡片会是绿态），
  // 恰恰这时最需要盘侧来源顶上。补提口径分源，不许空承诺：
  //   内存态 = 会话还活着（cursor 没推进），下一轮自动重提/立即重试都够得着；
  //   盘侧 = 重启前遗留，会话可能已释放——retryPending 只遍历在场会话（state.js），
  //          必须说清"要先重开该会话"，否则红条说可补提、按钮说没得补。
  const rangeText = memRangeText || diskRangeText;
  if (rangeText) {
    const tail = memRangeText
      ? "，下一轮自动重提。"
      : "（重启前遗留；在该会话里继续对话，或重开该会话后点「立即重试提取」，即可补提）";
    parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(rangeText)}${tail}</div>`);
  }
  // 已放弃区间（连续失败过多被放弃、游标已推进）：盘侧 journal 持久可见，
  // 不随后来任意一轮成功而消失——这部分记忆不会自动补上，必须留痕让用户知道。
  const abandonedLine = L.abandonedNoticeText(data.extractionLog && data.extractionLog.abandoned);
  if (abandonedLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">${esc(abandonedLine)}</div>`);
  // 注入面一行（消息通道注入健康）——无数据（旧版宿主/0 次）不显示，改动静默
  // 写入安全面一行（八段摘要：回收站待清/校验失败/硬事实拦截/硬事实丢失/盲写降级/sha1 不符拒写/批锁冲突/快照失败）
  //   /state.safety 缺失（旧版宿主）→ safetySummaryText 返回 null，不渲染（tolerant 消费）。
  const safetyLine = L.safetySummaryText(data.safety);
  if (safetyLine) parts.push(`<div class="meta" style="margin:4px 0 0">${esc(safetyLine)}</div>`);
  const injectionLine = L.injectionSummary(data.injection);
  if (injectionLine) parts.push(`<div class="meta" style="margin:4px 0 0">注入：${esc(injectionLine)}</div>`);
  // 最近提取记录（runs 空/缺 extractionLog = 旧版宿主或尚无提取，整块不渲染）
  const logBlock = pipeExtractionLogHtml(data);
  if (logBlock) parts.push(logBlock);
  // 存储格式只读告警——数据由更新版插件写入时显示（正常/旧版宿主不渲染；显式可见不静默）
  const formatLine = L.formatNoticeText(data.format);
  if (formatLine) parts.push(`<div class="notice show err" style="margin:6px 0 0">⚠️ ${esc(formatLine)}</div>`);
  const card = document.createElement("div");
  card.className = "card";
  card.id = "data-pipe-health"; // 门牌「详情」深链滚动锚点
  // 留一份最近 /state 供补提卡刷新时取（pending 端点只要会话探测，轮询窗口要 state 的提取超时口径）
  window.__dshLastState = data;
  card.innerHTML = `
    <h3><span class="dot ${statusCls}" role="img" aria-label="状态：${statusWord}"></span><span class="statusWord ${statusCls}" title="自动提取管道状态">${statusWord}</span>自动提取管道${inFlight ? '<span class="badge">提取中…</span>' : ""}
      <span class="ops">
        <button class="btn sm" data-retryExtract>立即重试提取</button>
        <button class="btn sm" data-copyDiag>复制诊断信息</button>
      </span>
    </h3>
    <div data-pendingRecover></div>
    ${parts.join("")}`;
  // 补提清单块（异步拉取；失败就地显示可读说明，不影响健康卡其余部分）
  card.querySelector("[data-pendingRecover]").replaceWith(buildPendingCard(data));
  card.querySelector("[data-copyDiag]").addEventListener("click", async () => {
    let text;
    try {
      text = L.diagnosticTextOf(data);
    } catch {
      text = JSON.stringify(data, null, 2); // 纯函数组装失败兜底：原始 state 也比空强
    }
    try {
      await navigator.clipboard.writeText(text);
      toast("诊断信息已复制（可直接粘贴到 issue）");
    } catch (err) { toast("复制失败：" + err.message, "err"); }
  });
  const retryBtn = card.querySelector("[data-retryExtract]");
  retryBtn.addEventListener("click", () => {
    confirmDialog({
      title: "立即重试提取",
      body: "将对仍有未提取区间的会话真的发起一次 LLM 提取（消耗少量 token）。\n期间对话不受影响；结果以这里的管道状态为准。",
      dangerText: "发起重试",
      onConfirm: async () => {
        retryBtn.disabled = true; // 三段式：202 后 busy，绝不同步 toast 成功
        retryBtn.textContent = "提取中…";
        let out;
        try {
          out = await apiPost("extract/retry"); // 202 {ok,triggered}；409 抛错文案直接透传
        } catch (err) {
          retryBtn.disabled = false;
          retryBtn.textContent = "立即重试提取";
          toast(err.message, "err");
          return;
        }
        if (Number(out && out.triggered) === 0) {
          retryBtn.disabled = false;
          retryBtn.textContent = "立即重试提取";
          toast("当前没有待重试的提取区间");
          return;
        }
        // 轮询窗口按「单次提取超时 × 重试次数」推导（下限 60s 托底、上限 10 分钟封顶），
        // 每 2s 轮询 /state，看 streak 清零才算恢复——此路径绝不再次调 retry
        pipeRetryBusy = true;
        const pollWindowMs = retryPollWindowMs(data);
        const deadline = Date.now() + pollWindowMs;
        const poll = async () => {
          let st = null;
          try { st = await api("state"); } catch { /* 单次拉取失败：继续轮 */ }
          if (st && L.extractionStreakOf(st.extractionFailures) === 0) {
            pipeRetryBusy = false;
            toast("提取已恢复");
            refreshPipeCards(); // 流程结束重取 /state 重渲染健康卡
            return;
          }
          if (Date.now() >= deadline) {
            pipeRetryBusy = false;
            // 超时如实说：窗口内没等到状态翻转，但提取可能仍在进行（不是"失败"）
            toast("等待超时：重试后仍未恢复，提取可能仍在进行——可稍后回来查看失败详情", "err");
            refreshPipeCards();
            return;
          }
          setTimeout(poll, 2000);
        };
        setTimeout(poll, 2000);
      },
    });
  });
  return card;
}

// ============ 未恢复/已放弃区间（补提 UI：GET /sessions/pending + POST /sessions/recover） ============
// 契约（后端定死）：items 按 at 降序；kind: failed=未恢复 / abandoned=已放弃；
//   sessionAvailable=false → 不空承诺（如实说明要重开会话）；hostSupported=false → 整块说明。
// 节奏：点击「补提」→ busy 三段式 → 202 后按提取超时口径轮询 pending（retryPollWindowMs 推导）
//   → 该行消失（从清单移除）即成功；窗口内没消失 → 如实说可能仍在跑，提示可回看。
let pendingPollTimer = null;

function stopPendingPoll() {
  if (pendingPollTimer) { clearTimeout(pendingPollTimer); pendingPollTimer = null; }
}

/** 补提清单卡（管道健康卡内嵌块）：hostSupported=false / 空 / 行列表三态。 */
function buildPendingCard(state) {
  const host = document.createElement("div");
  host.id = "data-pending-recover";
  host.innerHTML = '<div class="meta" style="margin:6px 0 0">正在读取待补提区间…</div>';
  // 异步拉取：pending 端点失败（旧宿主/路由未注册）→ 就地显示可重试，不炸健康卡
  api("sessions/pending")
    .then((out) => {
      const items = Array.isArray(out && out.items) ? out.items : [];
      if (items.length === 0) {
        host.innerHTML = `<div class="meta" style="margin:6px 0 0">${esc(L.PENDING_EMPTY_TEXT)}</div>`;
        return;
      }
      const hostNote = L.pendingHostNote(out && out.hostSupported);
      host.innerHTML = `
        <div class="meta" style="margin:8px 0 2px">待补提区间（${items.length} 段）：重开对应会话后点「补提」即可续上；只提示，不自动合并。</div>
        ${hostNote ? `<div class="notice show" style="margin:4px 0">${esc(hostNote)}</div>` : ""}
        <div class="tableScroll"><table class="preview" data-pendingTable>
          <tr><th style="width:130px">状态</th><th>区间与原因</th><th style="width:88px"></th></tr>
          ${items.map((it, i) => {
            const label = L.pendingItemLabel(it);
            const avail = it && it.sessionAvailable === true;
            const note = avail ? "" : `<div class="meta">${esc(L.PENDING_UNAVAILABLE_NOTE)}</div>`;
            return `<tr data-prow="${i}"><td>${esc(String(it && it.kind) === "abandoned" ? "已放弃" : "未恢复")}</td><td>${esc(label || "—")}${note}</td><td>${avail ? `<button class="btn sm" data-recover="${i}">补提</button>` : '<span class="meta">不可补提</span>'}</td></tr>`;
          }).join("")}
        </table></div>`;
      // 逐行「补提」：202 → busy → 轮询 pending 至该行消失；409 忙 / 404 会话不在 / 503 不支持 → 如实提示
      for (const btn of Array.from(host.querySelectorAll("[data-recover]"))) {
        btn.addEventListener("click", async () => {
          const i = Number(btn.getAttribute("data-recover"));
          const it = items[i];
          btn.disabled = true; btn.textContent = L.PENDING_RECOVERING_TEXT; // 三段式 busy
          let started = false;
          try {
            const out2 = await apiPost("sessions/recover", { sessionId: it.sessionId, from: it.from, to: it.to });
            started = out2 && out2.started === true;
          } catch (err) {
            btn.disabled = false; btn.textContent = "补提";
            toast("补提发起失败：" + err.message, "err");
            return;
          }
          if (!started) {
            btn.disabled = false; btn.textContent = "补提";
            toast("补提未能启动（服务端未确认开始）", "err");
            return;
          }
          // 轮询窗口按提取超时口径推导（与「立即重试提取」同一把尺：timeoutMs × attempts 夹 [60s,10min]）
          const deadline = Date.now() + retryPollWindowMs(state);
          const poll = async () => {
            let snap = null;
            try { snap = await api("sessions/pending"); } catch { /* 单次拉取失败：继续轮 */ }
            const gone = snap && Array.isArray(snap.items)
              && !snap.items.some((x) => x && String(x.sessionId) === String(it.sessionId) && Number(x.from) === Number(it.from));
            if (gone) {
              stopPendingPoll();
              toast("补提已结束，该区间已从待补列表移除");
              refreshPendingCard();
              return;
            }
            if (Date.now() >= deadline) {
              stopPendingPoll();
              // 超时如实说：没等到行消失，但提取可能仍在进行（不是失败）
              toast("等待超时：该区间仍在待补列表，补提可能仍在进行——可稍后回来查看", "err");
              btn.disabled = false; btn.textContent = "补提";
              return;
            }
            pendingPollTimer = setTimeout(poll, 2000);
          };
          stopPendingPoll();
          setTimeout(poll, 2000);
        });
      }
    })
    .catch((err) => {
      // 端点不可达（旧宿主未注册该路由）：整块隐藏而非报错——pending 是增益面，不是主干
      host.innerHTML = `<div class="meta" style="margin:6px 0 0">待补提区间暂不可读（${esc(err.message)}）</div>`;
    });
  return host;
}

/** 就地刷新补提卡（补提流程结束 / 健康卡刷新时顺路）。 */
function refreshPendingCard() {
  const host = document.getElementById("data-pending-recover");
  if (!host) return;
  const health = document.getElementById("data-pipe-health");
  if (!health) return;
  // 重建：直接替换 DOM（buildPendingCard 自带拉取），按钮 busy 态随重建复位
  const fresh = buildPendingCard(window.__dshLastState ?? {});
  host.replaceWith(fresh);
}

/** 提取模型卡（两个诚实字段 + 嵌入召回配置）：config 如实展示，
 *  实时跟随值（sessionStates）API 层摸不到，不装样子。 */
function buildPipeModelCard(data) {
  const cfg = data.extractionConfig && typeof data.extractionConfig === "object" ? data.extractionConfig : {};
  const used = data.lastUsedRoute && typeof data.lastUsedRoute === "object" ? data.lastUsedRoute : null;
  const emb = data.embeddingConfig && typeof data.embeddingConfig === "object" ? data.embeddingConfig : {};
  const fb = Array.isArray(cfg.fallback) ? cfg.fallback : [];
  const route = cfg.provider || cfg.model
    ? `${esc(cfg.provider ?? "—")} / ${esc(cfg.model ?? "—")}`
    : "未指定（跟随会话路由）";
  const fbText = fb.length > 0 ? fb.map((f) => `${esc(f && f.provider ? f.provider : "—")} / ${esc(f && f.model ? f.model : "—")}`).join("、") : "无";
  const usedText = used
    ? `${esc(used.provider ?? "—")} / ${esc(used.model ?? "—")} · ${L.relativeTimeOf(used.at)}`
    : "尚未有提取";
  const embText = emb.provider || emb.model
    ? `${esc(emb.provider ?? "—")} / ${esc(L.modelShortName(emb.model) || "—")}`
    : "未配置——语义召回未启用；配置 embeddingBaseUrl + embeddingModel 后，每轮按当前问题做嵌入检索";
  const inFlight = data.extractionInFlight === true;
  const card = document.createElement("div");
  card.className = "card";
  card.id = "data-pipe-model";
  card.innerHTML = `
    <h3>提取模型${inFlight ? '<span class="badge">提取中…</span>' : ""}</h3>
    <div class="kv"><b>提取路由</b><span>${route}<span class="meta"> · fallback：${fbText}</span></span></div>
    <div class="kv"><b>最近一次提取用车</b><span>${usedText}</span></div>
    <div class="kv"><b>嵌入模型（语义召回）</b><span>${embText}</span></div>
    <div class="meta">提取默认跟随会话路由；要指定更稳的模型，在 cordis.patch.yml 给 dsh-keepsake 配 provider/model 或 fallback（配法见 README，不硬编码任何模型）。</div>`;
  return card;
}

/** 重取 /state 就地重渲染两张管道卡（重试流程结束 / 5s 轮询共用入口）。 */
async function refreshPipeCards() {
  const health = document.getElementById("data-pipe-health"); // await 前取引用：中途切路由后 replaceWith 落在脱挂节点，无害
  if (!health) { stopPipePoll(); return; } // 路由已切走：清 timer 即可
  let data;
  try {
    data = await api("state");
  } catch {
    return; // 单次拉取失败保留旧卡，下轮轮询再试
  }
  health.replaceWith(buildPipeHealthCard(data));
  const model = document.getElementById("data-pipe-model");
  if (model) model.replaceWith(buildPipeModelCard(data));
  updateStreakBadge(L.extractionStreakOf(data.extractionFailures)); // 顺路更新红徽标
  schedulePipePoll(data);
}

/** streak>0 期间 5s 本地轮询；手动重试轮询在途时让位（重试流自管节奏）。 */
function schedulePipePoll(data) {
  stopPipePoll();
  if (L.extractionStreakOf(data.extractionFailures) < 1) return;
  pipePollTimer = setInterval(() => {
    if (!document.getElementById("data-pipe-health")) { stopPipePoll(); return; } // 双保险：路由切走
    if (!pipeRetryBusy) refreshPipeCards();
  }, 5000);
}

// ============ 页面：回收站（可逆性：列表 + 单条恢复 + 清空/按天清理） ============
// 端点：GET trash/list / POST trash/restore {id,name?} / POST trash/purge {id?,olderThanDays?}
// 风格沿用既有页：加载中占位 → 拉取 → 错误页内可见 → 卡片流；破坏操作一律确认弹窗。
async function renderTrashPage() {
  const seq = ++pageRenderSeq;
  pageTitle.textContent = "回收站";
  pageSub.textContent = "删除的记忆先进这里（默认保留 30 天），可单条恢复或清空";
  page.innerHTML = '<div class="empty">加载中…</div>';
  let listData;
  try {
    listData = await api("trash/list");
  } catch (err) {
    if (seq !== pageRenderSeq) return;
    page.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    return;
  }
  if (seq !== pageRenderSeq) return;
  const reload = () => { renderTrashPage(); refreshCounts(); };
  const entries = listData.entries ?? [];
  if (entries.length === 0) {
    page.innerHTML = '<div class="empty">回收站是空的——删除的记忆会先移到这里，过期或手动清空才真正消失。</div>';
    return;
  }
  page.innerHTML = entries.map((e, i) => `
    <div class="card"><h3><span class="badge">${e.files.length} 个文件</span> <code class="k">${esc(e.id)}</code>
      <span class="ops">
        <button class="btn sm" data-restore="${i}">恢复全部</button>
        <button class="btn sm danger" data-purge="${i}">清除此条</button>
      </span></h3>
      <div class="meta">删除于 ${esc(L.safetyEntryTimeOf(e))} · 来源会话 ${esc(L.safetyOriginText(e))}</div>
      <div class="tableScroll"><table class="preview">
        <tr><th style="width:32%">文件</th><th style="width:22%">位置</th><th style="width:88px">动作</th><th style="width:96px">sha1</th><th style="width:96px"></th></tr>
        ${e.files.map((f, j) => `<tr><td>${esc(f.name)}</td><td class="meta">${esc(L.safetyLocationText(f))}</td><td class="meta">${esc(L.safetyActionText(f.action))}</td><td class="meta">${esc(f.sha1 || "—")}</td><td><button class="btn sm" data-one="${i}:${j}">恢复此文件</button></td></tr>`).join("")}
      </table></div></div>`).join("")
    + `<div class="card"><h3>批量清理<span class="ops">
        <button class="btn sm danger" data-purgeOld>清理过期（按保留天数）</button>
        <button class="btn sm danger" data-purgeAll>清空回收站</button>
      </span></h3>
      <div class="meta">按天清理用「设置」页「保留策略」里的回收站保留天数（默认 30 天）；清空 = 全清，不可恢复。</div></div>`;
  for (const btn of Array.from(page.querySelectorAll("[data-restore]"))) {
    btn.addEventListener("click", () => {
      const e = entries[Number(btn.getAttribute("data-restore"))];
      confirmDialog({
        title: "恢复回收站条目",
        body: `将把 ${e.files.length} 个文件恢复到原位（同名文件会被覆盖），并同步对账 MEMORY.md 索引。\n确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/restore", { id: e.id });
            toast(`已恢复 ${out.restored.length} 个文件${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复全部"; }
        },
      });
    });
  }
  for (const btn of Array.from(page.querySelectorAll("[data-one]"))) {
    btn.addEventListener("click", () => {
      const [i, j] = btn.getAttribute("data-one").split(":").map(Number);
      const e = entries[i];
      const f = e.files[j];
      confirmDialog({
        title: "恢复单个文件",
        body: `将把「${esc(f.name)}」恢复到 ${esc(L.safetyLocationText(f))}（同名文件会被覆盖；被覆盖的当前版本会自动留一份快照可找回）。\n确定继续吗？`,
        dangerText: "恢复",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/restore", { id: e.id, name: f.name });
            if (out.restored.length === 0) { toast("没有文件被恢复（副本可能已缺失）", "err"); return; }
            toast(`已恢复 ${out.restored[0]}${out.indexReconciled ? "（索引已对账）" : ""}`);
            reload();
          } catch (err) { toast("恢复失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "恢复此文件"; }
        },
      });
    });
  }
  for (const btn of Array.from(page.querySelectorAll("[data-purge]"))) {
    btn.addEventListener("click", () => {
      const e = entries[Number(btn.getAttribute("data-purge"))];
      confirmDialog({
        title: "清除回收站条目",
        body: `将永久删除这条里的 ${e.files.length} 个文件副本，无法再恢复。\n确定继续吗？`,
        dangerText: "永久清除",
        onConfirm: async () => {
          btn.disabled = true; btn.textContent = "处理中…";
          try {
            const out = await apiPost("trash/purge", { id: e.id });
            toast(`已清除 ${out.purged} 条`);
            reload();
          } catch (err) { toast("清除失败：" + err.message, "err"); }
          finally { btn.disabled = false; btn.textContent = "清除此条"; }
        },
      });
    });
  }
  const purgeOldBtn = page.querySelector("[data-purgeOld]");
  purgeOldBtn.addEventListener("click", () => {
    confirmDialog({
      title: "清理过期条目",
      body: "将永久删除超过「设置」页「保留策略」里回收站保留天数的条目（默认 30 天）。\n确定继续吗？",
      dangerText: "清理过期",
      onConfirm: async () => {
        let days = 30;
        try {
          const st = await api("state");
          const d = Number(st.settings && st.settings.trashKeepDays);
          if (Number.isFinite(d) && d >= 0) days = d;
        } catch { /* 取不到就用默认 30 天，不阻断 */ }
        purgeOldBtn.disabled = true; purgeOldBtn.textContent = "处理中…";
        try {
          const out = await apiPost("trash/purge", { olderThanDays: days });
          toast(out.purged > 0 ? `已清理 ${out.purged} 条过期条目（>${days} 天）` : `没有超过 ${days} 天的条目`);
          reload();
        } catch (err) { toast("清理失败：" + err.message, "err"); }
        finally { purgeOldBtn.disabled = false; purgeOldBtn.textContent = "清理过期（按保留天数）"; }
      },
    });
  });
  const purgeAllBtn = page.querySelector("[data-purgeAll]");
  purgeAllBtn.addEventListener("click", () => {
    confirmDialog({
      title: "清空回收站",
      body: `将永久删除全部 ${entries.length} 个条目里的所有文件副本，无法再恢复。\n确定继续吗？`,
      dangerText: "全部清空",
      onConfirm: async () => {
        purgeAllBtn.disabled = true; purgeAllBtn.textContent = "处理中…";
        try {

        } catch (err) { toast("清空失败：" + err.message, "err"); }
        finally { purgeAllBtn.disabled = false; purgeAllBtn.textContent = "清空回收站"; }
      },
    });
  });
}

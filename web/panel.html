<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆管理</title>
<style>
  /* 自带深浅双档兜底（方案C §1.3 降级）：桥成功时由主题桥覆写 --dsw-alias-* */
  body { --fb-bg: #f7f8fa; --fb-panel: #ffffff; --fb-label: #1f2328; --fb-label2: #59636e; --fb-border: rgba(27,31,36,.12); }
  body.theme-dark { --fb-bg: #17181c; --fb-panel: #1f2126; --fb-label: #e6e8eb; --fb-label2: #9aa2ab; --fb-border: rgba(240,244,248,.14); }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--dsw-alias-bg-layer-1, var(--fb-bg));
    color: var(--dsw-alias-label-primary, var(--fb-label));
    display: flex; min-height: 100vh;
  }
  aside {
    width: 200px; flex: none; padding: 18px 12px; border-right: 1px solid var(--dsw-alias-border-l2, var(--fb-border));
    background: var(--dsw-alias-bg-layer-2, var(--fb-panel));
    display: flex; flex-direction: column; gap: 2px;
  }
  aside .brand { font-weight: 700; font-size: 15px; padding: 2px 10px 12px; }
  aside .group { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); padding: 10px 10px 4px; font-weight: 600; }
  aside a {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding: 6px 10px; border-radius: 8px; font-size: 13px; cursor: pointer; user-select: none;
    color: var(--dsw-alias-label-primary, var(--fb-label)); text-decoration: none;
  }
  aside a:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(128,128,128,.1)); }
  aside a.on { background: var(--dsw-alias-button-ghost-active-fill, rgba(128,128,128,.16)); font-weight: 600; }
  aside a .cnt { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-weight: 400; }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 20px; border-bottom: 1px solid var(--dsw-alias-border-l2, var(--fb-border));
    background: var(--dsw-alias-bg-layer-2, var(--fb-panel));
  }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar .sub { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); margin-left: 8px; }
  .btn {
    border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); background: transparent; color: inherit;
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: var(--dsw-alias-interactive-bg-hover, rgba(128,128,128,.12)); }
  .notice {
    margin: 12px 20px 0; border-radius: 6px; padding: 6px 10px; font-size: 12px;
    background: rgba(204,153,102,.16); display: none;
  }
  .notice.show { display: block; }
  #page { padding: 18px 20px; overflow: auto; }
  .card {
    border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); border-radius: 10px;
    background: var(--dsw-alias-bg-layer-2, var(--fb-panel));
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card h3 { margin: 0 0 6px; font-size: 13.5px; }
  .meta { font-size: 12px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .entry-body { margin-top: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--dsw-alias-label-secondary, var(--fb-label2)); font-size: 13px; padding: 24px 0; text-align: center; }
  .kv { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; font-size: 13px; }
  .kv b { min-width: 110px; font-weight: 600; }
  code { font-family: Consolas, monospace; font-size: 12px; background: rgba(128,128,128,.12); border-radius: 4px; padding: 0 4px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--dsw-alias-border-l2, var(--fb-border)); color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
  .m1tag { font-size: 11px; color: var(--dsw-alias-label-secondary, var(--fb-label2)); }
</style>
</head>
<body>
  <aside id="nav">
    <div class="brand">记忆管理</div>
    <div class="group">记忆管理</div>
    <a data-route="category/work-profile">工作背景 <span class="cnt" data-cnt="work-profile"></span></a>
    <a data-route="category/user-profile">用户个人背景 <span class="cnt" data-cnt="user-profile"></span></a>
    <a data-route="category/current-focus">当前关注 <span class="cnt" data-cnt="current-focus"></span></a>
    <a data-route="category/recent-activity">近期动态 <span class="cnt" data-cnt="recent-activity"></span></a>
    <div class="group">通用</div>
    <a data-route="long-term">长期记忆 <span class="cnt" data-cnt="long-term"></span></a>
    <a data-route="persona">人设</a>
    <a data-route="addressing">称呼</a>
    <a data-route="projects">项目记忆 <span class="cnt" data-cnt="projects"></span></a>
    <a data-route="settings">设置</a>
  </aside>
  <main>
    <div class="topbar">
      <div><h1 id="pageTitle">记忆管理</h1><span class="sub" id="pageSub">M1 只读视图</span></div>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="themeToggle" title="主题桥失败时的手动降级开关">◐ 手动深浅</button>
        <button class="btn" id="backBtn">← 返回设置</button>
      </div>
    </div>
    <div class="notice" id="bridgeNotice">未能自动跟随主题（主题桥不可用）——已切换为手动深浅档，右上角可切换。</div>
    <div id="page"></div>
  </main>

<script>
(function () {
  "use strict";
  var state = null; // /api/state 轻态
  var page = document.getElementById("page");
  var pageTitle = document.getElementById("pageTitle");

  // ============ 主题桥（M0 P7 已验：postMessage 主路径 + 直读兜底 + Observer 跟色） ============
  var hostWindow = (function () {
    try { if (window.opener && window.opener !== window) return window.opener; } catch (e) {}
    try { if (window.parent && window.parent !== window) return window.parent; } catch (e) {}
    return null;
  })();
  var manualTheme = false;

  function applyVars(vars) {
    var applied = 0;
    for (var name in vars) {
      if (Object.prototype.hasOwnProperty.call(vars, name) && name.indexOf("--dsw-alias-") === 0) {
        document.body.style.setProperty(name, vars[name]);
        applied += 1;
      }
    }
    if (applied > 0 && !manualTheme) {
      document.getElementById("bridgeNotice").classList.remove("show");
      document.getElementById("themeToggle").style.display = "none";
    }
    return applied;
  }

  function collectForeignVars(hostDoc) {
    var vars = {};
    try {
      var computed = hostDoc.defaultView.getComputedStyle(hostDoc.body);
      var names = {};
      Array.from(hostDoc.styleSheets).forEach(function (sheet) {
        var rules;
        try { rules = sheet.cssRules; } catch (e) { return; }
        Array.from(rules).forEach(function (rule) {
          if (!rule || !rule.style) return;
          for (var i = 0; i < rule.style.length; i += 1) {
            var n = rule.style[i];
            if (typeof n === "string" && n.indexOf("--dsw-alias-") === 0) names[n] = true;
          }
        });
      });
      Object.keys(names).forEach(function (n) {
        var v = computed.getPropertyValue(n);
        if (typeof v === "string" && v.length > 0) vars[n] = v.trim();
      });
    } catch (e) { /* 跨文档拒绝：桥失败降级 */ }
    return vars;
  }

  function startThemeBridge() {
    if (!hostWindow) {
      document.getElementById("bridgeNotice").classList.add("show");
      return;
    }
    // 直读（window.open/iframe 同源场景）
    var vars = collectForeignVars(hostWindow.document);
    if (Object.keys(vars).length > 0) applyVars(vars);
    else document.getElementById("bridgeNotice").classList.add("show");
    // postMessage 握手（门牌回递）
    window.addEventListener("message", function (ev) {
      if (ev && ev.data && ev.data.type === "dsh-memory:theme" && ev.data.vars) applyVars(ev.data.vars);
    });
    // Observer 跟色（M0 实测变更点：body data-ds-dark-theme / html data-ds-theme-source 等）
    try {
      var pending = false;
      var observer = new MutationObserver(function () {
        if (pending) return;
        pending = true;
        setTimeout(function () {
          pending = false;
          applyVars(collectForeignVars(hostWindow.document));
        }, 50);
      });
      var filter = ["style", "class", "data-ds-dark-theme", "data-ds-theme-source"];
      observer.observe(hostWindow.document.body, { attributes: true, attributeFilter: filter });
      observer.observe(hostWindow.document.documentElement, { attributes: true, attributeFilter: filter });
    } catch (e) { /* Observer 挂载失败：保留静态变量 */ }
    // 握手回执
    try { hostWindow.postMessage({ type: "dsh-memory:panel-ready" }, "*"); } catch (e) {}
  }

  document.getElementById("themeToggle").addEventListener("click", function () {
    manualTheme = true;
    document.body.classList.toggle("theme-dark");
  });
  document.getElementById("backBtn").addEventListener("click", function () {
    if (window.history.length > 1) window.history.back();
    else window.location.href = "/";
  });

  // ============ API helper（M1：逻辑全走 API，本地无状态层） ============
  function api(path) {
    return fetch("/dsh-memory/api/" + path).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function fmtTime(ms) {
    if (!ms) return "—";
    var d = new Date(ms);
    var pad = function (n) { return String(n).padStart(2, "0"); };
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function fmtAge(entry) {
    var ts = entry.timestamp ? Date.parse(entry.timestamp) : entry.mtimeMs;
    if (!isFinite(ts)) return "";
    var days = Math.floor((Date.now() - ts) / 86400000);
    return days <= 0 ? "今天" : days === 1 ? "1 天前" : days + " 天前";
  }

  // ============ 路由与页面（M1 只读视图；写交互 M2 填充） ============
  var ROUTES = {
    "category/work-profile": { title: "工作背景", category: "work-profile" },
    "category/user-profile": { title: "用户个人背景", category: "user-profile" },
    "category/current-focus": { title: "当前关注", category: "current-focus" },
    "category/recent-activity": { title: "近期动态", category: "recent-activity" },
    "long-term": { title: "长期记忆", category: "long-term" },
    "persona": { title: "人设" },
    "addressing": { title: "称呼" },
    "projects": { title: "项目记忆" },
    "settings": { title: "设置" },
  };

  function renderCategoryPage(cfg) {
    pageTitle.textContent = cfg.title;
    page.innerHTML = '<div class="empty">加载中…</div>';
    api("category/" + cfg.category).then(function (data) {
      if (!data.entries || data.entries.length === 0) {
        page.innerHTML = '<div class="empty">暂无条目。对话中聊到相关信息后，DSH 会自动归类到这里。</div>';
        return;
      }
      page.innerHTML = data.entries.map(function (e) {
        var age = cfg.category === "recent-activity" ? '<span class="badge">' + esc(fmtAge(e)) + '</span> ' : "";
        return '<div class="card">' +
          '<h3>' + age + esc(e.title) + '</h3>' +
          (e.description ? '<div class="meta">' + esc(e.description) + '</div>' : "") +
          '<div class="meta">' + esc(e.name) + ' · ' + esc(fmtTime(e.mtimeMs)) + '</div>' +
          '<div class="entry-body">' + esc(e.content) + '</div>' +
          '</div>';
      }).join("") + '<div class="m1tag">M1 只读视图——编辑 / 重置 / 导入 三按钮将在 M2 提供。</div>';
    }).catch(function (err) {
      page.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function renderPersonaPage() {
    pageTitle.textContent = "人设";
    page.innerHTML = '<div class="empty">加载中…</div>';
    api("persona").then(function (data) {
      page.innerHTML =
        '<div class="card"><h3>当前人设' + (data.isDefault ? ' <span class="badge">出厂默认</span>' : "") + '</h3>' +
        '<div class="entry-body">' + esc(data.content) + '</div></div>' +
        '<div class="m1tag">M1 只读视图——分栏编辑 / 预设模板 / 恢复默认 将在 M2 提供。</div>';
    }).catch(function (err) {
      page.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function renderAddressingPage() {
    pageTitle.textContent = "称呼";
    page.innerHTML = '<div class="empty">加载中…</div>';
    api("addressing").then(function (data) {
      page.innerHTML =
        '<div class="card">' +
        '<div class="kv"><b>DSH 的名字</b><span>' + (data.dshName ? esc(data.dshName) : '<span class="meta">（未设置）</span>') + '</span></div>' +
        '<div class="kv"><b>对我的称呼</b><span>' + (data.userAlias ? esc(data.userAlias) : '<span class="meta">（未设置）</span>') + '</span></div>' +
        '</div>' +
        '<div class="m1tag">M1 只读视图——门牌上的两个输入框（即时保存）将在 M2 提供。</div>';
    }).catch(function (err) {
      page.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function renderProjectsPage() {
    pageTitle.textContent = "项目记忆";
    page.innerHTML = '<div class="empty">加载中…</div>';
    api("state").then(function (data) {
      var projects = data.projects || [];
      if (projects.length === 0) {
        page.innerHTML = '<div class="empty">暂无项目记忆。项目记忆由对话自动维护（只读）。</div>';
        return;
      }
      page.innerHTML = projects.map(function (p) {
        return '<div class="card"><h3><code>' + esc(p.id) + '</code></h3>' +
          '<div class="meta">' + p.entries + ' 条 · 最后更新 ' + esc(fmtTime(p.lastMtimeMs)) + '</div></div>';
      }).join("") + '<div class="m1tag">项目记忆只读——由对话自动维护；单项目导出将在 M2 提供。</div>';
    }).catch(function (err) {
      page.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function renderSettingsPage() {
    pageTitle.textContent = "设置";
    page.innerHTML = '<div class="empty">加载中…</div>';
    api("state").then(function (data) {
      var s = data.settings || {};
      var row = function (label, on) {
        return '<div class="kv"><b>' + label + '</b><span class="badge">' + (on ? "已开启" : "已关闭") + '</span></div>';
      };
      page.innerHTML =
        '<div class="card"><h3>开关</h3>' +
        row("对话记忆（总开关）", s.conversationMemory) +
        row("项目记忆", s.projectMemory) +
        row("全局自动提取", s.globalExtraction) +
        '</div>' +
        (data.corrupt ? '<div class="card" style="border-color:rgba(221,85,85,.5)">settings.json 解析失败，已按缺省（全开）运行。</div>' : "") +
        '<div class="m1tag">M1 只读视图——开关切换 / 导出全部 / 清空全部（带备份）将在 M2 提供。</div>';
    }).catch(function (err) {
      page.innerHTML = '<div class="empty">加载失败：' + esc(err.message) + '</div>';
    });
  }

  function currentRoute() {
    var hash = location.hash.replace(/^#\/?/, "");
    return ROUTES[hash] ? hash : "category/work-profile";
  }

  function render() {
    var route = currentRoute();
    var cfg = ROUTES[route];
    Array.from(document.querySelectorAll("aside a")).forEach(function (a) {
      a.classList.toggle("on", a.getAttribute("data-route") === route);
    });
    if (cfg.category) renderCategoryPage(cfg);
    else if (route === "persona") renderPersonaPage();
    else if (route === "addressing") renderAddressingPage();
    else if (route === "projects") renderProjectsPage();
    else if (route === "settings") renderSettingsPage();
  }

  Array.from(document.querySelectorAll("aside a")).forEach(function (a) {
    a.addEventListener("click", function () {
      location.hash = "#/" + a.getAttribute("data-route");
    });
  });
  window.addEventListener("hashchange", render);

  // 导航计数（state 轻态）
  function refreshCounts() {
    api("state").then(function (data) {
      state = data;
      var byCat = (data.counts && data.counts.byCategory) || {};
      Array.from(document.querySelectorAll("[data-cnt]")).forEach(function (el) {
        var key = el.getAttribute("data-cnt");
        var n = key === "projects" ? (data.counts ? data.counts.projects : 0) : (byCat[key] || 0);
        el.textContent = n > 0 ? String(n) : "";
      });
    }).catch(function () { /* 计数失败不炸导航 */ });
  }

  // ============ 启动 ============
  window.addEventListener("load", function () {
    startThemeBridge();
    refreshCounts();
    render();
  });
})();
</script>
</body>
</html>

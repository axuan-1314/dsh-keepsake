name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **请勿粘贴真实记忆内容或 API Key。**
        管道类问题可以先去设置页健康卡点「复制诊断信息」——那份摘要不含会话内容。

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 见 package.json 或面板
      placeholder: 0.7.0
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: DSH 版本与 profile
      placeholder: 0.2.0-rc.2 / desktop
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 开新会话
        2. 聊三轮...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期表现
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际表现
      description: 有报错就贴原文；面板红条、健康卡状态也贴上来
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息（可选）
      description: 健康卡「复制诊断信息」的输出
      render: text
    validations:
      required: false

# dsh-memory — 项目记忆自动提取+注入 cordis 插件的 loader 配置。
# 插入为独立 entry；config 为插件唯一配置面（apply(ctx, config) 第二参）。
# enabled 默认显式开：安装即启用；回滚 = 把 enabled 改 false（HMR 生效）
# 或 dsh plugin --profile <name> remove dsh-memory（整包卸载）。
# 用户可感知开关（对话记忆/项目记忆/全局提取）不在此处——走
# ~/.dsh/memory/settings.json（host 每轮读取，改完下一轮即生效，绕开 desktop 重启限制）。
- insert:
    - id: dsh-memory
      name: dsh-memory
      config:
        enabled: true
        # 批次A（v0.2.0）：注入通道。message=durable 用户消息通道（默认，全 preset 生效，
        # 根治 minimal 预设 complete:true 静默丢注入）；section=旧四段 systemPrompt 注入（一键回滚）。
        injectChannel: message
        injectMaxChars: 60000
        # 批次B B1（v0.3.0）：语义召回。本机（作者环境）指向本地 embed-model-2 服务：
        # http://127.0.0.1:11434/v1/embeddings（OpenAI 兼容，768 维）——记忆文本不出本机。
        # 他人部署请改成自己的端点，或把 recallEnabled 置 false（不配置即不产生任何嵌入调用）。
        recallEnabled: true
        embeddingProvider: local-eg2
        embeddingModel: onnx-community/embed-model-2-ONNX
        embeddingBaseUrl: http://127.0.0.1:11434/v1/embeddings
        provider: null
        model: null
        minUserWords: 3
        timeoutMs: 120000
        maxOutputTokens: 4096
        maxIndexLines: 200
        maxIndexChars: 25000
        maxManifestFiles: 200
        maxPromptChars: 48000
        maxOps: 20
        recentKeepCount: 30
        recentKeepDays: 30

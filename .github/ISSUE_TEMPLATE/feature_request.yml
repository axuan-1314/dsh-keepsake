name: Feature request
description: 提一个功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前先看一眼 [ROADMAP.md](../blob/main/ROADMAP.md) 的「有意不做」——有些方向是被明确否决过的，理由写在里面。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说你遇到的具体场景，比说"希望更智能"有用得多
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案
    validations:
      required: false
